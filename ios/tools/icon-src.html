<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2e7d5b; }
  .wrap {
    width: 100vw; height: 100vh; display: grid; place-items: center; position: relative;
    background: linear-gradient(152deg, #3a9d73 0%, #2e7d5b 46%, #1c5640 100%);
  }
  .wrap::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 28% 16%, rgba(255,255,255,.26), transparent 58%);
  }
  .glyph {
    position: relative; z-index: 2;
    font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
    font-weight: 700; color: #fff; font-size: 57vh; line-height: 1;
    transform: translateY(1%);
    text-shadow: 0 1.4vh 3.4vh rgba(0,0,0,.2);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glyph">成</div>
  </div>
</body>
</html>
