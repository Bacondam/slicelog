/* ==================== 目标页 ==================== */
const catOrder = name => {
  const i = CATS.findIndex(c => c[0] === name);
  return i < 0 ? 99 : i;
};

function goalSubStats(g) {
  const list = g.subtasks || [];
  const done = list.filter(t => t.done).length;
  return { total: list.length, done, left: list.length - done };
}

function goalCardHTML(g, collapsible) {
  const p = goalPct(g);
  const dl = goalDeadline(g);
  const st = goalSubStats(g);
  const subs = (g.subtasks || []).map(t => `
      <li class="sub-item${t.done ? ' done' : ''}">
        ${g.done
      ? `<span class="sub-check${t.done ? ' on' : ''}">${t.done ? '✓' : ''}</span>`
      : `<button class="sub-check${t.done ? ' on' : ''}" data-action="toggle-sub" data-id="${g.id}" data-sub="${t.id}" title="${t.done ? '标记为未完成' : '标记完成'}">${t.done ? '✓' : ''}</button>`}
        <span class="sub-title">${esc(t.title)}</span>
        ${g.done ? '' : `<button class="sub-del" data-action="del-sub" data-id="${g.id}" data-sub="${t.id}" title="删除小目标">✕</button>`}
      </li>`).join('');

  const blocked = !g.done && st.left > 0;
  return `<article class="goal-card card${g.done ? ' is-done' : ''}">
      <div class="goal-top">
        <button class="goal-check${g.done ? ' on' : ''}${blocked ? ' locked' : ''}" data-action="toggle-goal" data-id="${g.id}" title="${g.done ? '恢复为进行中' : blocked ? `还有 ${st.left} 个小目标没完成` : '标记为已完成'}">${blocked ? '!' : '✓'}</button>
        <span class="chip cat-${catClass(g.category)}">${esc(g.category || '其他')}</span>
        <div class="chips">
          ${collapsible ? `<button class="collapse-btn pm minus" data-action="toggle-done-one" data-id="${g.id}" title="收起这条已完成目标" aria-label="收起">⊖</button>` : ''}
          <button class="icon-btn" data-action="edit-goal" data-id="${g.id}" title="编辑">✏️</button>
          <button class="icon-btn danger" data-action="del-goal" data-id="${g.id}" title="删除">🗑️</button>
        </div>
      </div>
      <h3 class="goal-title">${esc(g.title)}</h3>
      ${g.note ? `<div class="note">${esc(g.note)}</div>` : ''}
      <div class="progress" style="margin-top:12px"><i style="width:${p}%"></i></div>
      <div class="goal-meta"><strong>${fmtNum(g.current)} / ${fmtNum(g.target)} ${esc(g.unit || '')}</strong><span>${p}%</span></div>
      <div class="sub-wrap">
        <div class="sub-head"><span>小目标${st.total ? ` · 还剩 ${st.left} 个` : ''}</span><span>${st.done}/${st.total}</span></div>
        ${st.total ? `<ul class="sub-list">${subs}</ul>` : `<div class="sub-empty">${g.done ? '没有小目标' : '把它拆小一点，更容易开始'}</div>`}
        ${blocked ? `<div class="sub-note">⏳ 还有 ${st.left} 个小目标没完成，全部勾完才能结束这个目标</div>` : ''}
        ${g.done ? '' : `<form class="sub-add" data-form="sub" data-id="${g.id}"><input name="title" maxlength="80" placeholder="+ 添加小目标，回车保存" autocomplete="off"></form>`}
      </div>
      <div class="goal-foot">
        <span class="${g.done ? '' : dl.cls}">${g.done ? '已完成' : dl.text}</span>
        ${g.done
      ? `<span>${g.doneAt ? '完成于 ' + fmtDate(toKey(new Date(g.doneAt))) : ''}</span>`
      : `<div class="stepper">
          <button data-action="goal-minus" data-id="${g.id}" title="减少">−</button>
          <button data-action="goal-plus" data-id="${g.id}" title="增加">＋</button>
        </div>`}
      </div>
    </article>`;
}

/** 已完成目标的展开状态：{ goalId: true } */
function ensureDoneOpenMap() {
  const s = state.settings = state.settings || {};
  if (!s.doneOpen || typeof s.doneOpen !== 'object' || Array.isArray(s.doneOpen)) s.doneOpen = {};
  return s.doneOpen;
}

function renderGoals() {
  const all = state.goals;
  const active = all.filter(g => !g.done).sort((a, b) => {
    const da = a.deadline || '9999-12-31';
    const db = b.deadline || '9999-12-31';
    return String(da).localeCompare(String(db)) || (a.createdAt || 0) - (b.createdAt || 0);
  });
  const finished = all.filter(g => g.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  const counts = {};
  all.forEach(g => { const k = g.category || '其他'; counts[k] = (counts[k] || 0) + 1; });
  const cats = CATS.map(c => c[0]).filter(name => counts[name] > 0);
  if (goalFilter !== 'all' && !cats.includes(goalFilter)) goalFilter = 'all';

  const match = g => goalFilter === 'all' || (g.category || '其他') === goalFilter;
  const activeShown = active.filter(match);
  const doneShown = finished.filter(match);

  const groupHTML = (list, emptyText) => {
    if (!list.length) return `<div class="card" style="background:transparent;border-style:dashed"><div class="empty">${emptyText}</div></div>`;
    const order = [...new Set(list.map(g => g.category || '其他'))]
      .sort((a, b) => catOrder(a) - catOrder(b) || String(a).localeCompare(String(b)));
    return order.map(cat => {
      const items = list.filter(g => (g.category || '其他') === cat);
      return `<div class="goal-group">
        <div class="group-head">${esc(cat)}<span class="cnt">${items.length}</span></div>
        <div class="goal-grid">${items.map(goalCardHTML).join('')}</div>
      </div>`;
    }).join('');
  };

  const head = `
    <div class="page-actions">
      <h2>进行中 ${active.length} 个${finished.length ? ` · 已完成 ${finished.length} 个` : ''}</h2>
      <button class="btn primary" data-action="add-goal">+ 新建目标</button>
    </div>
    ${all.length ? `<div class="goal-filters">
      <button class="filter-chip${goalFilter === 'all' ? ' on' : ''}" data-action="goal-filter" data-cat="all">全部 ${all.length}</button>
      ${cats.map(n => `<button class="filter-chip${goalFilter === n ? ' on' : ''}" data-action="goal-filter" data-cat="${esc(n)}">${esc(n)} ${counts[n]}</button>`).join('')}
    </div>` : ''}`;

  const doneMap = (state.settings.doneOpen && typeof state.settings.doneOpen === 'object') ? state.settings.doneOpen : {};
  const anyDoneClosed = doneShown.some(g => !doneMap[g.id]);
  const doneSection = doneShown.length
    ? `<div class="done-list">${doneShown.map(g => doneMap[g.id]
      ? goalCardHTML(g, true)
      : `<button class="done-strip" data-action="toggle-done-one" data-id="${g.id}" aria-expanded="false" title="展开这条已完成目标">
           <span class="ds-tick">✓</span>
           <span class="ds-titles">${esc(g.title)}</span>
           <span class="collapse-btn pm" aria-hidden="true">⊕</span>
         </button>`).join('')}</div>`
    : groupHTML(doneShown, '完成的目标会保留在这里，一条一个，随时可以展开回顾。');

  $('#view-goals').innerHTML = all.length ? `${head}
    <section class="goal-section">
      <div class="section-head"><h3>进行中</h3><span class="cnt">${activeShown.length}</span></div>
      ${groupHTML(activeShown, goalFilter === 'all' ? '还没有进行中的目标，点右上角新建一个。' : `「${esc(goalFilter)}」分类下没有进行中的目标。`)}
    </section>
    <section class="goal-section">
      <div class="section-head"><h3>已完成</h3><span class="cnt">${doneShown.length}</span>
        ${doneShown.length ? `<button class="collapse-btn pm${anyDoneClosed ? '' : ' minus'}" style="margin-left:auto" data-action="toggle-done-goals" title="${anyDoneClosed ? '展开全部已完成目标' : '收起全部已完成目标'}" aria-label="${anyDoneClosed ? '展开全部' : '收起全部'}">${anyDoneClosed ? '⊕' : '⊖'}</button>` : ''}
      </div>
      ${doneSection}
    </section>` : `${head}
    <div class="card"><div class="empty"><div class="big">🎯</div>还没有目标。把想做成的事写下来，再拆成几个小目标。<div style="margin-top:12px"><button class="btn primary" data-action="add-goal">+ 新建第一个目标</button></div></div></div>`;
}

function journalEntryHTML(j) {

  return `<article class="journal-entry card">

        <div class="chips">
          <button class="icon-btn" data-action="edit-journal" data-id="${j.id}" title="编辑">✏️</button>
          <button class="icon-btn danger" data-action="del-journal" data-id="${j.id}" title="删除">🗑️</button>
        </div>
      </header>
      ${j.good ? `<p><span class="label">做得好</span>${esc(j.good)}</p>` : ''}
      ${j.improve ? `<p><span class="label warn">可改进</span>${esc(j.improve)}</p>` : ''}

/** 折叠状态：未记录过时用 def */
function foldOpen(key, def) {
  const f = state.settings.journalFold;
  if (f && Object.prototype.hasOwnProperty.call(f, key)) return !!f[key];
  return !!def;
}

function renderJournal() {
  const editing = editingJournal ? state.journal.find(j => j.id === editingJournal) : null;
  const entries = [...state.journal].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0));
  const editMonth = editing ? String(editing.date).slice(0, 7) : '';

  // 按年 → 月 分组
  const yearMap = new Map();
  entries.forEach(j => {
    const y = String(j.date || '').slice(0, 4) || '未知';
    const m = String(j.date || '').slice(0, 7) || y;
    if (!yearMap.has(y)) yearMap.set(y, new Map());
    const mm = yearMap.get(y);
    if (!mm.has(m)) mm.set(m, []);
    mm.get(m).push(j);
  });

  let yIdx = 0;
  const groupsHTML = [...yearMap.entries()].map(([year, months]) => {
    const yearCount = [...months.values()].reduce((a, l) => a + l.length, 0);
    const yearKey = 'y:' + year;
    const forcedByEdit = editMonth.slice(0, 4) === year;
    const yearOpen = foldOpen(yearKey, yIdx === 0) || forcedByEdit;

    let mIdx = 0;
    const monthsHTML = [...months.entries()].map(([mKey, list]) => {
      const monthKey = 'm:' + mKey;
      const monthOpen = foldOpen(monthKey, yIdx === 0 && mIdx === 0) || editMonth === mKey;
      mIdx++;
      const label = mKey.includes('-') ? `${Number(mKey.slice(5, 7))} 月` : '未标注月份';
      return `<div class="fold-block">
        <button class="fold-head${monthOpen ? ' open' : ''}" data-action="fold-journal" data-key="${monthKey}" data-open="${monthOpen ? 1 : 0}" aria-expanded="${monthOpen}">
          <span class="collapse-btn pm fold-pm${monthOpen ? ' minus' : ''}" aria-hidden="true">${monthOpen ? '⊖' : '⊕'}</span><span class="fname">${label}</span>
          <span class="fcount">${list.length} 篇</span>
        </button>
        ${monthOpen ? `<div class="fold-body">${list.map(journalEntryHTML).join('')}</div>` : ''}
      </div>`;
    }).join('');

    yIdx++;
    return `<div class="fold-block">
      <button class="fold-head${yearOpen ? ' open' : ''}" data-action="fold-journal" data-key="${yearKey}" data-open="${yearOpen ? 1 : 0}" aria-expanded="${yearOpen}">
        <span class="collapse-btn pm fold-pm${yearOpen ? ' minus' : ''}" aria-hidden="true">${yearOpen ? '⊖' : '⊕'}</span><span class="fname">${esc(year)} 年</span>
        <span class="ftag">${months.size} 个月</span>
        <span class="fcount">${yearCount} 篇</span>
      </button>
      ${yearOpen ? `<div class="fold-sub">${monthsHTML}</div>` : ''}
    </div>`;
  }).join('');

  $('#view-journal').innerHTML = `
    ${journalFormHTML(editing, !!editing)}
    ${entries.length ? `<div class="card">
      <div class="card-head"><h3>日记归档 <span class="small muted">共 ${entries.length} 篇</span></h3>
        <button class="link-btn" data-action="fold-journal-all" data-open="1">全部展开</button>
      </div>
      ${groupsHTML}
    </div>` : `<div class="card"><div class="empty"><div class="big">✍️</div>还没有日记。每天 2 分钟，写下三件小事就够了。</div></div>`}`;
}

/* ==================== 记账页 ==================== */
function renderFinance() {
  if (financeMode === 'year') { renderFinanceYear(); return; }
  const month = financeMonth;
  const sum = financeSummary(month);
  const budget = Number(state.finance.budget) || 0;
  const remaining = budget - sum.expense;
  const usedPct = budget ? Math.round(sum.expense / budget * 1000) / 10 : 0;
  const over = budget > 0 && sum.expense > budget;
  const incomeCount = sum.list.filter(t => t.type === 'income').length;
  const expenseCount = sum.list.length - incomeCount;

  const summary = [
    { label: '本月收入', value: fmtMoney(sum.income), icon: '📈', hint: `${incomeCount} 笔` },
    { label: '本月支出', value: fmtMoney(sum.expense), icon: '📉', hint: `${expenseCount} 笔` },
    { label: '本月结余', value: fmtMoney(sum.balance), icon: '💰', hint: sum.balance >= 0 ? '保持正结余' : '支出超过收入' },
    { label: '预算剩余', value: budget ? fmtMoney(remaining) : '未设置', icon: '🎯', hint: budget ? (over ? `已超支 ${fmtMoney(-remaining)}` : `预算 ${fmtMoneyShort(budget)} · 已用 ${usedPct}%`) : '点击设置月度预算', action: 'edit-budget' }
  ];

  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const nowDate = new Date();
  const daysInMonth = month === todayKey().slice(0, 7)
    ? nowDate.getDate()
    : new Date(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0).getDate();
  const dailyAvg = daysInMonth ? sum.expense / daysInMonth : 0;
  const topCat = cats[0];
  const catHTML = cats.length ? cats.map(([name, amount]) => {
    const c = finCat('expense', name);
    const w = maxCat ? Math.max(3, amount / maxCat * 100) : 0;
    const share = sum.expense ? Math.round(amount / sum.expense * 1000) / 10 : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span>${c.icon} ${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('expense', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这个月还没有支出记录。</div>`;
  const catItems = cats.map(([name, amount]) => ({
    label: `${finCat('expense', name).icon} ${name}`,
    value: amount,
    color: finCatColor('expense', name),
    valueText: fmtMoney(amount)
  }));
  const quickOpen = !state.settings.finQuickCollapsed;

  const filtered = sum.list
    .filter(t => financeFilter === 'all' || t.type === financeFilter)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0));
  const rows = filtered.map(t => {
    const c = finCat(t.type, t.category);
    return `<div class="tx-row">
      <div class="tx-icon">${c.icon}</div>
      <div class="tx-main">
        <div class="tx-title">${esc(t.category)}<span class="chip ${t.type}">${t.type === 'income' ? '收入' : '支出'}</span></div>
        <div class="tx-sub">${fmtDateShort(t.date)}${t.note ? ' · ' + esc(t.note) : ''}</div>
      </div>
      <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '−'}${fmtMoney(t.amount)}</div>
      <div class="chips">
        <button class="icon-btn" data-action="edit-tx" data-id="${t.id}" title="编辑">✏️</button>
        <button class="icon-btn danger" data-action="del-tx" data-id="${t.id}" title="删除">🗑️</button>
      </div>
    </div>`;
  }).join('');

  const defaultDate = month === todayKey().slice(0, 7) ? todayKey() : `${month}-01`;
  const emptyText = financeFilter === 'all' ? '这个月还没有记录。' : financeFilter === 'income' ? '这个月还没有收入记录。' : '这个月还没有支出记录。';
  const navHTML = `<div class="month-nav">
      <button class="nav-btn" data-action="fin-prev" title="上个月">‹</button>
      <strong>${monthLabel(month)}</strong>
      <button class="nav-btn" data-action="fin-next" title="下个月">›</button>
      ${month !== todayKey().slice(0, 7) ? `<button class="link-btn" data-action="fin-now">回到本月</button>` : ''}
    </div>`;

  $('#view-finance').innerHTML = `
    ${financeHeader(navHTML)}
    <div class="fin-stats">
      ${summary.map(s => `<div class="stat${s.action ? ' clickable' : ''}"${s.action ? ` data-action="${s.action}"` : ''}>
        <div class="stat-top"><span>${s.label}</span><span>${s.icon}</span></div>
        <strong class="money" style="font-size:19px">${s.value}</strong>
        <div class="hint">${s.hint}</div>
      </div>`).join('')}
    </div>
    <div class="grid-2 fin-grid">
      <div class="fin-left">
        <form class="card" data-form="tx" id="txForm">
          <div class="card-head">
            <h3>快速记一笔</h3>
            <div class="chips">
              <span class="small muted">${monthLabel(month)}</span>
              <button type="button" class="collapse-btn pm${quickOpen ? ' minus' : ''}" data-action="toggle-quick" title="${quickOpen ? '收起记录表单' : '展开记录表单'}" aria-label="${quickOpen ? '收起记录表单' : '展开记录表单'}">${quickOpen ? '⊖' : '⊕'}</button>
            </div>
          </div>
          <div class="quick-body"${quickOpen ? '' : ' hidden'}>
            <div class="form-row three">
              <label>类型<select name="type" data-fin-type>
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select></label>
              <label>金额（元）<input class="amount-input" type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required></label>
              <label>日期<input type="date" name="date" value="${defaultDate}" required></label>
            </div>
            <div class="form-row">
              <label>分类<select name="category">${categoryOptions('expense')}</select></label>
              <label>备注<input name="note" maxlength="40" placeholder="选填，比如：午饭"></label>
            </div>
            <div class="form-actions"><button class="btn primary" type="submit">保存这笔</button></div>
          </div>
        </form>
        <div class="card">
          <div class="card-head"><h3>本月小结</h3><span class="small muted">数据自动计算</span></div>
          <div class="fin-fact"><span>日均支出</span><strong>${fmtMoney(dailyAvg)}</strong></div>
          <div class="fin-fact"><span>记账笔数</span><strong>${sum.list.length} 笔</strong></div>
          <div class="fin-fact"><span>最大支出分类</span><strong>${topCat ? `${finCat('expense', topCat[0]).icon} ${esc(topCat[0])} ${fmtMoney(topCat[1])}` : '暂无'}</strong></div>
          <div class="fin-fact"><span>结余率</span><strong>${sum.income ? Math.round(sum.balance / sum.income * 100) + '%' : '—'}</strong></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>支出分类</h3><button class="link-btn" data-action="edit-budget">${budget ? '调整预算' : '设置预算'} →</button></div>
        ${cats.length ? `<div style="margin-bottom:14px">${donutChart(catItems, { center: fmtMoneyCompact(sum.expense), centerLabel: '本月支出' })}</div>` : ''}
        ${budget ? `<div class="cat-row">
          <div class="cat-top"><span>本月预算 ${fmtMoney(budget)}</span><span class="${over ? 'text-danger' : 'muted'}">${over ? '已超支 ' + fmtMoney(-remaining) : '已用 ' + usedPct + '%'}</span></div>
          <div class="progress"><i style="width:${clamp(usedPct, 0, 100)}%${over ? ';background:var(--danger)' : ''}"></i></div>
        </div>` : `<div class="small muted" style="margin-bottom:10px">还没有设置预算，设置后可以查看本月使用进度。</div>`}
        ${catHTML}

    </div>
    <div class="card">
      <div class="card-head">
        <h3>账单明细 <span class="small muted">· ${filtered.length} 笔</span></h3>
        <select class="mini-select" data-fin-filter>
          <option value="all"${financeFilter === 'all' ? ' selected' : ''}>全部</option>

          <option value="income"${financeFilter === 'income' ? ' selected' : ''}>收入</option>
        </select>
      </div>
      ${rows || `<div class="empty">${emptyText}</div>`}
    </div>`;
}

function renderFinanceYear() {
  const year = financeYear;
  const sum = financeYearSummary(year);
  const incomeCount = sum.list.filter(t => t.type === 'income').length;
  const expenseCount = sum.list.length - incomeCount;
  const activeMonths = sum.months.filter(m => m.income || m.expense).length;
  const avgMonthly = activeMonths ? sum.expense / activeMonths : 0;
  const savings = sum.income ? Math.round(sum.balance / sum.income * 100) : null;
  const isNowYear = year === Number(todayKey().slice(0, 4));

  const summary = [
    { label: '全年收入', value: fmtMoney(sum.income), icon: '📈', hint: `${incomeCount} 笔` },
    { label: '全年支出', value: fmtMoney(sum.expense), icon: '📉', hint: `${expenseCount} 笔` },
    { label: '全年结余', value: fmtMoney(sum.balance), icon: '💰', hint: savings === null ? '还没有收入记录' : `储蓄率 ${savings}%` },
    { label: '月均支出', value: activeMonths ? fmtMoney(avgMonthly) : '—', icon: '📅', hint: activeMonths ? `按 ${activeMonths} 个有记录月份` : '还没有记录' }
  ];

  const chartMax = Math.max(1, ...sum.months.map(m => Math.max(m.income, m.expense)));
  const chartHTML = sum.list.length ? `
    <div class="y-chart">
      ${sum.months.map(m => {
        const key = `${year}-${pad2(m.month)}`;
        const ih = m.income ? Math.max(2, Math.round(m.income / chartMax * 100)) : 0;
        const eh = m.expense ? Math.max(2, Math.round(m.expense / chartMax * 100)) : 0;
        return `<button type="button" class="y-col" data-action="fin-open-month" data-month="${key}" title="${m.month}月 · 收入 ${fmtMoney(m.income)} · 支出 ${fmtMoney(m.expense)}">
          <span class="y-bars"><i class="y-bar income" style="height:${ih}%"></i><i class="y-bar expense" style="height:${eh}%"></i></span>
          <span class="y-label">${m.month}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>收入</span>
      <span><i style="background:var(--danger);opacity:.8"></i>支出</span>
      <span class="small muted" style="margin-left:auto">点击柱形查看当月明细</span>
    </div>` : `<div class="empty">这一年还没有记录，先记几笔吧。</div>`;

  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const catHTML = cats.length ? cats.map(([name, amount]) => {
    const c = finCat('expense', name);
    const w = maxCat ? Math.max(3, amount / maxCat * 100) : 0;
    const share = sum.expense ? Math.round(amount / sum.expense * 100) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span>${c.icon} ${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('expense', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这一年还没有支出记录。</div>`;

  const incMap = {};
  sum.list.filter(t => t.type === 'income').forEach(t => {
    incMap[t.category] = (incMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const incCats = Object.entries(incMap).sort((a, b) => b[1] - a[1]);
  const maxInc = incCats.length ? incCats[0][1] : 0;
  const incHTML = incCats.length ? incCats.map(([name, amount]) => {
    const c = finCat('income', name);
    const w = maxInc ? Math.max(3, amount / maxInc * 100) : 0;
    const share = sum.income ? Math.round(amount / sum.income * 100) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span>${c.icon} ${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('income', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这一年还没有收入记录。</div>`;

  const topMonth = sum.months.reduce((a, m) => (m.expense > (a ? a.expense : 0) ? m : a), null);
  const topCat = cats[0];
  const maxMonthExpense = Math.max(1, ...sum.months.map(m => m.expense));
  const monthRows = sum.months.map(m => {
    const key = `${year}-${pad2(m.month)}`;
    const balance = m.income - m.expense;
    const zero = !m.income && !m.expense;
    const w = Math.round(m.expense / maxMonthExpense * 100);
    return `<tr class="${zero ? 'zero' : ''}" data-action="fin-open-month" data-month="${key}" title="查看 ${m.month} 月明细">
      <td class="m-name">${m.month}月</td>
      <td>${m.income ? fmtMoney(m.income) : '—'}</td>
      <td>${m.expense ? fmtMoney(m.expense) : '—'}</td>
      <td class="${balance < 0 ? 'text-danger' : ''}">${zero ? '—' : fmtMoney(balance)}</td>
      <td class="m-bar"><i style="width:${w}%"></i></td>
    </tr>`;
  }).join('');

  const navHTML = `<div class="month-nav">
      <button class="nav-btn" data-action="fin-year-prev" title="上一年">‹</button>
      <strong>${year}年</strong>
      <button class="nav-btn" data-action="fin-year-next" title="下一年">›</button>
      ${isNowYear ? '' : `<button class="link-btn" data-action="fin-year-now">回到今年</button>`}
    </div>`;

  $('#view-finance').innerHTML = `
    ${financeHeader(navHTML)}
    <div class="fin-stats">
      ${summary.map(s => `<div class="stat">
        <div class="stat-top"><span>${s.label}</span><span>${s.icon}</span></div>
        <strong class="money" style="font-size:19px">${s.value}</strong>
        <div class="hint">${s.hint}</div>
      </div>`).join('')}
    </div>
    <div class="year-top">
      <div class="card">
        <div class="card-head"><h3>月度收支</h3><span class="small muted">${year} 年</span></div>
        ${chartHTML}
      </div>
      <div class="card">
        <div class="card-head"><h3>收入分类</h3><span class="small muted">全年占比</span></div>
        ${incHTML}
        <div class="fin-facts">
          <div class="fin-fact"><span>记账笔数</span><strong>${sum.list.length} 笔</strong></div>
          <div class="fin-fact"><span>月均支出</span><strong>${activeMonths ? fmtMoney(avgMonthly) : '—'}</strong></div>
          <div class="fin-fact"><span>支出最多</span><strong>${topMonth ? `${topMonth.month}月 · ${fmtMoney(topMonth.expense)}` : '暂无'}</strong></div>
          <div class="fin-fact"><span>最大分类</span><strong>${topCat ? `${finCat('expense', topCat[0]).icon} ${esc(topCat[0])} ${fmtMoney(topCat[1])}` : '暂无'}</strong></div>
        </div>
      </div>
    </div>
    <div class="year-bottom">
      <div class="card">
        <div class="card-head"><h3>支出分类</h3><span class="small muted">全年占比</span></div>
        ${catHTML}
      </div>
      <div class="card">
        <div class="card-head"><h3>月度明细</h3><span class="small muted">点击任意月份查看明细</span></div>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>月份</th><th>收入</th><th>支出</th><th>结余</th><th class="m-bar">支出趋势</th></tr></thead>
            <tbody>
              ${monthRows}
              <tr class="total">
                <td>全年合计</td>
                <td>${fmtMoney(sum.income)}</td>
                <td>${fmtMoney(sum.expense)}</td>
                <td class="${sum.balance < 0 ? 'text-danger' : ''}">${fmtMoney(sum.balance)}</td>
                <td class="m-bar"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ==================== 弹窗与提示 ==================== */
const modalEl = $('#modal');
const modalBox = $('#modalBox');

function openModal(html) {
  modalBox.innerHTML = html;
  modalEl.classList.remove('hidden');
  const first = modalBox.querySelector('input, select, textarea');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal() {
  modalEl.classList.add('hidden');
  modalBox.innerHTML = '';
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* 应用内确认框：不依赖 window.confirm，手机 WebView 与预览容器里都能正常弹出 */
const confirmEl = $('#confirm');
let confirmCallback = null;

function askConfirm(opts, onOk) {
  const o = typeof opts === 'string' ? { message: opts } : (opts || {});
  const ok = $('#confirmOk');
  $('#confirmIcon').textContent = o.icon || '⚠️';
  $('#confirmTitle').textContent = o.title || '请确认';
  $('#confirmMsg').textContent = o.message || '';
  $('#confirmCancel').textContent = o.cancelText || '取消';
  ok.textContent = o.okText || '确定';
  ok.className = 'btn ' + (o.accent ? 'primary' : 'solid-danger');
  confirmCallback = typeof onOk === 'function' ? onOk : null;
  confirmEl.classList.remove('hidden');
}

function closeConfirm(ok) {
  const cb = confirmCallback;
  confirmCallback = null;
  confirmEl.classList.add('hidden');
  if (ok && cb) cb();
}

confirmEl.addEventListener('click', e => { if (e.target === confirmEl) closeConfirm(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !confirmEl.classList.contains('hidden')) closeConfirm(false);
});

/* ==================== 表单提交 ==================== */
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const kind = form.dataset.form;

  if (kind === 'goal') {
    const title = String(fd.get('title') || '').trim();
    if (!title) { toast('请填写目标名称'); return; }
    const id = form.dataset.id;
    const old = id ? state.goals.find(x => x.id === id) : null;
    // 小目标：按行填写，保留同名项原有的完成状态
    const lines = String(fd.get('subtasks') || '').split('\n')
      .map(s => s.replace(/^[\s·•\-\d.、]+/, '').trim()).filter(Boolean).slice(0, 30);
    const prevSubs = old && Array.isArray(old.subtasks) ? old.subtasks : [];
    const subtasks = lines.map(line => {
      const hit = prevSubs.find(t => t.title === line);
      return hit ? { id: hit.id, title: hit.title, done: !!hit.done, doneAt: hit.doneAt || null }
        : { id: uid(), title: line, done: false, doneAt: null };
    });
    const dueTimeRaw = String(fd.get('dueTime') || '');
    const data = {
      title,
      category: String(fd.get('category') || '其他'),
      current: Math.max(0, Number(fd.get('current')) || 0),
      target: Math.max(0.01, Number(fd.get('target')) || 1),
      unit: String(fd.get('unit') || '').trim(),
      deadline: String(fd.get('deadline') || ''),
      dueTime: /^([01]\d|2[0-3]):[0-5]\d$/.test(dueTimeRaw) ? dueTimeRaw : '',
      note: String(fd.get('note') || '').trim(),
      subtasks
    };
    if (old) {
      Object.assign(old, data);
      if (old.remindedFor && old.remindedFor !== goalRemindKey(old)) old.remindedFor = null;
      toast('目标已更新');
    } else {
      state.goals.push(Object.assign({ id: uid(), createdAt: Date.now(), done: false, doneAt: null, remindedFor: null }, data));
      toast('目标已创建');
    }
    closeModal();
    saveState();
    syncGoalAlarms(true);
    render();
    return;
  }

  if (kind === 'sub') {
    const gid = form.dataset.id;
    const g = state.goals.find(x => x.id === gid);
    const title = String(fd.get('title') || '').trim();
    if (!g || !title) return;
    g.subtasks = Array.isArray(g.subtasks) ? g.subtasks : [];
    if (!g.subtasks.some(t => t.title === title)) {
      g.subtasks.push({ id: uid(), title, done: false, doneAt: null });
      saveState();
      render();
      toast('已添加小目标');
    }
    const input = $(`.sub-add[data-id="${gid}"] input`);
    if (input) { input.value = ''; input.focus(); }
    return;
  }

  if (kind === 'habit') {
    const name = String(fd.get('name') || '').trim();
    if (!name) { toast('请填写习惯名称'); return; }
    const id = uid();
    state.habits.push({ id, name, emoji: String(fd.get('emoji') || '').trim() || '✅', createdAt: Date.now() });
    state.habitLogs[id] = [];
    closeModal();
    saveState();
    render();
    toast('习惯已创建，今天就开始吧');
    return;
  }

  if (kind === 'journal') {
    const data = {
      date: String(fd.get('date') || '').trim() || todayKey(),
      mood: clamp(fd.get('mood'), 1, 5),
      energy: clamp(fd.get('energy'), 1, 5),
      good: String(fd.get('good') || '').trim(),
      improve: String(fd.get('improve') || '').trim(),
      tomorrow: String(fd.get('tomorrow') || '').trim(),
      tags: String(fd.get('tags') || '').trim()
    };
    if (!data.good && !data.improve && !data.tomorrow) { toast('写点内容再保存吧'); return; }
    if (editingJournal) {
      const j = state.journal.find(x => x.id === editingJournal);
      if (j) Object.assign(j, data, { updatedAt: Date.now() });
      editingJournal = null;
      toast('日记已更新');
    } else {
      const same = state.journal.find(j => j.date === data.date);
      if (same) {
        Object.assign(same, data, { updatedAt: Date.now() });
        toast('已更新当天日记');
      } else {
        state.journal.push(Object.assign({ id: uid(), createdAt: Date.now(), updatedAt: Date.now() }, data));
        toast('日记已保存');
      }
    }
    saveState();
    render();
    return;
  }

  if (kind === 'item') {
    const title = String(fd.get('title') || '').trim();
    if (!title) { toast('请填写项目名称'); return; }
    const type = String(fd.get('type') || 'book');
    const data = {
      title,
      type,
      current: Math.max(0, Number(fd.get('current')) || 0),
      total: Math.max(0, Number(fd.get('total')) || 0),
      unit: String(fd.get('unit') || '').trim(),
      level: type === 'skill' ? clamp(fd.get('level') || 1, 1, 5) : 0
    };
    const id = form.dataset.id;
    if (id) {
      const it = state.learning.items.find(x => x.id === id);
      if (it) Object.assign(it, data);
      toast('项目已更新');
    } else {
      state.learning.items.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
      toast('学习项目已添加');
    }
    closeModal();
    saveState();
    render();
    return;
  }

  if (kind === 'session') {
    const itemId = String(fd.get('itemId') || '');
    const item = state.learning.items.find(x => x.id === itemId);
    if (!item) { toast('请选择一个学习项目'); return; }
    const minutes = clamp(fd.get('minutes') || 30, 1, 1440);
    state.learning.sessions.push({
      id: uid(),
      itemId,
      date: String(fd.get('date') || '').trim() || todayKey(),
      minutes,
      note: String(fd.get('note') || '').trim(),
      createdAt: Date.now()
    });
    saveState();
    render();
    toast(`已记录 ${minutes} 分钟 🎉`);
    return;
  }

  if (kind === 'tx') {
    const amount = Math.round((Number(fd.get('amount')) || 0) * 100) / 100;
    if (!(amount > 0)) { toast('请输入正确的金额'); return; }
    const data = {
      type: String(fd.get('type') || 'expense') === 'income' ? 'income' : 'expense',
      amount,
      date: String(fd.get('date') || '').trim() || todayKey(),
      category: String(fd.get('category') || '').trim() || '其他',
      note: String(fd.get('note') || '').trim()
    };
    const id = form.dataset.id;
    if (id) {
      const t = state.finance.transactions.find(x => x.id === id);
      if (t) Object.assign(t, data, { updatedAt: Date.now() });
      toast('记录已更新');
    } else {
      state.finance.transactions.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
      toast(data.type === 'income' ? '收入已记录' : '支出已记录');
    }
    financeMonth = data.date.slice(0, 7);
    financeYear = Number(data.date.slice(0, 4));
    if (form.closest('.modal')) closeModal();
    saveState();
    render();
    return;
  }

  if (kind === 'budget') {
    state.finance.budget = Math.max(0, Math.round(Number(fd.get('budget')) || 0));
    closeModal();
    saveState();
    render();
    toast(state.finance.budget ? '月度预算已保存' : '已取消预算');
    return;
  }
});

/* ==================== 点击交互 ==================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'confirm-ok') { closeConfirm(true); return; }
  if (action === 'confirm-cancel') { closeConfirm(false); return; }
  if (action === 'nav') { switchView(el.dataset.view); return; }
  if (action === 'open-stat') { detailKey = el.dataset.stat || 'streak'; switchView('detail'); return; }
  if (action === 'detail-back') { switchView('dashboard'); return; }
  if (action === 'toggle-quick') {
    state.settings.finQuickCollapsed = !state.settings.finQuickCollapsed;
    saveState(); render();
    return;
  }
  if (action === 'toggle-journal') {
    state.settings.journalCollapsed = !state.settings.journalCollapsed;
    saveState(); render();
    return;
  }
  if (action === 'fold-journal') {
    const key = el.dataset.key;
    if (!key) return;
    const fold = state.settings.journalFold = state.settings.journalFold || {};
    fold[key] = !(Number(el.dataset.open) === 1);
    saveState(); render();
    return;
  }
  if (action === 'fold-journal-all') {
    const open = Number(el.dataset.open) === 1;
    const fold = state.settings.journalFold = state.settings.journalFold || {};
    state.journal.forEach(j => {
      const d = String(j.date || '');
      if (d.length >= 4) fold['y:' + d.slice(0, 4)] = open;
      if (d.length >= 7) fold['m:' + d.slice(0, 7)] = open;
    });
    saveState(); render();
    toast(open ? '已全部展开' : '已全部收起');
    return;
  }
  if (action === 'habit-week') {
    const dir = Number(el.dataset.dir) || 0;
    habitWeekOffset = dir === 0 ? 0 : clamp(habitWeekOffset + dir, -104, 0);
    render();
    return;
  }
  if (action === 'close-modal') { closeModal(); return; }
  if (action === 'dismiss-demo') { state.seeded = false; saveState(); render(); return; }

  if (action === 'toggle-habit') {
    const key = el.dataset.date || todayKey();
    const logs = habitLogs(id);
    const i = logs.indexOf(key);
    if (i >= 0) { logs.splice(i, 1); toast('已取消打卡'); }
    else { logs.push(key); toast('打卡成功 🎉'); }
    saveState();
    render();
    return;
  }

  if (action === 'add-goal') { openGoalModal(); return; }
  if (action === 'edit-goal') { openGoalModal(id); return; }
  if (action === 'goal-filter') {
    goalFilter = el.dataset.cat || 'all';
    render();
    return;
  }
  if (action === 'toggle-done-one') {
    const map = ensureDoneOpenMap();
    map[id] = !map[id];
    saveState(); render();
    return;
  }
  if (action === 'toggle-done-goals') {
    const map = ensureDoneOpenMap();
    const doneGoals = state.goals.filter(g => g.done);
    const expand = doneGoals.some(g => !map[g.id]);
    doneGoals.forEach(g => { map[g.id] = expand; });
    saveState(); render();
    toast(expand ? '已展开全部已完成目标' : '已收起全部已完成目标');
    return;
  }
  if (action === 'remind-later') { closeReminder(); return; }
  if (action === 'remind-go') {
    closeReminder();
    switchView('goals');
    return;
  }
  if (action === 'toggle-goal') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    if (g.done) {
      g.done = false;
      g.doneAt = null;
      const map = ensureDoneOpenMap();
      delete map[g.id];
      saveState(); render();
      toast('已恢复为进行中');
      return;
    }
    const st = goalSubStats(g);
    if (st.left > 0) {
      toast(`还有 ${st.left} 个小目标没完成，先把它们划掉吧`);
      const card = el.closest('.goal-card');
      if (card) {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        const listEl = card.querySelector('.sub-list');
        if (listEl) {
          listEl.classList.add('need-finish');
          setTimeout(() => listEl.classList.remove('need-finish'), 1800);
        }
        setTimeout(() => card.classList.remove('shake'), 500);
      }
      return;
    }
    g.done = true;
    g.doneAt = Date.now();
    ensureDoneOpenMap()[g.id] = false;
    saveState();
    render();
    toast('已标记完成，移到下方「已完成」🎉');
    return;
  }
  if (action === 'toggle-sub') {
    const g = state.goals.find(x => x.id === id);
    const t = g && (g.subtasks || []).find(s => s.id === el.dataset.sub);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    saveState();
    render();
    return;
  }
  if (action === 'del-sub') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const t = (g.subtasks || []).find(s => s.id === el.dataset.sub);
    if (!t) return;
    g.subtasks = g.subtasks.filter(s => s.id !== el.dataset.sub);
    saveState();
    render();
    toast('小目标已删除');
    return;
  }
  if (action === 'del-goal') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    askConfirm({
      title: '删除目标',
      message: `「${g.title}」的进度记录会一起删除，无法恢复。`,
      okText: '删除'
    }, () => {
      state.goals = state.goals.filter(x => x.id !== id);
      saveState(); render(); toast('目标已删除');
    });
    return;
  }
  if (action === 'goal-plus' || action === 'goal-minus') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const step = Math.max(1, Math.round((Number(g.target) || 10) / 20));
    const dir = action === 'goal-plus' ? 1 : -1;
    g.current = clamp((Number(g.current) || 0) + dir * step, 0, 99999999);
    saveState(); render();
    return;
  }

  if (action === 'add-habit') { openHabitModal(); return; }
  if (action === 'del-habit') {
    const h = state.habits.find(x => x.id === id);
    if (!h) return;
    askConfirm({
      title: '删除习惯',
      message: `「${h.name}」的打卡记录会一起删除，无法恢复。`,
      okText: '删除'
    }, () => {
      state.habits = state.habits.filter(x => x.id !== id);
      delete state.habitLogs[id];
      saveState(); render(); toast('习惯已删除');
    });
    return;
  }

  if (action === 'edit-journal') {
    editingJournal = id;
    state.settings.journalCollapsed = false;
    saveState();
    render();
    const form = $('#journalForm');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (action === 'cancel-journal') { editingJournal = null; render(); return; }
  if (action === 'del-journal') {
    const j = state.journal.find(x => x.id === id);
    if (!j) return;
    askConfirm({
      title: '删除日记',
      message: `确定删除 ${fmtDate(j.date)} 的这篇日记吗？删除后无法恢复。`,
      okText: '删除'
    }, () => {
      state.journal = state.journal.filter(x => x.id !== id);
      if (editingJournal === id) editingJournal = null;
      saveState(); render(); toast('日记已删除');
    });
    return;
  }

  if (action === 'add-item') { openItemModal(); return; }
  if (action === 'edit-item') { openItemModal(id); return; }
  if (action === 'del-item') {
    const it = state.learning.items.find(x => x.id === id);
    if (!it) return;
    askConfirm({
      title: '删除学习项目',
      message: `「${it.title}」的学习记录会一起删除，无法恢复。`,
      okText: '删除'
    }, () => {
      state.learning.items = state.learning.items.filter(x => x.id !== id);
      state.learning.sessions = state.learning.sessions.filter(s => s.itemId !== id);
      saveState(); render(); toast('学习项目已删除');
    });
    return;
  }
  if (action === 'del-session') {
    const s = state.learning.sessions.find(x => x.id === id);
    if (!s) return;
    askConfirm({
      title: '删除学习记录',
      message: `确定删除 ${fmtDate(s.date)} 的这条记录吗？`,
      okText: '删除'
    }, () => {
      state.learning.sessions = state.learning.sessions.filter(x => x.id !== id);
      saveState(); render(); toast('学习记录已删除');
    });
    return;
  }
  if (action === 'set-level') {
    const it = state.learning.items.find(x => x.id === id);
    if (!it) return;
    it.level = clamp(el.dataset.level, 1, 5);
    saveState(); render();
    return;
  }
  if (action === 'log-session') {
    const form = $('#sessionForm');
    if (!form) return;
    const sel = $('select[name="itemId"]', form);
    if (sel) sel.value = id;
    const minutes = $('input[name="minutes"]', form);
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (minutes) setTimeout(() => { minutes.focus(); minutes.select(); }, 300);
    return;
  }

  if (action === 'add-tx') { openTxModal(); return; }
  if (action === 'edit-tx') { openTxModal(id); return; }
  if (action === 'del-tx') {
    const t = state.finance.transactions.find(x => x.id === id);
    if (!t) return;
    askConfirm({
      title: '删除账单记录',
      message: `确定删除这笔${t.type === 'income' ? '收入' : '支出'}「${t.category} ${fmtMoney(t.amount)}」吗？`,
      okText: '删除'
    }, () => {
      state.finance.transactions = state.finance.transactions.filter(x => x.id !== id);
      saveState(); render(); toast('记录已删除');
    });
    return;
  }
  if (action === 'edit-budget') { openBudgetModal(); return; }
  if (action === 'set-theme') {
    const t = applyTheme(el.dataset.theme);
    saveState();
    openThemeModal();
    toast(`已切换为「${t.name}」`);
    return;
  }
  if (action === 'fin-prev') { financeMonth = shiftMonth(financeMonth, -1); render(); return; }
  if (action === 'fin-next') { financeMonth = shiftMonth(financeMonth, 1); render(); return; }
  if (action === 'fin-now') { financeMonth = todayKey().slice(0, 7); render(); return; }
  if (action === 'fin-mode') {
    financeMode = el.dataset.mode === 'year' ? 'year' : 'month';
    if (financeMode === 'year') {
      financeYear = Number(financeMonth.slice(0, 4));
    } else if (Number(financeMonth.slice(0, 4)) !== financeYear) {
      const now = new Date();
      financeMonth = `${financeYear}-${pad2(financeYear === now.getFullYear() ? now.getMonth() + 1 : 1)}`;
    }
    render();
    return;
  }
  if (action === 'fin-year-prev') { financeYear -= 1; render(); return; }
  if (action === 'fin-year-next') { financeYear += 1; render(); return; }
  if (action === 'fin-year-now') { financeYear = Number(todayKey().slice(0, 4)); render(); return; }
  if (action === 'fin-open-month') {
    financeMonth = el.dataset.month;
    financeMode = 'month';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
});

/* ==================== 其他交互 ==================== */
document.addEventListener('change', e => {
  if (e.target.matches('[data-fin-type]')) {
    const form = e.target.closest('form');
    if (!form) return;
    const cat = form.querySelector('select[name="category"]');
    if (cat) cat.innerHTML = categoryOptions(e.target.value);
    return;
  }
  if (e.target.matches('[data-fin-filter]')) {
    financeFilter = e.target.value;
    render();
    return;
  }
  if (!e.target.matches('[data-level-toggle]')) return;
  const form = e.target.closest('form');
  if (!form) return;
  const isSkill = e.target.value === 'skill';
  const pf = $('[data-progress-field]', form);
  const lf = $('[data-level-field]', form);
  if (pf) pf.style.display = isSkill ? 'none' : '';
  if (lf) lf.style.display = isSkill ? '' : 'none';
});

modalEl.addEventListener('click', e => { if (e.target === modalEl) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ==================== 备份 / 分享 / 自动存档 ==================== */
const backupName = () => `成长日志备份-${todayKey()}.json`;

function backupJSON() { return JSON.stringify(state, null, 2); }

function downloadBackup(json, filename) {
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('备份文件已导出');
}

let lastSnapshotAt = 0;
/** 每次改动后静默存一份到应用私有目录，防止 localStorage 被清 */
function autoSnapshot() {
  if (!(window.AndroidBridge && typeof window.AndroidBridge.autoBackup === 'function')) return;
  const now = Date.now();
  if (now - lastSnapshotAt < 90000) return;
  lastSnapshotAt = now;
  try { window.AndroidBridge.autoBackup(JSON.stringify(state)); } catch (e) {}
}

$('#shareBtn').addEventListener('click', () => {
  try {
    const json = backupJSON();
    const filename = backupName();
    if (window.AndroidBridge && typeof window.AndroidBridge.shareBackup === 'function') {
      window.AndroidBridge.shareBackup(json, filename);
      toast('已生成备份文件，在弹出面板里选微信发送');
      return;
    }
    downloadBackup(json, filename);
  } catch (err) {
    toast('分享失败：' + err.message);
  }
});

$('#exportBtn').addEventListener('click', () => {
  try {
    const json = backupJSON();
    const filename = backupName();
    if (window.AndroidBridge && typeof window.AndroidBridge.exportBackup === 'function') {
      window.AndroidBridge.exportBackup(json, filename);
      toast('请选择备份保存位置');
      return;
    }
    downloadBackup(json, filename);
  } catch (err) {
    toast('导出失败：' + err.message);
  }
});

$('#restoreBtn').addEventListener('click', () => {
  if (!(window.AndroidBridge && typeof window.AndroidBridge.readAutoBackup === 'function')) {
    toast('当前环境没有自动存档');
    return;
  }
  let raw = '';
  try { raw = window.AndroidBridge.readAutoBackup(); } catch (e) { raw = ''; }
  if (!raw) { toast('还没有自动存档，先用一会儿再来'); return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { toast('自动存档已损坏'); return; }
  askConfirm({
    title: '恢复自动存档',
    message: '将用最近一次的自动存档覆盖当前数据。如果现在有刚写的内容，建议先「分享备份到微信」留一份。',
    icon: '♻️', okText: '恢复', accent: true
  }, () => {
    state = normalizeState(parsed);
    editingJournal = null;
    saveState();
    render();
    toast('已恢复到最近的自动存档');
  });
});

$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = typeof file.text === 'function' ? await file.text() : await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('无法读取文件'));
      reader.readAsText(file, 'UTF-8');
    });
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('文件内容不是有效的备份');
    e.target.value = '';
    askConfirm({
      title: '导入备份',
      message: '导入会覆盖当前所有数据，建议先导出一次现有备份。',
      icon: '📥', okText: '覆盖导入', accent: true
    }, () => {
      state = normalizeState(data);
      saveState();
      editingJournal = null;
      render();
      toast('数据已导入');
    });
  } catch (err) {
    toast('导入失败：' + err.message);
  }
});

$('#themeBtn').addEventListener('click', () => {
  openThemeModal();
});

$('#resetBtn').addEventListener('click', () => {
  askConfirm({
    title: '清空所有数据',
    message: '目标、习惯、日记、学习和账单都会被删除，无法恢复。建议先导出备份。',
    icon: '🗑️', okText: '清空'
  }, () => {
    const theme = state.settings.theme;
    state = { goals: [], habits: [], habitLogs: {}, journal: [], learning: { items: [], sessions: [] }, finance: { transactions: [], budget: 0 }, settings: { theme } };
    editingJournal = null;
    financeMonth = todayKey().slice(0, 7);
    financeFilter = 'all';
    financeMode = 'month';
    financeYear = Number(todayKey().slice(0, 4));
    saveState();
    render();
    toast('已清空，重新开始 🌱');
  });
});

/* ==================== 手机设置与安卓返回键 ==================== */
const mobileTools = $('.sidebar-foot');
function closeMobileTools() {
  mobileTools.classList.remove('mobile-open');
  $('#mobileSettings').setAttribute('aria-expanded', 'false');
}
$('#mobileSettings').addEventListener('click', e => {
  e.stopPropagation();
  const open = mobileTools.classList.toggle('mobile-open');
  $('#mobileSettings').setAttribute('aria-expanded', String(open));
});
mobileTools.addEventListener('click', e => {
  if (e.target.closest('button')) closeMobileTools();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.sidebar-foot') && !e.target.closest('#mobileSettings')) closeMobileTools();
});
function androidHandleBack() {
  if ($('#remind').classList.contains('show')) { closeReminder(); return true; }
  if (!confirmEl.classList.contains('hidden')) { closeConfirm(false); return true; }
  if (!modalEl.classList.contains('hidden')) { closeModal(); return true; }
  if (mobileTools.classList.contains('mobile-open')) { closeMobileTools(); return true; }
  if (currentView !== 'dashboard') { switchView('dashboard'); return true; }
  return false;
}

/* ==================== 启动 ==================== */
state = loadState();
applyTheme(state.settings.theme);
const initialView = (location.hash || '').replace('#', '');
switchView(VIEW_META[initialView] ? initialView : 'dashboard');
window.addEventListener('hashchange', () => {
  const v = (location.hash || '').replace('#', '');
  if (VIEW_META[v] && v !== currentView) switchView(v);
});

/* 目标到期提醒：启动 / 回到前台 / 每分钟 各检查一次 */
setTimeout(() => { syncGoalAlarms(true); checkGoalReminders(); }, 1600);
setInterval(() => { if (!document.hidden) checkGoalReminders(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { checkGoalReminders(); syncGoalAlarms(true); }
});
window.addEventListener('focus', () => checkGoalReminders());
window.androidHandleBack = androidHandleBack;
</script>
