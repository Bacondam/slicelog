<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f7f5">
<title>成长日志 · Growth OS</title>
<!-- iOS / PWA：可添加到主屏幕、全屏运行 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成长日志">
<meta name="format-detection" content="telephone=no,email=no">
<meta name="apple-mobile-web-app-orientation" content="portrait">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
try {
  var _s = JSON.parse(localStorage.getItem('growth-os-v1'));
  var _t = _s && _s.settings && _s.settings.theme;
  var _map = { light: 'forest', dark: 'midnight' };
  var _themes = ['forest', 'midnight', 'ocean', 'sunset', 'sakura', 'mono', 'ink'];
  _t = _map[_t] || _t;
  if (_themes.indexOf(_t) >= 0) {
    document.documentElement.dataset.theme = _t;
    if (_t === 'midnight' || _t === 'ink') document.documentElement.dataset.mode = 'dark';
  }
} catch (e) {}
</script>
<script>
/* 安卓外壳会把状态栏、挖孔、手势条的真实尺寸同步过来（CSS px）。
   安卓 WebView 的 env(safe-area-inset-*) 恒为 0，所以这里必须由原生注入。 */
(function () {
  var root = document.documentElement;
  function apply(t, r, b, l) {
    root.style.setProperty('--sat', (t || 0) + 'px');
    root.style.setProperty('--sar', (r || 0) + 'px');
    root.style.setProperty('--sab', (b || 0) + 'px');
    root.style.setProperty('--sal', (l || 0) + 'px');
  }
  function parse(text) {
    var p = String(text == null ? '' : text).split(',');
    if (p.length < 4) return null;
    var n = p.map(function (v) { return parseFloat(v) || 0; });
    return n;
  }
  try {
    if (window.AndroidBridge && AndroidBridge.getSafeInsets) {
      var v = parse(AndroidBridge.getSafeInsets());
      if (v) apply(v[0], v[1], v[2], v[3]);
    }
  } catch (e) {}
  window.applySafeInsets = function (t, r, b, l) {
    apply(t, r, b, l);
    window.dispatchEvent(new Event('safe-insets-change'));
  };
})();
</script>
<script>
/* ==================== iOS / PWA 适配层 ====================
   iPhone 上 env(safe-area-inset-*) 是真实值，安全区交给 CSS；
   这里只把安卓原生桥的几个方法用 Web API 补上，页面逻辑不用改一行。 */
(function () {
  if (window.AndroidBridge && window.AndroidBridge.shareBackup) return; // 安卓外壳优先
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var root = document.documentElement;
  root.dataset.platform = isIOS ? 'ios' : 'web';
  if (standalone) root.dataset.standalone = 'true';

  function download(json, filename) {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename || 'growth-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function makeFile(json, filename) {
    try { return new File([json], filename, { type: 'application/json' }); }
    catch (e) { return null; }
  }

  var AUTO_KEY = 'growth-os-auto-backup';

  window.AndroidBridge = {
    /* 状态栏 / 主题色：更新 theme-color 与配色方案，iOS 会跟着调状态栏文字深浅 */
    setSystemBars: function (color, dark) {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m && color) m.setAttribute('content', color);
      root.style.colorScheme = dark ? 'dark' : 'light';
      var ios = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (ios) ios.setAttribute('content', dark ? 'black-translucent' : 'default');
    },
    /* 导出：走 Safari 下载，落到「文件」App */
    exportBackup: function (json, filename) { download(json, filename); },
    /* 分享：iOS 分享面板（可直接选微信 / 隔空投送 / 存文件） */
    shareBackup: function (json, filename) {
      var file = makeFile(json, filename);
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        navigator.share({ files: [file], title: '成长日志备份' }).catch(function () {});
      } else if (file && navigator.share) {
        navigator.share({ files: [file], title: '成长日志备份' }).catch(function () { download(json, filename); });
      } else {
        download(json, filename);
      }
    },
    /* 自动存档：网页拿不到应用私有目录，退一步存本地存储，按天留 5 份 */
    autoBackup: function (json) {
      try {
        var stamp = new Date();
        var day = stamp.getFullYear() + '-' + String(stamp.getMonth() + 1).padStart(2, '0') + '-' + String(stamp.getDate()).padStart(2, '0');
        var store = {};
        try { store = JSON.parse(localStorage.getItem(AUTO_KEY) || '{}') || {}; } catch (e) { store = {}; }
        store[day] = json;
        var days = Object.keys(store).sort();
        while (days.length > 5) { delete store[days.shift()]; }
        localStorage.setItem(AUTO_KEY, JSON.stringify(store));
        localStorage.setItem(AUTO_KEY + '-latest', json);
      } catch (e) { /* 空间不足就静默跳过，不影响正常保存 */ }
    },
    readAutoBackup: function () {
      try { return localStorage.getItem(AUTO_KEY + '-latest') || ''; } catch (e) { return ''; }
    },
    /* 网页无法排系统闹钟，前台到点仍会弹应用内提醒层 */
    setGoalReminders: function () {},
    notifyGoal: function (title, body) {
      try {
        if (window.Notification && Notification.permission === 'granted') {
          new Notification(title, { body: body, icon: 'icons/icon-192.png' });
        }
      } catch (e) {}
    }
  };

  /* 尽量申请持久化存储，减少 Safari 清理 localStorage 的概率 */
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }

  /* Service Worker：断网也能打开 */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  /* 首次在 Safari 打开时提示「添加到主屏幕」，只提示一次 */
  window.addEventListener('load', function () {
    if (!isIOS || standalone) return;
    var KEY = 'growth-os-ios-hint';
    try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }
    var bar = document.createElement('div');
    bar.className = 'ios-install-hint';
    bar.innerHTML = '<span>点底部 <b>⤴ 分享</b> → 「添加到主屏幕」，就能像 App 一样全屏使用</span><button type="button" aria-label="知道了">知道了</button>';
    bar.querySelector('button').addEventListener('click', function () {
      bar.remove();
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
    });
    document.body.appendChild(bar);
  });
})();
</script>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  :root,
  [data-theme="forest"] {
    --bg: #f4f7f5;
    --card: #ffffff;
    --text: #17231d;
    --muted: #68766e;
    --line: #e2e9e5;
    --accent: #2e7d5b;
    --accent-soft: #e3f2eb;
    --accent-2: #d97706;
    --accent-hi: #7cc7a6;
    --on-accent: #ffffff;
    --danger: #c2413a;
    --shadow: 0 1px 2px rgba(16,40,30,.04), 0 8px 24px rgba(16,40,30,.05);
    --radius: 18px;
  }
  [data-theme="midnight"] {
    --bg: #0e1411;
    --card: #151d19;
    --text: #e9f1ec;
    --muted: #93a49b;
    --line: #26332c;
    --accent: #5ec99a;
    --accent-soft: #183327;
    --accent-2: #f0a24b;
    --accent-hi: #8ee0bb;
    --on-accent: #08130d;
    --danger: #f0776f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.32);
  }
  [data-theme="ocean"] {
    --bg: #eef4fb;
    --card: #ffffff;
    --text: #102437;
    --muted: #5b7186;
    --line: #dbe7f3;
    --accent: #1f6feb;
    --accent-soft: #e2eefc;
    --accent-2: #0d9488;
    --accent-hi: #63a4ff;
    --on-accent: #ffffff;
    --danger: #c2413a;
    --shadow: 0 1px 2px rgba(16,48,84,.04), 0 8px 24px rgba(16,48,84,.06);
  }
  [data-theme="sunset"] {
    --bg: #fbf4ea;
    --card: #fffaf3;
    --text: #2d2016;
    --muted: #806b57;
    --line: #efe1d0;
    --accent: #c2571a;
    --accent-soft: #fbe8da;
    --accent-2: #2e7d5b;
    --accent-hi: #e8925c;
    --on-accent: #ffffff;
    --danger: #b3372f;
    --shadow: 0 1px 2px rgba(92,58,26,.04), 0 8px 24px rgba(92,58,26,.06);
  }
  [data-theme="sakura"] {
    --bg: #fdf2f6;
    --card: #fffafc;
    --text: #301e25;
    --muted: #83626d;
    --line: #f3dee5;
    --accent: #c2477c;
    --accent-soft: #fce3ed;
    --accent-2: #7c6bd6;
    --accent-hi: #e889b0;
    --on-accent: #ffffff;
    --danger: #bd3b46;
    --shadow: 0 1px 2px rgba(94,38,60,.04), 0 8px 24px rgba(94,38,60,.06);
  }
  [data-theme="mono"] {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #121212;
    --muted: #6b6b6b;
    --line: #e4e4e2;
    --accent: #1f1f1f;
    --accent-soft: #ececeb;
    --accent-2: #8a6d3b;
    --accent-hi: #6e6e6e;
    --on-accent: #ffffff;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  [data-theme="ink"] {
    --bg: #0f1013;
    --card: #18191e;
    --text: #ecebe6;
    --muted: #9a978e;
    --line: #2a2b31;
    --accent: #e0b062;
    --accent-soft: #2b2519;
    --accent-2: #8ab4f8;
    --accent-hi: #f0cd8f;
    --on-accent: #1a1408;
    --danger: #f0776f;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  h1, h2, h3, p { margin: 0; }
  .app { display: flex; min-height: 100vh; }

  /* sidebar */
  .sidebar {
    width: 240px; flex: 0 0 240px;
    background: var(--card); border-right: 1px solid var(--line);
    padding: 26px 16px; display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
  .logo {
    width: 40px; height: 40px; border-radius: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hi));
    display: grid; place-items: center; font-size: 21px;
    box-shadow: 0 6px 14px rgba(0,0,0,.18);
  }
  .brand h1 { font-size: 16px; letter-spacing: .5px; line-height: 1.2; }
  .brand .sub { display: block; font-size: 10px; color: var(--muted); letter-spacing: 1.6px; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    color: var(--muted); text-align: left; transition: .15s;
  }
  .nav button:hover { background: var(--bg); color: var(--text); }
  .nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .ico { width: 20px; text-align: center; font-size: 15px; }
  .sidebar-foot {
    margin-top: auto; display: flex; flex-direction: column; gap: 4px;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
  .sidebar-foot button {
    padding: 8px 12px; border-radius: 8px; color: var(--muted);
    text-align: left; font-size: 12.5px; transition: .15s;
  }
  .sidebar-foot button:hover { background: var(--bg); color: var(--text); }
  .sidebar-foot .danger { color: var(--danger); }
  .foot-hint { font-size: 10.5px; line-height: 1.7; color: var(--muted); padding: 6px 4px 2px; }

  /* layout */
  .main { flex: 1; min-width: 0; padding: 26px 34px 64px; max-width: 1240px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
  .topbar h1 { font-size: 26px; letter-spacing: -.4px; line-height: 1.3; }
  .topbar .page-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .today-chip {
    background: var(--card); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; color: var(--muted);
    font-size: 12px; white-space: nowrap;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view.active > * + * { margin-top: 16px; }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-head h3 { font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  /* hero */
  .hero {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    background: linear-gradient(130deg, var(--accent-soft), var(--card) 72%);
    overflow: hidden;
  }
  .eyebrow { font-size: 11.5px; letter-spacing: .7px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
  .hero h2 { font-size: 24px; margin: 6px 0 4px; letter-spacing: -.5px; }
  .hero p { color: var(--muted); font-size: 13px; }
  .ring {
    width: 106px; height: 106px; border-radius: 50%; flex: 0 0 auto;
    background: conic-gradient(var(--accent) calc(var(--pct, 0) * 1%), var(--line) 0);
    display: grid; place-items: center;
    transition: background .4s;
  }
  .ring-inner {
    width: 82px; height: 82px; border-radius: 50%;
    background: var(--card); display: grid; place-items: center;
    align-content: center; text-align: center;
  }
  .ring-inner strong { font-size: 22px; line-height: 1.1; letter-spacing: -.5px; }
  .ring-inner span { font-size: 10px; color: var(--muted); }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .stat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 17px; box-shadow: var(--shadow);
    text-align: left; font: inherit; color: var(--text); width: 100%;
  }
  .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
  .stat strong { display: block; font-size: 21px; margin: 5px 0 1px; letter-spacing: -.4px; }
  .stat .hint { font-size: 11px; color: var(--muted); }
  .stat[data-action] { cursor: pointer; transition: transform .16s, border-color .16s, box-shadow .16s; }
  .stat[data-action]:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(20,40,30,.09); }
  .stat[data-action]:active { transform: scale(.985); }
  .stat .stat-ico { display: inline-flex; align-items: center; gap: 3px; }
  .stat .stat-ico b { font-weight: 400; font-size: 13px; color: var(--muted); transition: .16s; }
  .stat[data-action]:hover .stat-ico b { color: var(--accent); transform: translateX(2px); }

  /* 环形图 */
  .donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .donut-figure { width: 136px; flex: 0 0 auto; margin: 0 auto; }
  .donut { width: 100%; height: auto; display: block; }
  .donut .dn-v { font-size: 14px; font-weight: 700; fill: var(--text); }
  .donut .dn-l { font-size: 9.5px; fill: var(--muted); }
  .donut-legend { flex: 1 1 148px; min-width: 140px; display: flex; flex-direction: column; gap: 7px; }
  .donut-legend li { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }
  .donut-legend li i { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
  .donut-legend .dn-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-legend .dn-pct { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 11.5px; }
  .donut-legend .dn-val { color: var(--muted); font-size: 10.5px; text-align: right; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  @media (max-width: 430px) {
    .donut-wrap { justify-content: center; }
    .donut-figure { width: 124px; }
    .donut-legend { flex: 1 1 100%; min-width: 100%; }
  }

  /* 折叠按钮 */
  .collapse-btn {
    height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--muted); font-size: 11.5px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 3px; transition: .16s; flex: 0 0 auto;
  }
  .collapse-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--card); }
  .collapse-btn:active { transform: scale(.95); }
  .card-head .chips { align-items: center; }
  /* ⊕ / ⊖ 折叠按钮：圆的大小 = 可点击范围，加号用 CSS 画，铺满圆 */
  .collapse-btn.pm {
    position: relative; width: 32px; height: 32px; padding: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0; line-height: 0; flex: 0 0 auto; overflow: hidden;
    color: var(--accent); border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
    background: var(--accent-soft); -webkit-tap-highlight-color: transparent;
  }
  .collapse-btn.pm::before {
    content: ''; position: absolute; left: 50%; top: 50%; width: 14px; height: 2px;
    margin: -1px 0 0 -7px; border-radius: 2px; background: currentColor;
  }
  .collapse-btn.pm::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 2px; height: 14px;
    margin: -7px 0 0 -1px; border-radius: 2px; background: currentColor;
    transition: transform .16s, opacity .16s;
  }
  .collapse-btn.pm.minus::after { transform: scaleY(0); opacity: 0; }
  .collapse-btn.pm:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: none; opacity: .92; }
  .collapse-btn.pm:active { transform: scale(.92); }
  span.collapse-btn.pm { cursor: inherit; }
  /* 已完成目标：一条一个，整行可点 */
  .done-list { display: flex; flex-direction: column; gap: 10px; }

  /* 日记：年 / 月折叠 */
  .fold-block { margin-top: 14px; }
  .fold-block:first-of-type { margin-top: 0; }
  .fold-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font: inherit; color: var(--text); text-align: left;
    cursor: pointer; transition: .16s;
  }
  .fold-head:hover { border-color: var(--accent); }
  .fold-head:active { transform: scale(.99); }
  .fold-head .fold-pm { flex: 0 0 auto; }
  .fold-head .fname { font-weight: 600; font-size: 14px; letter-spacing: -.1px; }
  .fold-head.open .fname { color: var(--accent); }
  .fold-head .fcount { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fold-head .ftag { font-size: 10.5px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 2px 7px; }
  .fold-sub { margin: 8px 0 0 10px; padding-left: 12px; border-left: 1px dashed var(--line); }
  .fold-sub > .fold-head { background: transparent; border-color: transparent; padding: 5px 8px; gap: 9px; }
  .fold-sub .fold-pm { width: 28px; height: 28px; font-size: 18px; }
  .fold-sub > .fold-head:hover { background: var(--card); border-color: var(--line); }
  .fold-sub > .fold-head .fname { font-size: 13px; font-weight: 500; }
  .fold-body { margin: 8px 0 4px; display: flex; flex-direction: column; gap: 10px; }

  /* 目标：已完成折叠条 */
  .done-strip {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 8px 8px 14px; font: inherit; color: var(--text); text-align: left;
    cursor: pointer; transition: .16s; min-width: 0;
  }
  .done-strip:hover { border-color: var(--accent); }
  .done-strip:active { transform: scale(.995); }
  .done-strip .ds-tick { color: var(--accent); font-size: 13px; flex: 0 0 auto; }
  .done-strip .ds-titles {
    flex: 1; min-width: 0; font-size: 13px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: var(--text);
  }

  /* 提醒弹层 */
  .remind-backdrop {
    position: fixed; inset: 0; background: rgba(10, 20, 16, .42);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    display: grid; place-items: center; padding: 22px; z-index: 120;
    opacity: 0; pointer-events: none; transition: opacity .22s;
  }
  .remind-backdrop.show { opacity: 1; pointer-events: auto; }
  .remind-card {
    width: 100%; max-width: 330px; background: var(--card);
    border-radius: 18px; padding: 22px 20px 16px; text-align: center;
    box-shadow: 0 22px 60px rgba(10, 25, 18, .28);
    transform: translateY(10px) scale(.97); transition: transform .24s cubic-bezier(.2,.9,.3,1);
  }
  .remind-backdrop.show .remind-card { transform: none; }
  .remind-icon { font-size: 34px; line-height: 1; }
  .remind-card h3 { font-size: 16px; margin: 10px 0 6px; }
  .remind-card p { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .remind-card .remind-left {
    margin-top: 12px; display: inline-block; font-size: 12px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 5px 12px;
  }
  .remind-actions { display: flex; gap: 10px; margin-top: 18px; }
  .remind-actions .btn { flex: 1; }

  /* 详情页 */
  .detail-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .detail-hero .big-value { font-size: 30px; letter-spacing: -1px; line-height: 1.2; margin: 4px 0 2px; }
  .detail-note { font-size: 11.5px; color: var(--muted); line-height: 1.7; max-width: 260px; }
  .detail-back { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  /* 目标完成门禁 */
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  .goal-card.shake { animation: shakeX .42s ease; border-color: var(--accent-2); }
  .sub-list.need-finish { background: rgba(217,119,6,.10); border-radius: 10px; padding: 4px 6px; }
  .goal-check.locked { color: var(--accent-2); border-color: var(--accent-2); border-style: dashed; }
  .sub-note { font-size: 10.5px; color: var(--accent-2); margin-top: 5px; }

  /* 周视图 */
  .week-nav { display: inline-flex; align-items: center; gap: 6px; }
  .week-nav strong { font-size: 13.5px; min-width: 92px; text-align: center; }
  .day[disabled], .day.future { opacity: .32; cursor: default; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  /* habit lines */
  .habit-line {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-top: 1px solid var(--line);
    text-align: left; border-radius: 8px; transition: background .15s;
  }
  .habit-line:first-of-type { border-top: 0; }
  .habit-line:hover { background: var(--bg); }
  .habit-line .emoji { font-size: 18px; width: 24px; text-align: center; }
  .habit-line .name { flex: 1; font-weight: 500; }
  .habit-line .streak { font-size: 11px; color: var(--muted); }
  .check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1.5px solid var(--line); display: grid; place-items: center;
    font-size: 12px; color: transparent; flex: 0 0 auto; transition: .15s;
  }
  .habit-line:hover .check { border-color: var(--accent); }
  .check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* progress */
  .progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0; }
  .progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-hi)); transition: width .35s; }
  .progress.slim { height: 6px; }
  .goal-mini { padding: 11px 0; border-top: 1px solid var(--line); }
  .goal-mini:first-of-type { border-top: 0; padding-top: 0; }
  .goal-mini .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .goal-mini .row strong { font-size: 13.5px; font-weight: 600; }
  .goal-mini .row span { font-size: 12px; color: var(--muted); }

  /* heatmap */
  .hm-wrap { overflow-x: auto; padding-bottom: 2px; }
  .hm-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; width: max-content; }
  .hm-cell { width: 13px; height: 13px; border-radius: 3.5px; background: var(--line); display: inline-block; }
  .hm-cell.lv1 { background: var(--accent); opacity: .28; }
  .hm-cell.lv2 { background: var(--accent); opacity: .58; }
  .hm-cell.lv3 { background: var(--accent); opacity: 1; }
  .hm-cell.future { opacity: .16; }
  .hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 12px; color: var(--muted); font-size: 11px; }
  .hm-legend .hm-cell { width: 11px; height: 11px; }

  /* chart */
  .chart { display: flex; align-items: flex-end; gap: 5px; height: 148px; padding-top: 6px; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .bar-track { width: 100%; max-width: 24px; height: 100%; display: flex; align-items: flex-end; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bar-fill { width: 100%; border-radius: 6px; background: linear-gradient(180deg, var(--accent-hi), var(--accent)); min-height: 3px; }
  .bar-fill.zero { background: var(--line); }
  .bar-label { font-size: 9px; color: var(--muted); white-space: nowrap; }
  .bar-col:hover .bar-track { outline: 1px solid var(--accent); outline-offset: 1px; }

  /* journal */
  .journal-entry { padding: 18px 20px; }
  .journal-entry header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .journal-entry .jdate { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .journal-entry .mood { font-size: 20px; }
  .journal-entry p { font-size: 13px; margin-top: 7px; color: var(--text); }
  .journal-entry .label {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; margin-right: 7px;
    vertical-align: 1px;
  }
  .journal-entry .label.warn { color: var(--accent-2); background: rgba(217,119,6,.1); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .tag { font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

  /* goals */
  .goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .goal-card { display: flex; flex-direction: column; }
  .goal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .goal-card h3 { font-size: 16px; margin: 9px 0 2px; letter-spacing: -.2px; }
  .goal-card .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .goal-meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .goal-meta strong { font-size: 13px; }
  .goal-meta span { color: var(--muted); }
  .goal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
  .goal-foot .over { color: var(--danger); font-weight: 600; }
  .goal-foot .soon { color: var(--accent-2); font-weight: 600; }

  /* 目标分类筛选 */
  .goal-filters {
    display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 4px; margin-bottom: 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .goal-filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex: 0 0 auto; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); transition: .15s;
  }
  .filter-chip.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }

  /* 进行中 / 已完成 */
  .goal-section { margin-top: 16px; }
  .goal-section + .goal-section { margin-top: 26px; }
  .section-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 9px; }
  .section-head h3 { font-size: 14px; }
  .section-head .cnt {
    font-size: 11px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 18px;
  }
  .goal-group + .goal-group { margin-top: 12px; }
  .group-head { display: flex; align-items: center; gap: 6px; margin: 0 2px 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .group-head::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); opacity: .5; }
  .group-head .cnt { font-weight: 500; opacity: .75; }

  /* 目标完成按钮 */
  .goal-check {
    width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%;
    border: 1.5px solid var(--line); color: transparent; font-size: 13px; font-weight: 700;
    display: grid; place-items: center; transition: .15s;
  }
  .goal-check:hover { border-color: var(--accent); color: var(--accent); }
  .goal-check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .goal-top .chips { margin-left: auto; }
  .goal-top .chips .collapse-btn.pm { width: 28px; height: 28px; }

  .goal-card .goal-title { font-size: 16px; margin: 9px 0 2px; letter-spacing: -.2px; transition: color .2s; }
  .goal-card.is-done { background: var(--bg); border-color: var(--line); opacity: .8; }
  .goal-card.is-done .goal-title {
    text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--muted);
    color: var(--muted);
  }
  .goal-card.is-done .progress i { background: var(--muted); opacity: .4; }
  .goal-card.is-done .note, .goal-card.is-done .goal-meta span, .goal-card.is-done .goal-foot { color: var(--muted); }

  /* 小目标 */
  .sub-wrap { margin-top: 11px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .sub-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .sub-list { display: flex; flex-direction: column; }
  .sub-item { display: flex; align-items: center; gap: 8px; padding: 5px 3px; border-radius: 8px; }
  .sub-item:hover { background: var(--bg); }
  .goal-card.is-done .sub-item:hover { background: transparent; }
  .sub-check {
    width: 18px; height: 18px; flex: 0 0 auto; border-radius: 6px; border: 1.5px solid var(--line);
    color: transparent; font-size: 11px; display: grid; place-items: center; transition: .15s;
  }
  .sub-check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .sub-title { flex: 1; font-size: 12.5px; line-height: 1.45; word-break: break-word; }
  .sub-item.done .sub-title { text-decoration: line-through; color: var(--muted); }
  .sub-del { width: 22px; height: 22px; border-radius: 6px; color: var(--muted); font-size: 11px; opacity: 0; transition: .15s; }
  .sub-item:hover .sub-del { opacity: .8; }
  @media (hover: none) { .sub-del { opacity: .45; } }
  .sub-add { margin-top: 4px; }
  .sub-add input {
    width: 100%; border: 1px dashed var(--line); background: var(--bg); color: var(--text);
    font-size: 12.5px; padding: 8px 10px; border-radius: 9px; transition: .15s;
  }
  .sub-add input:focus { border-style: solid; border-color: var(--accent); background: var(--card); outline: none; }
  .sub-add input::placeholder { color: var(--muted); }
  .sub-empty { font-size: 11.5px; color: var(--muted); padding: 3px 3px 1px; }
  .demo-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; padding: 11px 16px; font-size: 12.5px;
    background: var(--accent-soft); border-color: transparent; box-shadow: none; color: var(--accent);
  }
  .demo-banner .btn { padding: 5px 12px; font-size: 12px; background: var(--card); color: var(--accent); border: 1px solid var(--line); }
  .stepper { display: flex; gap: 4px; }
  .stepper button, .icon-btn {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: var(--muted); font-size: 14px; border: 1px solid var(--line); background: var(--card); transition: .15s;
  }
  .stepper button:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .icon-btn { border-color: transparent; }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn.danger:hover { background: rgba(194,65,58,.09); color: var(--danger); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 600;
  }
  .chip.cat-1 { background: rgba(59,130,246,.12); color: #2563eb; }
  .chip.cat-2 { background: rgba(217,119,6,.13); color: #b45309; }
  .chip.cat-3 { background: rgba(139,92,246,.13); color: #7c3aed; }
  .chip.cat-4 { background: rgba(236,72,153,.12); color: #db2777; }
  .chip.cat-5 { background: rgba(107,114,128,.14); color: #4b5563; }
  [data-mode="dark"] .chip.cat-1 { color: #82b1ff; }
  [data-mode="dark"] .chip.cat-2 { color: #f0a24b; }
  [data-mode="dark"] .chip.cat-3 { color: #b79cff; }
  [data-mode="dark"] .chip.cat-4 { color: #f77bb5; }
  [data-mode="dark"] .chip.cat-5 { color: #aeb8b2; }

  /* habits page */
  .habit-item {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; margin-top: 10px;
    flex-wrap: wrap;
  }
  .habit-info { display: flex; align-items: center; gap: 10px; min-width: 170px; flex: 1; }
  .habit-info .emoji-big { font-size: 24px; }
  .habit-info strong { display: block; font-size: 14px; }
  .habit-info .meta { font-size: 11.5px; color: var(--muted); }
  .week { display: flex; gap: 6px; }
  .day {
    width: 38px; height: 46px; border-radius: 10px; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 10px; color: var(--muted); transition: .15s;
  }
  .day b { font-size: 12px; height: 14px; font-weight: 700; }
  .day:hover { border-color: var(--accent); }
  .day.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .day.today { box-shadow: 0 0 0 2px var(--accent-soft); font-weight: 700; }

  /* learning */
  .learn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .learn-card h3 { font-size: 15.5px; margin: 8px 0 2px; }
  .learn-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .learn-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
  .link-btn { color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 4px; border-radius: 6px; }
  .link-btn:hover { background: var(--accent-soft); }
  .stars { display: flex; gap: 2px; margin: 6px 0 2px; }
  .stars button { font-size: 17px; line-height: 1; color: var(--line); padding: 0 1px; transition: transform .1s; }
  .stars button.on { color: #f0a24b; }
  .stars button:hover { transform: scale(1.15); }
  .session-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 2px; border-top: 1px solid var(--line); font-size: 12.5px;
  }
  .session-row:first-of-type { border-top: 0; }
  .session-row .sdate { color: var(--muted); font-size: 11.5px; white-space: nowrap; width: 62px; }
  .session-row .stitle { flex: 1; font-weight: 500; }
  .session-row .smin { color: var(--accent); font-weight: 600; white-space: nowrap; }

  /* finance */
  .fin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .grid-2.fin-grid { align-items: start; }
  .fin-left { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .fin-fact { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .fin-fact:first-of-type { border-top: 0; padding-top: 0; }
  .fin-fact strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .stat.clickable { cursor: pointer; transition: .15s; }
  .stat.clickable:hover { border-color: var(--accent); transform: translateY(-1px); }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav strong { font-size: 15px; min-width: 92px; text-align: center; letter-spacing: -.2px; }
  .month-nav .nav-btn {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); display: grid; place-items: center;
    color: var(--muted); font-size: 17px; line-height: 1;
  }
  .month-nav .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .amount-input { font-size: 20px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .cat-row { padding: 9px 0; border-top: 1px solid var(--line); }
  .cat-row:first-child { border-top: 0; padding-top: 0; }
  .cat-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; margin-bottom: 5px; }
  .cat-top strong { font-variant-numeric: tabular-nums; }
  .tx-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); }
  .tx-row:first-of-type { border-top: 0; }
  .tx-icon {
    width: 36px; height: 36px; border-radius: 11px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 17px; background: var(--bg);
  }
  .tx-main { flex: 1; min-width: 0; }
  .tx-title { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .tx-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-amount { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tx-amount.income { color: var(--accent); }
  .tx-amount.expense { color: var(--danger); }
  .chip.expense { background: rgba(194,65,58,.1); color: var(--danger); }
  .chip.income { background: var(--accent-soft); color: var(--accent); }
  .mini-select { width: auto; padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  .money { font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
  .text-danger { color: var(--danger); }

  /* finance year view */
  .fin-head-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .seg button { padding: 5px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .15s; }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .fin-facts { margin-top: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
  .year-top { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; align-items: start; }
  .year-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .year-top > *, .year-bottom > * { min-width: 0; }
  .y-chart { display: flex; align-items: flex-end; gap: 5px; height: 210px; padding-top: 6px; }
  .y-col {
    flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; gap: 6px;
    padding: 0; border-radius: 7px; transition: background .15s;
  }
  .y-col:hover { background: var(--bg); }
  .y-bars { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
  .y-bar { width: 40%; max-width: 16px; border-radius: 4px 4px 2px 2px; }
  .y-bar.income { background: linear-gradient(180deg, var(--accent-hi), var(--accent)); }
  .y-bar.expense { background: var(--danger); opacity: .8; }
  .y-label { font-size: 9px; color: var(--muted); white-space: nowrap; }
  .legend { display: flex; align-items: center; gap: 16px; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: 0; }
  .fin-table-wrap { overflow-x: auto; }
  .fin-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 430px; }
  .fin-table th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: right; padding: 0 8px 9px; white-space: nowrap; }
  .fin-table th:first-child { text-align: left; }
  .fin-table td { padding: 9px 8px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fin-table td:first-child { text-align: left; }
  .fin-table tbody tr { cursor: pointer; transition: background .12s; }
  .fin-table tbody tr:hover { background: var(--bg); }
  .fin-table tr.zero td { color: var(--muted); }
  .fin-table tr.total td { font-weight: 700; background: var(--bg); }
  .fin-table .m-name { font-weight: 600; }
  .fin-table .m-bar { width: 74px; padding-right: 0; }
  .fin-table .m-bar i { display: block; height: 5px; border-radius: 99px; background: var(--danger); opacity: .7; }
  @media (max-width: 560px) {
    .fin-head-left { gap: 10px; }
    .fin-head-left + .btn.primary { width: 100%; }
    .fin-table { min-width: 0; }
    .fin-table th, .fin-table td { padding: 8px 4px; font-size: 11px; }
    .fin-table th:last-child, .fin-table td:last-child { display: none; }
  }

  /* forms */
  label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  input, select, textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; color: var(--text); outline: none; width: 100%; transition: .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 44px; line-height: 1.6; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row.three { grid-template-columns: 1.2fr 1fr 1fr; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: .15s; }
  .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 12px rgba(0,0,0,.16); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { border: 1px solid var(--line); color: var(--muted); }
  .btn.ghost:hover { background: var(--bg); color: var(--text); }
  .btn.danger { color: var(--danger); border: 1px solid rgba(194,65,58,.3); }
  .btn.danger:hover { background: rgba(194,65,58,.08); }
  .page-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .page-actions h2 { font-size: 15px; font-weight: 600; }

  /* empty */
  .empty { text-align: center; padding: 26px 12px; color: var(--muted); font-size: 12.5px; }
  .empty .big { font-size: 28px; margin-bottom: 6px; }

  /* modal / toast */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(9,18,14,.48);
    display: grid; place-items: center; padding: 20px; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--card); border-radius: 20px; border: 1px solid var(--line);
    width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,.28); animation: pop .16s ease;
  }
  @keyframes pop { from { transform: scale(.975); opacity: 0; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h3 { font-size: 18px; }
  .modal .close { font-size: 16px; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; }
  .modal .close:hover { background: var(--bg); }

  /* theme picker */
  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .theme-card {
    position: relative; display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    padding: 9px; border-radius: 13px; border: 1px solid var(--line); background: var(--card);
    text-align: left; color: var(--text); transition: .15s;
  }
  .theme-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .theme-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .theme-preview {
    position: relative; height: 52px; border-radius: 9px; padding: 7px;
    display: flex; gap: 5px; background: var(--p-bg);
    border: 1px solid rgba(0,0,0,.08);
  }
  .theme-preview .tp-side { width: 15px; border-radius: 4px; background: var(--p-card); border: 1px solid var(--p-line); }
  .theme-preview .tp-main {
    flex: 1; border-radius: 4px; background: var(--p-card); border: 1px solid var(--p-line);
    padding: 5px 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .theme-preview .tp-main i { display: block; height: 4px; border-radius: 2px; background: var(--p-line); }
  .theme-preview .tp-main i:first-child { width: 62%; background: var(--p-accent); }
  .theme-preview .tp-main i:last-child { width: 44%; }
  .theme-check {
    position: absolute; right: 4px; top: 4px; width: 16px; height: 16px; border-radius: 50%;
    display: none; place-items: center; font-size: 10px; font-weight: 700;
    background: var(--p-accent); color: #fff; font-style: normal;
  }
  .theme-card.active .theme-check { display: grid; }
  .theme-name { font-size: 12.5px; font-weight: 600; }
  .theme-desc { font-size: 10.5px; color: var(--muted); margin-top: -4px; }
  @media (max-width: 1120px) {
    .year-top { grid-template-columns: 1fr; }
  }
  @media (max-width: 980px) {
    .year-bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .theme-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 16px);
    background: #17231d; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  [data-mode="dark"] .toast { background: #e9f1ec; color: #17231d; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 应用内确认框（不使用浏览器原生 confirm，避免被 WebView/预览容器拦截） */
  .confirm-backdrop {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(9,18,14,.5);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    display: grid; place-items: center;
    padding: calc(18px + var(--sat, 0px)) 18px calc(18px + var(--sab, 0px));
    animation: fadeIn .14s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .confirm-backdrop.hidden { display: none; }
  .confirm-card {
    width: min(350px, 100%); background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px 18px 15px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.3); animation: pop .16s ease;
  }
  .confirm-icon {
    width: 46px; height: 46px; margin: 0 auto 10px; border-radius: 50%;
    display: grid; place-items: center; font-size: 21px; line-height: 1;
    background: rgba(194,65,58,.1);
  }
  .confirm-card h3 { font-size: 16.5px; margin-bottom: 6px; }
  .confirm-msg { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .confirm-actions { display: flex; gap: 10px; margin-top: 18px; }
  .confirm-actions .btn { flex: 1; min-height: 44px; font-size: 14px; }
  .btn.solid-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 14px rgba(194,65,58,.26); }
  .btn.solid-danger:hover { filter: brightness(1.06); }
  .icon-btn:active, .stepper button:active, .day:active, .btn:active { transform: scale(.95); }

  /* responsive */
  @media (max-width: 1200px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .fin-stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 1000px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stats > .stat:last-child:nth-child(odd) { grid-column: span 2; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .main { padding: 24px 22px 60px; }
  }
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .sidebar {
      width: auto; flex: none; height: auto; position: static;
      border-right: 0; border-bottom: 1px solid var(--line);
      padding: 12px 14px; gap: 10px;
    }
    .brand { padding: 0 4px; }
    .logo { width: 34px; height: 34px; font-size: 18px; border-radius: 11px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 2px; padding-bottom: 2px; }
    .nav button { white-space: nowrap; padding: 7px 10px; font-size: 13px; }
    .sidebar-foot {
      margin-top: 0; border-top: 0; padding-top: 0;
      flex-direction: row; flex-wrap: wrap; gap: 2px;
    }
    .sidebar-foot button { font-size: 11.5px; padding: 5px 8px; }
    .main { padding: 18px 14px 56px; }
    .topbar { flex-direction: column; margin-bottom: 16px; }
    .topbar h1 { font-size: 22px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 16px; }
    .ring-wrap { align-self: center; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .stats { gap: 10px; }
    .card { padding: 16px; }
    .form-row, .form-row.three { grid-template-columns: 1fr; gap: 0; }
    .habit-item { gap: 12px; }
    .week { width: 100%; }
    .day { flex: 1; width: auto; }
    /* 手机端把垃圾桶固定到卡片右上角，避免被挤到星期行下方变成孤立小方块 */
    .habit-item { position: relative; padding-right: 46px; }
    .habit-item > .icon-btn { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; font-size: 15px; }
    .habit-item > .icon-btn:active { background: rgba(194,65,58,.12); }
  }

  /* Android shell */
  .mobile-header { display: none; }
  @media (max-width: 860px), (orientation: landscape) and (max-height: 520px) {
    html { scroll-padding-top: calc(72px + var(--sat)); }
    body { min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: none; }
    .mobile-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      position: fixed; top: 0; left: 0; right: 0; z-index: 35;
      height: calc(58px + var(--sat));
      padding: calc(9px + var(--sat)) calc(14px + var(--sar)) 9px calc(14px + var(--sal));
      background: var(--card); border-bottom: 1px solid var(--line);
    }
    .mobile-header .brand { display: flex; padding: 0; }
    .mobile-header .logo { width: 34px; height: 34px; font-size: 17px; border-radius: 11px; color: var(--on-accent); font-weight: 800; }
    .mobile-header h1 { font-size: 16px; }
    #mobileSettings {
      min-height: 38px; padding: 7px 13px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font-size: 12.5px; font-weight: 600;
    }
    .app { display: block; min-height: 100vh; min-height: 100dvh; }
    .sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40;
      display: block; width: 100%; height: auto; padding: 0;
      background: var(--card); border: 0; border-top: 1px solid var(--line);
      box-shadow: 0 -6px 24px rgba(16,40,30,.06);
    }
    .sidebar > .brand { display: none; }
    .nav {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0; overflow: visible;
      padding: 5px calc(4px + var(--sar)) calc(5px + var(--sab)) calc(4px + var(--sal));
    }
    .nav button {
      min-width: 0; min-height: 55px; padding: 4px 1px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px; white-space: nowrap; font-size: 11px; line-height: 1.35;
    }
    .nav .ico { width: auto; font-size: 19px; line-height: 1.3; }
    .sidebar-foot {
      display: none; position: fixed; top: calc(64px + var(--sat));
      left: auto; right: 12px; bottom: auto; z-index: 45;
      width: min(320px, calc(100vw - 24px)); margin: 0; padding: 10px;
      grid-template-columns: 1fr 1fr; gap: 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0,0,0,.2);
    }
    .sidebar-foot.mobile-open { display: grid; }
    .sidebar-foot button {
      min-height: 44px; padding: 9px 8px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--line);
      text-align: center; font-size: 12px;
    }
    .main {
      width: 100%; max-width: none; margin: 0;
      padding: calc(76px + var(--sat)) calc(14px + var(--sar))
               calc(94px + var(--sab)) calc(14px + var(--sal));
    }
    .topbar { flex-direction: row; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
    .topbar h1 { font-size: 23px; }
    .today-chip { display: none; }
    .hero h2 { font-size: 22px; }
    .card { border-radius: 16px; }
    .btn { min-height: 42px; }
    .link-btn { min-height: 34px; display: inline-flex; align-items: center; }
    .icon-btn, .stepper button { width: 36px; height: 36px; }
    .habit-line { min-height: 48px; }
    .modal-backdrop {
      place-items: end center;
      padding: calc(10px + var(--sat)) calc(10px + var(--sar))
               calc(10px + var(--sab)) calc(10px + var(--sal));
    }
    .modal {
      width: 100%;
      max-height: calc(100vh - 24px - var(--sat) - var(--sab));
      max-height: calc(100dvh - 24px - var(--sat) - var(--sab));
      margin: 0; padding: 20px; border-radius: 20px; overscroll-behavior: contain;
    }
    .toast {
      bottom: calc(86px + var(--sab)); width: max-content;
      max-width: calc(100vw - 32px); text-align: center;
    }
  }
  @media (max-width: 370px) {
    .main { padding-left: 10px; padding-right: 10px; }
    .nav button { font-size: 10px; }
    .nav .ico { font-size: 18px; }
    .stat { padding: 13px; }
  }

  /* 大尺寸直屏（Find X8 Ultra 之类约 450dp 宽）：留白略放宽，字号微调 */
  @media (min-width: 400px) and (max-width: 860px) and (orientation: portrait) {
    .main { padding-left: calc(18px + var(--sal)); padding-right: calc(18px + var(--sar)); }
    .topbar h1 { font-size: 25px; }
    .nav button { font-size: 11.5px; }
    .nav .ico { font-size: 20px; }
    .card { padding: 20px; }
  }

  /* 手机横屏：压缩顶栏与底栏，把高度留给内容 */
  @media (orientation: landscape) and (max-height: 520px) {
    .mobile-header {
      height: calc(48px + var(--sat));
      padding-top: calc(5px + var(--sat)); padding-bottom: 5px;
    }
    .mobile-header .logo { width: 28px; height: 28px; font-size: 14px; border-radius: 9px; }
    .mobile-header h1 { font-size: 14px; }
    #mobileSettings { min-height: 32px; padding: 5px 10px; font-size: 12px; }
    .sidebar-foot { top: calc(54px + var(--sat)); }
    .main {
      padding-top: calc(60px + var(--sat));
      padding-bottom: calc(72px + var(--sab));
    }
    .nav button { min-height: 42px; font-size: 10px; justify-self: center; padding: 4px 16px; }
    .nav { max-width: 640px; margin: 0 auto; }
    .nav .ico { font-size: 15px; }
    .toast { bottom: calc(64px + var(--sab)); }
  }

  /* ==================== iOS / iPhone 适配 ==================== */
  html { -webkit-text-size-adjust: 100%; }
  html, body { -webkit-tap-highlight-color: transparent; }
  body { overscroll-behavior-y: none; }
  /* 输入控件 ≥16px：Safari 聚焦时不会自动放大整页 */
  input, select, textarea { font-size: 16px; }
  button, .stat, .filter-chip, .nav button, .nav-btn, .collapse-btn, .goal-check {
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  /* 长按不弹「拷贝/查词」菜单，但正文仍可选中 */
  .nav button, .nav-btn, .collapse-btn, .goal-check, .chip, .stat { -webkit-touch-callout: none; }
  /* iOS 独立运行时的全屏与弹性滚动 */
  html[data-standalone="true"] body { min-height: 100vh; min-height: 100dvh; }
  html[data-standalone="true"] .nav { padding-bottom: calc(5px + var(--sab)); }
  .modal-box, .sidebar { -webkit-overflow-scrolling: touch; }
  /* 首次访问的「添加到主屏幕」引导条 */
  .ios-install-hint {
    position: fixed; left: 12px; right: 12px; z-index: 200;
    bottom: calc(80px + var(--sab));
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 14px;
    background: rgba(23,35,29,.93); color: #fff; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 10px 30px rgba(16,40,30,.24);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    animation: hintIn .28s ease-out;
  }
  .ios-install-hint b { color: #8ee0bb; }
  .ios-install-hint button {
    flex: 0 0 auto; background: rgba(255,255,255,.18); color: #fff; border: 0;
    border-radius: 999px; padding: 6px 11px; font-size: 12px;
  }
  @keyframes hintIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header class="mobile-header">
  <div class="brand">
    <div class="logo">G</div>
    <div><h1>成长日志</h1><span class="sub">Growth OS</span></div>
  </div>
  <button type="button" id="mobileSettings" aria-expanded="false">设置</button>
</header>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🌱</div>
      <div><h1>成长日志</h1><span class="sub">Growth OS</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-action="nav" data-view="dashboard" class="active"><span class="ico">📊</span>概览</button>
      <button data-action="nav" data-view="goals"><span class="ico">🎯</span>目标</button>
      <button data-action="nav" data-view="habits"><span class="ico">🔥</span>习惯</button>
      <button data-action="nav" data-view="journal"><span class="ico">✍️</span>日记</button>
      <button data-action="nav" data-view="learning"><span class="ico">📚</span>学习</button>
      <button data-action="nav" data-view="finance"><span class="ico">💰</span>记账</button>
    </nav>
    <div class="sidebar-foot">
      <button id="shareBtn">📤 分享备份到微信</button>
      <button id="exportBtn">⬇️ 导出备份</button>
      <button id="importBtn">⬆️ 导入备份</button>
      <button id="restoreBtn">♻️ 恢复自动存档</button>
      <button id="themeBtn">🎨 主题 · 森林绿</button>
      <button id="resetBtn" class="danger">🗑️ 清空数据</button>
      <div class="foot-hint" id="footHint">每次改动都会自动存档一份到应用内，最多保留 8 份；换手机或清理数据前，先「分享备份到微信」发给自己留一份。</div>
      <script>
        /* iOS 版：自动存档存在浏览器本地，说清楚风险 */
        if (document.documentElement.dataset.platform === 'ios') {
          document.getElementById('footHint').textContent =
            '每次改动会自动存一份在本机浏览器存储里，最多留 5 份。iOS 删除 Safari 数据或卸载时会一起清空，重要节点请「分享备份到微信」存一份到聊天记录。';
        }
      </script>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">概览</h1>
        <p class="page-sub" id="pageSub"></p>
      </div>
      <div class="today-chip" id="todayChip"></div>
    </header>
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-goals"></section>
    <section class="view" id="view-habits"></section>
    <section class="view" id="view-journal"></section>
    <section class="view" id="view-learning"></section>
    <section class="view" id="view-finance"></section>
    <section class="view" id="view-detail"></section>
  </main>
</div>
<div class="modal-backdrop hidden" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="confirm-backdrop hidden" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-card">
    <div class="confirm-icon" id="confirmIcon">⚠️</div>
    <h3 id="confirmTitle">请确认</h3>
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="btn ghost" id="confirmCancel" data-action="confirm-cancel">取消</button>
      <button class="btn solid-danger" id="confirmOk" data-action="confirm-ok">确定</button>
    </div>

function normalizeState(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};

  s.habits = Array.isArray(s.habits) ? s.habits : [];
  s.habitLogs = s.habitLogs && typeof s.habitLogs === 'object' ? s.habitLogs : {};
  s.journal = Array.isArray(s.journal) ? s.journal : [];
  if (!s.learning || typeof s.learning !== 'object') s.learning = {};
  s.learning.items = Array.isArray(s.learning.items) ? s.learning.items : [];
  s.learning.sessions = Array.isArray(s.learning.sessions) ? s.learning.sessions : [];
  if (!s.finance || typeof s.finance !== 'object') s.finance = {};
  s.finance.transactions = Array.isArray(s.finance.transactions) ? s.finance.transactions : [];
  s.finance.budget = Math.max(0, Number(s.finance.budget) || 0);
  s.finance.transactions.forEach(t => {
    t.type = t.type === 'income' ? 'income' : 'expense';
    t.amount = Math.max(0, Number(t.amount) || 0);
    if (!t.date) t.date = todayKey();
    if (!t.category) t.category = '其他';
  });
  if (!s.settings || typeof s.settings !== 'object') s.settings = {};
  s.settings.theme = normalizeTheme(s.settings.theme);
  if (!s.settings.journalFold || typeof s.settings.journalFold !== 'object') s.settings.journalFold = {};
  if (!s.settings.doneOpen || typeof s.settings.doneOpen !== 'object' || Array.isArray(s.settings.doneOpen)) s.settings.doneOpen = {};
  delete s.settings.goalsDoneOpen;
  s.habits.forEach(h => {
    if (!Array.isArray(s.habitLogs[h.id])) s.habitLogs[h.id] = [];
    if (!h.emoji) h.emoji = '✅';
  });
  s.journal.forEach(j => {
    j.mood = clamp(j.mood || 3, 1, 5);
    j.energy = clamp(j.energy || 3, 1, 5);
  });
  s.goals.forEach(g => {
    if (!g.id) g.id = uid();
    g.title = String(g.title || '未命名目标');
    g.category = String(g.category || '其他');
    g.current = Math.max(0, Number(g.current) || 0);
    g.target = Math.max(0.01, Number(g.target) || 1);
    g.done = !!g.done;
    g.dueTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(g.dueTime || '')) ? g.dueTime : '';
    g.remindedFor = g.remindedFor ? String(g.remindedFor) : null;
    if (!g.done) g.doneAt = null;
    const subs = Array.isArray(g.subtasks) ? g.subtasks : [];
    g.subtasks = subs.filter(t => t && String(t.title || '').trim()).map(t => ({

      title: String(t.title).trim().slice(0, 80),
      done: !!t.done,
      doneAt: t.done ? (t.doneAt || null) : null
    }));
  });
  return s;
}

  const fresh = seedState();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch (e) {}
  return fresh;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ==================== 统计辅助 ==================== */
function goalPct(g) {
  const target = Number(g.target) || 0;
  if (!target) return 0;
  return clamp(Math.round((Number(g.current) || 0) / target * 1000) / 10, 0, 100);
}
function itemPct(it) {
  if (it.type === 'skill') return clamp(Math.round(clamp(it.level || 1, 1, 5) / 5 * 100), 0, 100);
  const total = Number(it.total) || 0;
  if (!total) return 0;
  return clamp(Math.round((Number(it.current) || 0) / total * 1000) / 10, 0, 100);
}
function habitLogs(id) { return state.habitLogs[id] || (state.habitLogs[id] = []); }
function habitDone(id, key) { return habitLogs(id).includes(key); }
function habitStreak(id) {
  const set = new Set(habitLogs(id));
  let d = new Date();
  if (!set.has(toKey(d))) d = addDays(d, -1);
  let n = 0;
  while (set.has(toKey(d)) && n < 3660) { n++; d = addDays(d, -1); }
  return n;
}
function activityScore(key) {
  let score = 0;
  state.habits.forEach(h => { if (habitDone(h.id, key)) score++; });
  if (state.journal.some(j => j.date === key)) score++;
  if (state.learning.sessions.some(s => s.date === key)) score++;
  return score;
}
function globalStreak() {
  let d = new Date();
  if (activityScore(toKey(d)) === 0) d = addDays(d, -1);
  let n = 0;
  while (activityScore(toKey(d)) > 0 && n < 3660) { n++; d = addDays(d, -1); }
  return n;
}
function sessionsOn(key) { return state.learning.sessions.filter(s => s.date === key); }
function itemMinutes(id) { return state.learning.sessions.filter(s => s.itemId === id).reduce((a, s) => a + (Number(s.minutes) || 0), 0); }

/* 周维度：周一为一周起点，新的一周自动从空白开始（历史记录保留） */
function startOfWeek(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dow = (d.getDay() + 6) % 7;
  return addDays(d, -dow);
}
function habitWeekDays(offset) {
  const base = addDays(startOfWeek(new Date()), (offset || 0) * 7);
  return Array.from({ length: 7 }, (_, i) => addDays(base, i));
}
function weekTitle(offset) {
  if (!offset) return '本周';
  const days = habitWeekDays(offset);
  return `${days[0].getMonth() + 1}/${days[0].getDate()} - ${days[6].getMonth() + 1}/${days[6].getDate()}`;
}
function habitWeekCount(id, offset) {
  return habitWeekDays(offset).filter(d => habitDone(id, toKey(d))).length;
}
function financeSummary(month) {
  const list = state.finance.transactions.filter(t => String(t.date).slice(0, 7) === month);
  const income = list.filter(t => t.type === 'income').reduce((a, t) => a + (Number(t.amount) || 0), 0);
  const expense = list.filter(t => t.type === 'expense').reduce((a, t) => a + (Number(t.amount) || 0), 0);
  return { list, income, expense, balance: income - expense };
}
function financeYearSummary(year) {
  const y = String(year);
  const list = state.finance.transactions.filter(t => String(t.date).slice(0, 4) === y);
  const months = Array.from({ length: 12 }, (_, i) => ({ month: i + 1, income: 0, expense: 0 }));
  let income = 0, expense = 0;
  list.forEach(t => {
    const m = Number(String(t.date).slice(5, 7));
    const amt = Number(t.amount) || 0;
    if (m >= 1 && m <= 12) {
      if (t.type === 'income') months[m - 1].income += amt;
      else months[m - 1].expense += amt;
    }
    if (t.type === 'income') income += amt;
    else expense += amt;
  });
  return { list, income, expense, balance: income - expense, months };
}
/** 目标的截止时刻（含可选的具体时间），没有截止日期返回 null */
function goalDueMs(g) {
  if (!g || !g.deadline) return null;
  const t = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(g.dueTime || '')) ? g.dueTime : '23:59';
  const ms = new Date(`${g.deadline}T${t}:00`).getTime();
  return isNaN(ms) ? null : ms;
}

function goalDeadline(g) {
  if (!g.deadline) return { text: '无截止日期', cls: '' };
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((parseKey(g.deadline) - base) / 86400000);
  if (isNaN(diff)) return { text: '日期无效', cls: '' };
  const timeText = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(g.dueTime || '')) ? ` ${g.dueTime}` : '';
  if (diff < 0) return { text: `已逾期 ${-diff} 天`, cls: 'over' };
  const due = goalDueMs(g);
  const leftMs = due ? due - Date.now() : 0;
  if (diff === 0) {
    if (leftMs > 0 && leftMs <= 6 * 3600000) {
      return { text: leftMs <= 3600000 ? `还剩 ${Math.max(1, Math.round(leftMs / 60000))} 分钟` : `还剩 ${Math.round(leftMs / 3600000)} 小时`, cls: 'soon' };
    }
    return { text: `今天截止${timeText}`, cls: 'soon' };
  }
  if (diff <= 7) return { text: `剩 ${diff} 天${timeText}`, cls: 'soon' };
  return { text: `剩 ${diff} 天${timeText}`, cls: '' };
}

/* ==================== 目标到期提醒 ==================== */
const REMIND_AHEAD_MS = 60 * 60 * 1000;   // 到期前 1 小时
let remindGoalId = null;
let lastRemindAt = 0;

function goalRemindKey(g) {
  return `${g.deadline} ${g.dueTime || '23:59'}`;
}

/** 找出进入「1 小时内」窗口且尚未提醒的目标 */
function dueReminderGoals() {
  const now = Date.now();
  return state.goals.filter(g => {
    if (g.done) return false;
    const due = goalDueMs(g);
    if (!due) return false;
    const left = due - now;
    if (left <= 0 || left > REMIND_AHEAD_MS) return false;
    return g.remindedFor !== goalRemindKey(g);
  }).map(g => ({ g, left: goalDueMs(g) - now }));
}

function showReminder(g, leftMs) {
  const mins = Math.max(1, Math.round(leftMs / 60000));
  const msg = `「${g.title}」还有 ${mins} 分钟就到期了，现在推进一下还来得及。`;
  remindGoalId = g.id;
  $('#remindMsg').textContent = msg;
  $('#remindLeft').textContent = `截止 ${fmtDate(g.deadline)}${g.dueTime ? ' ' + g.dueTime : ''}`;
  $('#remind').classList.add('show');
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.notifyGoal === 'function') {
      window.AndroidBridge.notifyGoal('目标快到期了 ⏰', msg);
    }
  } catch (e) {}
}

function closeReminder() { $('#remind').classList.remove('show'); remindGoalId = null; }

function checkGoalReminders(silent) {
  const hits = dueReminderGoals();
  if (!hits.length) return false;
  hits.forEach(h => { h.g.remindedFor = goalRemindKey(h.g); });
  saveState();
  lastRemindAt = Date.now();
  if (!silent) {
    showReminder(hits[0].g, hits[0].left);
    if (hits.length > 1) toast(`另外还有 ${hits.length - 1} 个目标也快到期了`);
  }
  return true;
}

/** 把未完成目标的提醒时间同步给系统闹钟，App 关掉也能收到通知 */
let lastAlarmSync = 0;
function syncGoalAlarms(force) {
  if (!(window.AndroidBridge && typeof window.AndroidBridge.setGoalReminders === 'function')) return;
  const now = Date.now();
  if (!force && now - lastAlarmSync < 4000) return;
  lastAlarmSync = now;
  const list = state.goals.filter(g => !g.done).map(g => {
    const due = goalDueMs(g);
    return due ? { id: g.id, title: g.title, at: due - REMIND_AHEAD_MS } : null;
  }).filter(x => x && x.at > now);
  try { window.AndroidBridge.setGoalReminders(JSON.stringify(list)); } catch (e) {}
}

function heatmapHTML() {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const start = addDays(now, -dow - 11 * 7);
  let cells = '';
  for (let w = 0; w < 12; w++) {
    for (let d = 0; d < 7; d++) {
      const date = addDays(start, w * 7 + d);
      const key = toKey(date);
      const future = date > now;
      const score = future ? 0 : activityScore(key);
      const lvl = score === 0 ? 0 : score <= 1 ? 1 : score <= 3 ? 2 : 3;
      cells += `<div class="hm-cell lv${lvl}${future ? ' future' : ''}" title="${fmtDate(key)} · ${score ? score + ' 项活动' : '无记录'}"></div>`;
    }
  }
  return `<div class="hm-wrap"><div class="hm-grid">${cells}</div></div>
    <div class="hm-legend"><span>少</span><i class="hm-cell lv0"></i><i class="hm-cell lv1"></i><i class="hm-cell lv2"></i><i class="hm-cell lv3"></i><span>多</span><span style="margin-left:auto">最近 12 周</span></div>`;
}

function studyChartHTML() {
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(new Date(), -i));
  const mins = days.map(d => sessionsOn(toKey(d)).reduce((a, s) => a + (Number(s.minutes) || 0), 0));
  const max = Math.max(30, ...mins);
  const bars = days.map((d, i) => {

    return `<div class="bar-col" title="${fmtDate(toKey(d))} · ${m ? fmtDuration(m) : '没有记录'}">

    </div>`;
  }).join('');
  return `<div class="chart">${bars}</div>`;
}

/* 环形占比图：items = [{ label, value, color, valueText }] */
function donutChart(items, opts) {
  const o = opts || {};
  const list = (items || []).filter(i => (Number(i.value) || 0) > 0);
  const total = list.reduce((a, i) => a + (Number(i.value) || 0), 0);
  const R = 52, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = list.map(it => {
    const len = total ? (Number(it.value) || 0) / total * C : 0;
    const seg = len > 0.5 ? `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${it.color}"
      stroke-width="17" stroke-dasharray="${Math.max(len - 2.4, 0.5)} ${C}"
      stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"></circle>` : '';
    acc += len;
    return seg;
  }).join('');
  const center = total
    ? `<text x="60" y="57" text-anchor="middle" class="dn-v">${esc(o.center != null ? o.center : total)}</text>
       <text x="60" y="72" text-anchor="middle" class="dn-l">${esc(o.centerLabel || '合计')}</text>`
    : `<text x="60" y="60" text-anchor="middle" class="dn-l">暂无数据</text>`;
  const rows = list.map(it => {
    const pct = total ? Math.round((Number(it.value) || 0) / total * 1000) / 10 : 0;
    return `<li><i style="background:${it.color}"></i><span class="dn-name">${esc(it.label)}</span>
      <span class="dn-pct">${pct}%</span>
      ${it.valueText ? `<span class="dn-val">${esc(it.valueText)}</span>` : ''}</li>`;
  }).join('');
  return `<div class="donut-wrap">
    <div class="donut-figure"><svg viewBox="0 0 120 120" class="donut" role="img">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="17" opacity=".55"></circle>
      ${segs}${center}</svg></div>
    ${rows ? `<ul class="donut-legend">${rows}</ul>` : `<div class="small muted">这个时间段还没有记录。</div>`}
  </div>`;
}

function detailGoals() {
  const all = state.goals;
  const active = all.filter(g => !g.done);
  const finished = all.filter(g => g.done);
  const avg = active.length ? Math.round(active.reduce((a, g) => a + goalPct(g), 0) / active.length) : 0;
  const counts = {};
  all.forEach(g => { const k = g.category || '其他'; counts[k] = (counts[k] || 0) + 1; });
  const items = Object.entries(counts).map(([name, n], i) => ({
    label: name, value: n, color: FIN_COLORS[i % FIN_COLORS.length], valueText: `${n} 个`
  })).sort((a, b) => b.value - a.value);
  const subDone = all.reduce((a, g) => a + goalSubStats(g).done, 0);
  const subTotal = all.reduce((a, g) => a + goalSubStats(g).total, 0);
  const rows = active.slice(0, 6).map(g => {
    const p = goalPct(g);
    const st = goalSubStats(g);
    return `<div class="goal-mini">

      <div class="progress slim"><i style="width:${p}%"></i></div>
      <div class="row"><span>${st.total ? `小目标 ${st.done}/${st.total}` : `${fmtNum(g.current)} / ${fmtNum(g.target)} ${esc(g.unit || '')}`}</span><span>${esc(g.category || '其他')}</span></div>

    title: '目标进度',
    sub: '按分类看目标分布，确认精力放在了正确的地方。',
    value: `${avg}%`, valueLabel: '进行中目标平均进度',
    note: `进行中 ${active.length} 个 · 已完成 ${finished.length} 个。`,
    chartTitle: '目标分类分布', chartHint: '按目标数量',

    donutEmpty: '还没有目标，先写下一个想做成的事。',
    facts: [
