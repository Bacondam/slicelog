/** 一个目标只有两种推进方式：
    sub —— 拆成小目标，勾一个推一点（默认）
    count —— 按数量推进，填「当前 / 总量 + 单位」（读书的页数、课程的讲数都走这条） */
const TRACKS = {
  sub: { name: '小目标', hint: '一行一个，勾完就算完成' }
};
/* 2.10：只保留「目标 + 小目标」一种推进方式，按数量已下线。
   旧数据在 normGoal 里由 countToSubs 转成小目标清单。 */
const isCountGoal = () => false;

/** 把「按数量」的老目标转成小目标清单，进度不丢：
    总量 ≤ 30 时按个数逐条拆开，超过就留一条把当时的数字记下来 */
function countToSubs(g) {
  if (!g) return g;
  const tgt = Math.round(Number(g.target) || 0);
  const cur = Number(g.current) || 0;
  const unit = String(g.unit || '').trim();
  g.track = 'sub';
  const has = Array.isArray(g.subtasks) && g.subtasks.length > 0;
  if (!has && tgt > 0) {
    const subs = [];
    if (tgt <= 30) {
      for (let i = 1; i <= tgt; i++) {
        subs.push({ id: uid(), title: unit ? `第 ${i} ${unit}` : `第 ${i} 步`, done: i <= cur, doneAt: i <= cur ? Date.now() : null });
      }
    } else {
      subs.push({ id: uid(), title: `已完成 ${fmtNum(cur)} / ${fmtNum(tgt)}${unit ? ' ' + unit : ''}`, done: cur >= tgt, doneAt: null });
    }
    g.subtasks = subs;
  }
  g.current = 0;
  g.target = 1;
  g.unit = '';
  g.updatedAt = 0;
  return g;
}

/** 单个目标的清洗：新建 / 导入 / 归档恢复都走这里 */
function normGoal(g) {
  if (!g || typeof g !== 'object') return null;
  if (!g.id) g.id = uid();
  g.title = String(g.title || '未命名目标');
  g.category = String(g.category || '其他');
  if (g.track === 'count') countToSubs(g);
  g.track = 'sub';
  g.current = Math.max(0, Number(g.current) || 0);
  g.target = Math.max(0.01, Number(g.target) || 1);
  g.unit = String(g.unit || '').slice(0, 8);
  g.updatedAt = Math.max(0, Number(g.updatedAt) || 0);
  g.done = !!g.done;
  g.dueTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(g.dueTime || '')) ? g.dueTime : '';
  g.archivedAt = Math.max(0, Number(g.archivedAt) || 0);
  if (!g.done) g.doneAt = null;
  const subs = Array.isArray(g.subtasks) ? g.subtasks : [];
  g.subtasks = subs.filter(t => t && String(t.title || '').trim()).map(t => ({
    id: t.id || uid(),
    title: String(t.title).trim().slice(0, 80),
    done: !!t.done,
    doneAt: t.done ? (t.doneAt || null) : null
  }));
  return g;
}

/** v2.2：不再有「学习」这套独立体系。
    旧的 kind 型目标（阅读 / 课程 / 技能）统一转成「按数量」目标，
    更早的 learning.items 也并进 goals，learning 整个字段直接清掉。幂等。 */
function migrateLearnGoals(s) {
  const fix = g => {
    if (!g || !g.kind) return;
    if (g.kind === 'skill') {
      g.target = 5;
      g.unit = '级';
      g.current = clamp(Number(g.level) || 1, 1, 5);
    }
    /* 老的学习型目标一律折成小目标清单，不再有「按数量」 */
    if (!(Number(g.target) > 0)) { g.target = 1; g.current = 0; }
    g.track = 'count';
    countToSubs(g);
    delete g.kind;
    delete g.level;
  };
  s.goals.forEach(fix);
  s.archivedGoals.forEach(fix);

  const L = (s.learning && typeof s.learning === 'object') ? s.learning : null;
  const items = L && Array.isArray(L.items) ? L.items : [];
  if (items.length) {
    const used = new Set(s.goals.map(g => g.id));
    items.forEach(it => {
      if (!it || typeof it !== 'object') return;
      const total = Math.max(0, Number(it.total) || 0);
      const cur = Math.max(0, Number(it.current) || 0);
      const id = (it.id && !used.has(it.id)) ? it.id : uid();
      used.add(id);
      s.goals.push(normGoal({
        id,
        title: it.title || '未命名目标',
        category: '学习',
        track: 'count',
        current: cur,
        target: total > 0 ? total : 1,
        unit: it.unit || '',
        deadline: '',
        note: '',
        createdAt: it.createdAt || Date.now(),
        done: total > 0 && cur >= total,
        doneAt: null,
        subtasks: []
      }));
    });
  }
  delete s.learning;
  delete s.settings.learningMerged;
}

function normalizeState(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};
  s.goals = Array.isArray(s.goals) ? s.goals : [];
  s.archivedGoals = (Array.isArray(s.archivedGoals) ? s.archivedGoals : []).map(normGoal).filter(Boolean);
  s.habits = Array.isArray(s.habits) ? s.habits : [];
  s.habitLogs = s.habitLogs && typeof s.habitLogs === 'object' ? s.habitLogs : {};
  s.journal = Array.isArray(s.journal) ? s.journal : [];
  /* 倒数日：数组顺序就是展示顺序（用户手动排），所以这里只清洗、不重排 */
  s.countdowns = (Array.isArray(s.countdowns) ? s.countdowns : []).map(c => {
    if (!c || typeof c !== 'object') return null;
    const title = String(c.title || '').trim();
    const date = String(c.date || '').trim();
    if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    return {
      id: String(c.id || uid()),
      title: title.slice(0, 40),
      date,
      note: String(c.note || '').trim().slice(0, 80),
      createdAt: Number(c.createdAt) || Date.now(),
      updatedAt: Number(c.updatedAt) || 0
    };
  }).filter(Boolean);
  if (!s.finance || typeof s.finance !== 'object') s.finance = {};
  s.finance.transactions = Array.isArray(s.finance.transactions) ? s.finance.transactions : [];
  s.finance.budget = Math.max(0, Number(s.finance.budget) || 0);
  s.finance.transactions.forEach(t => {
    t.type = t.type === 'income' ? 'income' : 'expense';
    t.amount = Math.max(0, Number(t.amount) || 0);
    if (!t.date) t.date = todayKey();
    if (!t.category) t.category = '其他';
  });
  if (!s.settings || typeof s.settings !== 'object') s.settings = {};
  s.settings.theme = normalizeTheme(s.settings.theme);
  if (!s.settings.journalFold || typeof s.settings.journalFold !== 'object') s.settings.journalFold = {};
  /* 写作区默认收起：进来先看自己的日记，想写再点开 */
  if (typeof s.settings.journalCollapsed !== 'boolean') s.settings.journalCollapsed = true;
  if (!s.settings.cardFold || typeof s.settings.cardFold !== 'object' || Array.isArray(s.settings.cardFold)) s.settings.cardFold = {};
  if (!s.settings.doneOpen || typeof s.settings.doneOpen !== 'object' || Array.isArray(s.settings.doneOpen)) s.settings.doneOpen = {};
  if (typeof s.settings.archOpen !== 'boolean') s.settings.archOpen = false;
  delete s.settings.goalsDoneOpen;
  /* 2.0.A：账簿合并成一张卡，旧的「本月小结 / 支出分类」折叠态已无对应卡片 */
  delete s.settings.cardFold['fin:summary'];
  delete s.settings.cardFold['fin:cats'];
  s.habits.forEach(h => {
    if (!Array.isArray(s.habitLogs[h.id])) s.habitLogs[h.id] = [];
    if (!h.emoji) h.emoji = '✅';
  });
  s.journal.forEach(j => {
    j.mood = clamp(j.mood || 3, 1, 5);
    j.energy = clamp(j.energy || 3, 1, 5);
  });
  s.goals = s.goals.map(normGoal).filter(Boolean);
  /* v2.2 起「学习」不再独立：旧的学习型目标转成按数量推进的目标 */
  migrateLearnGoals(s);
  return s;
}

/* ==================== 统计辅助 ==================== */
function goalPct(g) {
  /* 已完成小目标 / 全部小目标；一个都没有时看是否已手动完成 */
  const st = goalSubStats(g);
  if (st.total) return clamp(Math.round(st.done / st.total * 100), 0, 100);
  return g.done ? 100 : 0;
}
function habitLogs(id) { return state.habitLogs[id] || (state.habitLogs[id] = []); }
function habitDone(id, key) { return habitLogs(id).includes(key); }
function habitStreak(id) {
  const set = new Set(habitLogs(id));
  let d = new Date();
  if (!set.has(toKey(d))) d = addDays(d, -1);
  let n = 0;
  while (set.has(toKey(d)) && n < 3660) { n++; d = addDays(d, -1); }
  return n;
}
function activityScore(key) {
  let score = 0;
  state.habits.forEach(h => { if (habitDone(h.id, key)) score++; });
  if (state.journal.some(j => j.date === key)) score++;
  return score;
}
function globalStreak() {
  let d = new Date();
  if (activityScore(toKey(d)) === 0) d = addDays(d, -1);
  let n = 0;
  while (activityScore(toKey(d)) > 0 && n < 3660) { n++; d = addDays(d, -1); }
  return n;
}

/* 周维度：周一为一周起点，新的一周自动从空白开始（历史记录保留） */
function startOfWeek(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dow = (d.getDay() + 6) % 7;
  return addDays(d, -dow);
}
function habitWeekDays(offset) {
  const base = addDays(startOfWeek(new Date()), (offset || 0) * 7);
  return Array.from({ length: 7 }, (_, i) => addDays(base, i));
}
function weekTitle(offset) {
  if (!offset) return '本周';
  const days = habitWeekDays(offset);
  return `${days[0].getMonth() + 1}/${days[0].getDate()} - ${days[6].getMonth() + 1}/${days[6].getDate()}`;
}
function habitWeekCount(id, offset) {
  return habitWeekDays(offset).filter(d => habitDone(id, toKey(d))).length;
}
function financeSummary(month) {
  const list = state.finance.transactions.filter(t => String(t.date).slice(0, 7) === month);
  const income = list.filter(t => t.type === 'income').reduce((a, t) => a + (Number(t.amount) || 0), 0);
  const expense = list.filter(t => t.type === 'expense').reduce((a, t) => a + (Number(t.amount) || 0), 0);
  return { list, income, expense, balance: income - expense };
}
function financeYearSummary(year) {
  const y = String(year);
  const list = state.finance.transactions.filter(t => String(t.date).slice(0, 4) === y);
  const months = Array.from({ length: 12 }, (_, i) => ({ month: i + 1, income: 0, expense: 0 }));
  let income = 0, expense = 0;
  list.forEach(t => {
    const m = Number(String(t.date).slice(5, 7));
    const amt = Number(t.amount) || 0;
    if (m >= 1 && m <= 12) {
      if (t.type === 'income') months[m - 1].income += amt;
      else months[m - 1].expense += amt;
    }
    if (t.type === 'income') income += amt;
    else expense += amt;
  });
  return { list, income, expense, balance: income - expense, months };
}
/** 目标的截止时刻（含可选的具体时间），没有截止日期返回 null */
function goalDueMs(g) {
  if (!g || !g.deadline) return null;
  const t = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(g.dueTime || '')) ? g.dueTime : '23:59';
  const ms = new Date(`${g.deadline}T${t}:00`).getTime();
  return isNaN(ms) ? null : ms;
}

function goalDeadline(g) {
  if (!g.deadline) return { text: '无截止日期', cls: '' };
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((parseKey(g.deadline) - base) / 86400000);
  if (isNaN(diff)) return { text: '日期无效', cls: '' };
  const timeText = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(g.dueTime || '')) ? ` ${g.dueTime}` : '';
  if (diff < 0) return { text: `已逾期 ${-diff} 天`, cls: 'over' };
  const due = goalDueMs(g);
  const leftMs = due ? due - Date.now() : 0;
  if (diff === 0) {
    if (leftMs > 0 && leftMs <= 6 * 3600000) {
      return { text: leftMs <= 3600000 ? `还剩 ${Math.max(1, Math.round(leftMs / 60000))} 分钟` : `还剩 ${Math.round(leftMs / 3600000)} 小时`, cls: 'soon' };
    }
    return { text: `今天截止${timeText}`, cls: 'soon' };
  }
  if (diff <= 7) return { text: `剩 ${diff} 天${timeText}`, cls: 'soon' };
  return { text: `剩 ${diff} 天${timeText}`, cls: '' };
}

function switchView(view, opts) {

  $$('.view').forEach(el => {

    el.classList.toggle('active', on);
    el.classList.remove('anim-from-right', 'anim-from-left', 'swiping', 'swipe-return');

    }
  });
  clearTimeout(viewAnimTimer);
  viewAnimTimer = setTimeout(() => {
    $$('.view').forEach(el => el.classList.remove('anim-from-right', 'anim-from-left'));
  }, 320);
  try {
    if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  } catch (e) {}
  render();

/* ==================== 左右滑动切页 ==================== */
/* 底部标签顺序即滑动顺序：手指向左拨 → 下一个标签；向右拨 → 上一个 */
const SWIPE_BLOCK_SEL = 'input, textarea, select, .hm-wrap, .chart, .donut-wrap, .goal-filters, .seg, .month-nav, .week-nav, .cselect-btn';
let swipe = null;
let suppressTap = false;

function swipeAllowed(target) {
  if (currentView === 'detail') return false;
  if (VIEW_ORDER.indexOf(currentView) < 0) return false;
  if (!modalEl.classList.contains('hidden')) return false;
  if (!confirmEl.classList.contains('hidden')) return false;
  if (!target || !target.closest) return false;
  if (target.closest(SWIPE_BLOCK_SEL)) return false;
  /* 容器本身可横向滚动（比如筛选条、柱状图）时不劫持手势 */
  let el = target;
  while (el && el !== document.body) {
    const st = getComputedStyle(el);
    if ((st.overflowX === 'auto' || st.overflowX === 'scroll') && el.scrollWidth > el.clientWidth + 6) return false;
    el = el.parentElement;
  }
  return true;
}

function initSwipe(el) {
  el.addEventListener('touchstart', e => {
    swipe = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (!swipeAllowed(e.target)) return;
    swipe = {
      x: t.clientX, y: t.clientY, dx: 0, dy: 0, lock: 0,
      at: Date.now(),
      viewEl: document.getElementById('view-' + currentView)
    };
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!swipe || e.touches.length !== 1) return;
    const t = e.touches[0];
    swipe.dx = t.clientX - swipe.x;
    swipe.dy = t.clientY - swipe.y;
    if (!swipe.lock) {
      if (Math.abs(swipe.dx) < 10 && Math.abs(swipe.dy) < 10) return;
      /* 横着拨才接管，竖着拨留给页面滚动 */
      swipe.lock = Math.abs(swipe.dx) > Math.abs(swipe.dy) * 1.3 ? 1 : -1;
      if (swipe.lock === 1 && swipe.viewEl) swipe.viewEl.classList.add('swiping');
    }
    if (swipe.lock === 1 && swipe.viewEl) {
      if (e.cancelable) e.preventDefault();
      swipe.viewEl.style.transform = `translate3d(${(swipe.dx * 0.42).toFixed(1)}px, 0, 0)`;
    }
  }, { passive: false });

  const finish = () => {
    const s = swipe;
    swipe = null;
    if (!s || s.lock !== 1 || !s.viewEl) return;
    const idx = VIEW_ORDER.indexOf(currentView);
    const far = Math.abs(s.dx) > Math.min(88, window.innerWidth * 0.22)
      || (Math.abs(s.dx) > 42 && Date.now() - s.at < 260);
    const to = s.dx < 0 ? idx + 1 : idx - 1;
    s.viewEl.classList.remove('swiping');
    if (far && to >= 0 && to < VIEW_ORDER.length) {
      s.viewEl.style.transform = '';
      /* 滑动结束后别把这次手势当成点击（避免误触卡片按钮） */
      suppressTap = true;
      setTimeout(() => { suppressTap = false; }, 360);
      switchView(VIEW_ORDER[to], { dir: s.dx < 0 ? 1 : -1 });
    } else {
      s.viewEl.classList.add('swipe-return');
      requestAnimationFrame(() => { s.viewEl.style.transform = ''; });
      setTimeout(() => s.viewEl.classList.remove('swipe-return'), 260);
    }
  };
  el.addEventListener('touchend', finish, { passive: true });
  el.addEventListener('touchcancel', finish, { passive: true });
}

/* 手势后的那一次 click 直接掐掉 */
document.addEventListener('click', e => {
  if (!suppressTap) return;
  suppressTap = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* 环形占比图：items = [{ label, value, color, valueText }] */
function donutChart(items, opts) {
  const o = opts || {};
  const list = (items || []).filter(i => (Number(i.value) || 0) > 0);
  const total = list.reduce((a, i) => a + (Number(i.value) || 0), 0);
  const R = 52, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = list.map(it => {
    const len = total ? (Number(it.value) || 0) / total * C : 0;
    const seg = len > 0.5 ? `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${it.color}"
      stroke-width="17" stroke-dasharray="${Math.max(len - 2.4, 0.5)} ${C}"
      stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"></circle>` : '';
    acc += len;
    return seg;
  }).join('');
  const center = total
    ? `<text x="60" y="57" text-anchor="middle" class="dn-v">${esc(o.center != null ? o.center : total)}</text>
       <text x="60" y="72" text-anchor="middle" class="dn-l">${esc(o.centerLabel || '合计')}</text>`
    : `<text x="60" y="60" text-anchor="middle" class="dn-l">暂无数据</text>`;
  const rows = list.map(it => {
    const pct = total ? Math.round((Number(it.value) || 0) / total * 1000) / 10 : 0;
    return `<li><i style="background:${it.color}"></i><span class="dn-name">${esc(it.label)}</span>
      <span class="dn-pct">${pct}%</span>
      ${it.valueText ? `<span class="dn-val">${esc(it.valueText)}</span>` : ''}</li>`;
  }).join('');
  return `<div class="donut-wrap">
    <div class="donut-figure"><svg viewBox="0 0 120 120" class="donut" role="img">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="17" opacity=".55"></circle>
      ${segs}${center}</svg></div>
    ${rows ? `<ul class="donut-legend">${rows}</ul>` : `<div class="small muted">这个时间段还没有记录。</div>`}
  </div>`;
}

  const weekDone = habits.reduce((a, h) => a + habitWeekCount(h.id, 0), 0);
  const weekTotal = habits.length * 7;

  const todayHabits = habits.length ? habits.map(h => {
    const on = habitDone(h.id, tKey);
    const st = habitStreak(h.id);
    const wk = habitWeekCount(h.id, 0);
    return `<button class="habit-line" data-action="toggle-habit" data-id="${h.id}" data-date="${tKey}">
      <span class="check ${on ? 'on' : ''}">${on ? '✓' : ''}</span>
      <span class="ico-badge sm">${habitIconSVG(h)}</span>
      <span class="name">${esc(h.name)}</span>
      <span class="streak">${st > 0 ? `<i class="ico-inline">${ICON_FLAME}</i>${st} 天 · ` : ''}本周 ${wk}/7</span>
    </button>`;
  }).join('') : `<div class="empty"><div class="big">🌱</div>还没有习惯，先创建一个吧。<div style="margin-top:10px"><button class="btn primary" data-action="add-habit">+ 新建习惯</button></div></div>`;

  /* 目标卡：同一个列表，按数量 / 拆小目标两种进度都在这张卡里看 */
  const goalMinis = activeGoals.length ? activeGoals.slice(0, 4).map(g => {
    const p = goalPct(g);
    const dl = goalDeadline(g);
    const st = goalSubStats(g);
    const sub = st.total ? `小目标 ${st.done}/${st.total}` : '还没拆小目标';
    return `<div class="goal-mini">
      <div class="row"><strong>${esc(g.title)}</strong><span>${p}%</span></div>
      <div class="progress slim"><i style="width:${p}%"></i></div>
      <div class="row"><span>${sub}</span><span>${dl.text}</span></div>
    </div>`;
  }).join('') : `<div class="empty"><div class="big">🎯</div>${state.goals.length ? '目标都完成了，开一个新的吧。' : '还没有目标。'}<div style="margin-top:10px"><button class="btn primary" data-action="add-goal">+ 新建目标</button></div></div>`;

  const recent = [...state.journal].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 3);
  const recentHTML = recent.length ? recent.map(j => {
    const snippet = j.good || j.improve || j.tomorrow || '（没有填写内容）';
    return `<div class="goal-mini">
      <div class="row"><strong>${MOOD[j.mood] || '🙂'} ${fmtDate(j.date)}</strong><span>精力 ${j.energy}/5</span></div>
      <div class="small muted" style="margin-top:4px">${esc(truncate(snippet, 52))}</div>
    </div>`;
  }).join('') : `<div class="empty"><div class="big">✍️</div>还没有日记。今天写一篇吧。<div style="margin-top:10px"><button class="btn primary" data-action="nav" data-view="journal" data-open-journal="1">去写日记</button></div></div>`;

  $('#view-dashboard').innerHTML = `
    ${state.seeded ? `<div class="demo-banner card"><span>👋 已为你准备了一份示例数据，方便快速了解功能。可以直接修改，或在「设置」中清空后从零开始。</span><button class="btn" data-action="dismiss-demo">知道了</button></div>` : ''}
    <div class="stats">
      ${stats.map(s => s.dual ? `<div class="stat dual">
        <div class="stat-top"><span>${s.label}</span><span class="stat-ico">${ICON_TARGET}</span></div>
        <div class="dual-row">
          ${s.cells.map(c => `<button type="button" class="dual-cell" data-action="open-stat" data-stat="${c.stat}" title="查看${c.label}分析">
            <strong>${c.value}<i>${c.unit}</i></strong>
            <span>${c.label}</span>
          </button>`).join('')}
        </div>
        ${s.hint ? `<div class="hint">${s.hint}</div>` : ''}
      </div>` : `<button type="button" class="stat" data-action="open-stat" data-stat="${s.key}" title="查看${s.label}分析">
        <div class="stat-top"><span>${s.label}</span><span class="stat-ico">${s.icon}<b>›</b></span></div>
        <strong>${s.value}</strong>
        <div class="hint">${s.hint}</div>
      </button>`).join('')}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>今日习惯 <span class="small muted">${done}/${habits.length} · ${pct}%</span></h3><button class="link-btn" data-action="nav" data-view="habits">管理 →</button></div>
        ${todayHabits}
      </div>
      <div class="card">
        <div class="card-head"><h3>目标 <span class="small muted">进行中 ${activeGoals.length}</span></h3><button class="link-btn" data-action="nav" data-view="goals">查看全部 →</button></div>
        ${goalMinis}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>最近日记</h3><button class="link-btn" data-action="nav" data-view="journal">全部 →</button></div>
      ${recentHTML}
    </div>`;
}

/* ==================== 数据详情页（饼图） ==================== */
function detailStreak() {
  const keys = Array.from({ length: 30 }, (_, i) => toKey(addDays(new Date(), -i)));
  const items = state.habits.map((h, i) => {
    const n = keys.filter(k => habitDone(h.id, k)).length;
    return { label: h.name, value: n, color: FIN_COLORS[i % FIN_COLORS.length], valueText: `${n} 次` };
  });
  const total = items.reduce((a, i) => a + i.value, 0);
  const weekDone = state.habits.reduce((a, h) => a + habitWeekCount(h.id, 0), 0);
  const longest = [...state.habits].sort((a, b) => habitStreak(b.id) - habitStreak(a.id))[0];
  return {
    title: '连续成长',
    sub: '用最近 30 天的打卡构成，看清坚持从哪里来。',
    value: `${globalStreak()} 天`, valueLabel: '当前连续成长',
    note: state.habits.length ? `共 ${state.habits.length} 个习惯，本周已打卡 ${weekDone} 次。` : '还没有习惯，先建一个吧。',
    chartTitle: '近 30 天打卡构成', chartHint: '按习惯统计次数',
    donut: total ? donutChart(items, { center: `${total}`, centerLabel: '次打卡' }) : '',
    donutEmpty: '最近 30 天还没有打卡记录，今天开始也不晚。',
    facts: [
      ['当前连续', `${globalStreak()} 天`],
      ['本周打卡', `${weekDone} / ${state.habits.length * 7} 次`],
      ['近 30 天打卡', `${total} 次`],
      ['连续最长', longest ? `${esc(longest.name)} · ${habitStreak(longest.id)} 天` : '—']
    ],
    goView: 'habits', goText: '去习惯页打卡'
  };
}

function detailGoals() {
  const all = state.goals;
  const active = all.filter(g => !g.done);
  const finished = all.filter(g => g.done);
  const avg = active.length ? Math.round(active.reduce((a, g) => a + goalPct(g), 0) / active.length) : 0;
  const counts = {};
  all.forEach(g => { const k = g.category || '其他'; counts[k] = (counts[k] || 0) + 1; });
  const items = Object.entries(counts).map(([name, n], i) => ({
    label: name, value: n, color: FIN_COLORS[i % FIN_COLORS.length], valueText: `${n} 个`
  })).sort((a, b) => b.value - a.value);
  const subDone = all.reduce((a, g) => a + goalSubStats(g).done, 0);
  const subTotal = all.reduce((a, g) => a + goalSubStats(g).total, 0);
  const rows = active.slice(0, 6).map(g => {
    const p = goalPct(g);
    const st = goalSubStats(g);
    return `<div class="goal-mini">
      <div class="row"><strong>${esc(g.title)}</strong><span>${p}%</span></div>
      <div class="progress slim"><i style="width:${p}%"></i></div>
      <div class="row"><span>${st.total ? `小目标 ${st.done}/${st.total}` : `${fmtNum(g.current)} / ${fmtNum(g.target)} ${esc(g.unit || '')}`}</span><span>${esc(g.category || '其他')}</span></div>
    </div>`;
  }).join('');
  return {
    title: '目标进度',
    sub: '按分类看目标分布，确认精力放在了正确的地方。',
    value: `${avg}%`, valueLabel: '进行中目标平均进度',
    note: `进行中 ${active.length} 个 · 已完成 ${finished.length} 个。`,
    chartTitle: '目标分类分布', chartHint: '按目标数量',
    donut: all.length ? donutChart(items, { center: `${all.length}`, centerLabel: '个目标' }) : '',
    donutEmpty: '还没有目标，先写下一个想做成的事。',
    facts: [
      ['进行中', `${active.length} 个`],
      ['已完成', `${finished.length} 个`],
      ['小目标完成', `${subDone} / ${subTotal} 个`],
      ['平均进度', `${avg}%`]
    ],
    extra: active.length ? `<div class="card"><div class="card-head"><h3>进行中的目标</h3><span class="small muted">最多显示 6 个</span></div>${rows}</div>` : '',
    goView: 'goals', goText: '去目标页管理'
  };
}

function detailJournal() {
  const entries = state.journal;
  const moodName = { 5: '很棒', 4: '不错', 3: '一般', 2: '低落', 1: '糟糕' };
  const colors = { 5: '#2e7d5b', 4: '#84cc16', 3: '#d97706', 2: '#0ea5e9', 1: '#6b7280' };
  const items = [5, 4, 3, 2, 1].map(v => ({
    label: `${MOOD[v]} ${moodName[v]}`,
    value: entries.filter(j => Number(j.mood) === v).length,
    color: colors[v],
    valueText: `${entries.filter(j => Number(j.mood) === v).length} 篇`
  })).filter(i => i.value > 0);
  const monthPrefix = todayKey().slice(0, 7);
  const monthCount = entries.filter(j => String(j.date).slice(0, 7) === monthPrefix).length;
  const avgEnergy = entries.length ? (entries.reduce((a, j) => a + (Number(j.energy) || 3), 0) / entries.length).toFixed(1) : '—';
  const tagMap = {};
  entries.forEach(j => String(j.tags || '').split(/[,，、\s]+/).filter(Boolean).forEach(t => { tagMap[t] = (tagMap[t] || 0) + 1; }));
  const topTags = Object.entries(tagMap).sort((a, b) => b[1] - a[1]).slice(0, 3).map(t => `#${t[0]}`).join(' ');
  const recent = [...entries].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 3);
  const rows = recent.map(j => `<div class="goal-mini">
      <div class="row"><strong>${MOOD[j.mood] || '🙂'} ${fmtDate(j.date)}</strong><span>精力 ${j.energy}/5</span></div>
      <div class="small muted" style="margin-top:4px">${esc(truncate(j.good || j.improve || j.tomorrow || '（没有填写内容）', 46))}</div>
    </div>`).join('');
  return {
    title: '日记与心情',
    sub: '心情分布能帮你看清这段时间的状态起伏。',
    value: `${entries.length} 篇`, valueLabel: '累计记录',
    note: `本月写了 ${monthCount} 篇，平均精力 ${avgEnergy} / 5。`,
    chartTitle: '心情分布', chartHint: '按记录篇数',
    donut: entries.length ? donutChart(items, { center: `${entries.length}`, centerLabel: '篇日记' }) : '',
    donutEmpty: '还没有日记，写下第一句就算开始。',
    facts: [
      ['累计篇数', `${entries.length} 篇`],
      ['本月篇数', `${monthCount} 篇`],
      ['平均精力', `${avgEnergy} / 5`],
      ['常见标签', topTags || '—']
    ],
    extra: recent.length ? `<div class="card"><div class="card-head"><h3>最近记录</h3><span class="small muted">最近 3 篇</span></div>${rows}</div>` : '',
    goView: 'journal', goText: '去写日记'
  };
}

function detailFinance() {
  const month = todayKey().slice(0, 7);
  const sum = financeSummary(month);
  const budget = Number(state.finance.budget) || 0;
  const usedPct = budget ? Math.round(sum.expense / budget * 1000) / 10 : 0;
  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const items = Object.entries(catMap).sort((a, b) => b[1] - a[1]).map(([name, amount]) => ({
    label: name,
    value: amount,
    color: finCatColor('expense', name),
    valueText: fmtMoney(amount)
  }));
  return {
    title: '本月结余',
    sub: '收入减去支出，钱花在了哪里一目了然。',
    value: fmtMoney(sum.balance), valueLabel: '本月结余',
    note: `收 ${fmtMoney(sum.income)} · 支 ${fmtMoney(sum.expense)}`,
    chartTitle: '本月支出构成', chartHint: '按分类占比',
    donut: sum.expense ? donutChart(items, { center: fmtMoneyCompact(sum.expense), centerLabel: '本月支出' }) : '',
    donutEmpty: '这个月还没有支出记录。',
    facts: [
      ['本月收入', fmtMoney(sum.income)],
      ['本月支出', fmtMoney(sum.expense)],
      ['本月结余', fmtMoney(sum.balance)],
      ['记账笔数', `${sum.list.length} 笔`],
      ['预算使用', budget ? `${usedPct}%` : '未设置']
    ],
    goView: 'finance', goText: '去记账页'
  };
}

const catOrder = name => {
  const i = CATS.findIndex(c => c[0] === name);
  return i < 0 ? 99 : i;
};

function goalSubStats(g) {
  const list = g.subtasks || [];
  const done = list.filter(t => t.done).length;
  return { total: list.length, done, left: list.length - done };
}

  { key: 'leaf', label: '成长', svg: ICON_LEAF },

  { key: 'activity', label: '运动', svg: ICON_ACTIVITY },

  { key: 'moon', label: '睡眠', svg: ICON_MOON },
  { key: 'note', label: '写作', svg: ICON_NOTE },
  { key: 'code', label: '代码', svg: ICON_CODE },
  { key: 'sun', label: '早起', svg: ICON_SUN }
];
const HABIT_EMOJI_MAP = {
  '📖': 'book', '📚': 'book', '📕': 'book', '🏃': 'activity', '🏃‍♂️': 'activity', '💪': 'activity',
  '💧': 'water', '🥤': 'water', '🌙': 'moon', '😴': 'moon', '🧘': 'moon', '✍️': 'note', '📝': 'note',
  '💻': 'code', '👨‍💻': 'code', '🌞': 'sun', '☀️': 'sun', '🌅': 'sun', '🌱': 'leaf', '✅': 'leaf', '🔥': 'leaf'
};
function habitIconKey(h) {
  if (h && h.icon && HABIT_ICONS.some(i => i.key === h.icon)) return h.icon;
  return (h && HABIT_EMOJI_MAP[h.emoji]) || 'leaf';
}
function habitIconSVG(h) {
  const it = HABIT_ICONS.find(i => i.key === habitIconKey(h)) || HABIT_ICONS[0];
  return it.svg;
}

/** 小目标折叠状态：默认展开；用户手动收起后记住该目标的选择 */
function subOpenOf(g) {
  const m = (state.settings.subOpen && typeof state.settings.subOpen === 'object' && !Array.isArray(state.settings.subOpen))
    ? state.settings.subOpen : {};
  if (Object.prototype.hasOwnProperty.call(m, g.id)) return !!m[g.id];
  return !g.done;
}

/** 目标卡：只有一套结构，进度区按 track 换文案
    - 按数量：进度条 + 12/24 本 + 「更新进度」入口
    - 拆小目标：进度条 + 3/5 + 小目标清单 */
function goalCardHTML(g, collapsible) {
  const p = goalPct(g);
  const dl = goalDeadline(g);
  const st = goalSubStats(g);
  const open = g.done ? true : subOpenOf(g);
  const foldAction = g.done ? 'toggle-done-one' : 'toggle-subfold';
  const foldTitle = g.done ? '收起这条已完成目标' : (open ? '收起小目标' : '展开小目标');
  const subs = (g.subtasks || []).map(t => `
      <li class="sub-item${t.done ? ' done' : ''}">
        ${g.done
      ? `<span class="sub-check${t.done ? ' on' : ''}">${t.done ? '✓' : ''}</span>`
      : `<button class="sub-check${t.done ? ' on' : ''}" data-action="toggle-sub" data-id="${g.id}" data-sub="${t.id}" title="${t.done ? '标记为未完成' : '标记完成'}">${t.done ? '✓' : ''}</button>`}
        ${g.done
      ? `<span class="sub-title">${esc(t.title)}</span>`
      : `<button type="button" class="sub-title sub-title-btn" data-action="edit-sub" data-id="${g.id}" data-sub="${t.id}" title="点一下改文字">${esc(t.title)}</button>`}
        ${g.done ? '' : `<button class="sub-del" data-action="del-sub" data-id="${g.id}" data-sub="${t.id}" title="删除小目标">✕</button>`}
      </li>`).join('');

  /* 小目标没勾完就不让直接结束这个目标 */
  const blocked = !g.done && st.left > 0;
  const dueText = g.done
    ? (g.doneAt ? `完成于 ${fmtDate(toKey(new Date(g.doneAt)))}` : '已完成')
    : dl.text;
  const dueCls = g.done ? 'is-done-due' : (dl.cls || '');

  const countText = st.total ? `${st.done}/${st.total} 步` : '';
  const checkTitle = g.done ? '恢复为进行中' : blocked ? `还有 ${st.left} 个小目标没完成` : '标记为已完成';

  return `<article class="goal-card card${g.done ? ' is-done' : ''}" data-id="${g.id}">
      <div class="goal-top">
        <button class="goal-check${g.done ? ' on' : ''}${blocked ? ' locked' : ''}" data-action="toggle-goal" data-id="${g.id}" title="${checkTitle}">${blocked ? '!' : '✓'}</button>
        <span class="chip cat-${catClass(g.category)}">${esc(g.category || '其他')}</span>
        <div class="goal-acts">
          <button class="icon-btn" data-action="edit-goal" data-id="${g.id}" title="编辑" aria-label="编辑">${ICON_PENCIL}</button>
          <button class="icon-btn danger" data-action="del-goal" data-id="${g.id}" title="删除" aria-label="删除">${ICON_TRASH}</button>
          <button class="collapse-btn pm${open ? ' minus' : ''}" data-action="${foldAction}" data-id="${g.id}" title="${foldTitle}" aria-label="${foldTitle}">${pmIcon()}</button>
        </div>
      </div>
      <div class="goal-line">
        <h3 class="goal-title">${esc(g.title)}</h3>
        <span class="goal-due ${dueCls}">${dueText}</span>
      </div>
      <div class="goal-prog">
        <div class="progress"><i style="width:${p}%"></i></div>
        ${countText ? `<span class="cnt">${countText}</span>` : ''}
      </div>
      ${(st.total || !g.done) ? `<div class="sub-wrap"${open ? '' : ' hidden'}>
        ${st.total ? `<ul class="sub-list">${subs}</ul>` : `<div class="sub-empty">把它拆小一点，更容易开始</div>`}
        ${blocked ? `<div class="sub-note">还有 ${st.left} 个小目标没完成，全部勾完才能结束这个目标</div>` : ''}
        ${g.done ? '' : `<form class="sub-add" data-form="sub" data-id="${g.id}"><input name="title" maxlength="80" placeholder="+ 添加小目标，回车保存" autocomplete="off"></form>`}
      </div>` : ''}
    </article>`;
}

/** 已完成目标的展开状态：{ goalId: true } */
function ensureDoneOpenMap() {
  const s = state.settings = state.settings || {};
  if (!s.doneOpen || typeof s.doneOpen !== 'object' || Array.isArray(s.doneOpen)) s.doneOpen = {};
  return s.doneOpen;
}

function renderGoals() {
  const all = state.goals;
  const active = all.filter(g => !g.done).sort((a, b) => {
    const da = a.deadline || '9999-12-31';
    const db = b.deadline || '9999-12-31';
    return String(da).localeCompare(String(db)) || (a.createdAt || 0) - (b.createdAt || 0);
  });
  const finished = all.filter(g => g.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  const counts = {};
  all.forEach(g => { const k = g.category || '其他'; counts[k] = (counts[k] || 0) + 1; });
  const cats = CATS.map(c => c[0]).filter(name => counts[name] > 0);
  const filterOk = f => f === 'all' || cats.includes(f);
  if (!filterOk(goalFilter)) goalFilter = 'all';

  const match = g => goalFilter === 'all' || (g.category || '其他') === goalFilter;
  const activeShown = active.filter(match);
  const doneShown = finished.filter(match);

  const groupHTML = (list, emptyText) => {
    if (!list.length) return `<div class="card" style="background:transparent;border-style:dashed"><div class="empty">${emptyText}</div></div>`;
    const order = [...new Set(list.map(g => g.category || '其他'))]
      .sort((a, b) => catOrder(a) - catOrder(b) || String(a).localeCompare(String(b)));
    return order.map(cat => {
      const items = list.filter(g => (g.category || '其他') === cat);
      return `<div class="goal-group">
        <div class="group-head">${esc(cat)}<span class="cnt">${items.length}</span></div>
        <div class="goal-grid">${items.map(goalCardHTML).join('')}</div>
      </div>`;
    }).join('');
  };

  /* 顶部只留一个入口：目标就是目标，不再分「目标」和「学习」两条路 */
  const head = `
    <div class="page-actions">
      <h2>进行中 ${active.length} 个${finished.length ? ` · 已完成 ${finished.length} 个` : ''}</h2>
      <div class="chips">
        <button class="btn primary" data-action="add-goal">+ 目标</button>
      </div>
    </div>
    ${all.length ? `<div class="goal-filters">
      <button class="filter-chip${goalFilter === 'all' ? ' on' : ''}" data-action="goal-filter" data-cat="all">全部 ${all.length}</button>
      ${cats.map(n => `<button class="filter-chip${goalFilter === n ? ' on' : ''}" data-action="goal-filter" data-cat="${esc(n)}">${esc(n)} ${counts[n]}</button>`).join('')}
    </div>` : ''}`;

  const doneMap = (state.settings.doneOpen && typeof state.settings.doneOpen === 'object') ? state.settings.doneOpen : {};
  const anyDoneClosed = doneShown.some(g => !doneMap[g.id]);
  const doneSection = doneShown.length
    ? `<div class="done-list">${doneShown.map(g => doneMap[g.id]
      ? goalCardHTML(g, true)
      : `<button class="done-strip" data-action="toggle-done-one" data-id="${g.id}" aria-expanded="false" title="展开这条已完成目标">
           <span class="ds-tick">✓</span>
           <span class="ds-titles">${esc(g.title)}</span>
           <span class="collapse-btn pm" aria-hidden="true">${pmIcon()}</span>
         </button>`).join('')}</div>`
    : groupHTML(doneShown, '完成的目标会保留在这里，一条一个，随时可以展开回顾。');

  /* 已归档：收起来的旧目标，不占当前列表，随时能恢复 */
  const archived = (Array.isArray(state.archivedGoals) ? state.archivedGoals : [])
    .slice().sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
  const archOpen = !!state.settings.archOpen;
  const archSection = archived.length ? `
    <section class="goal-section">
      <div class="section-head"><h3>已归档</h3><span class="cnt">${archived.length}</span>
        <div class="head-tools">
          <button class="link-btn" data-action="arch-clear">清空</button>
          <button class="collapse-btn pm${archOpen ? ' minus' : ''}" data-action="toggle-arch" title="${archOpen ? '收起已归档' : '展开已归档'}" aria-label="${archOpen ? '收起已归档' : '展开已归档'}">${pmIcon()}</button>
        </div>
      </div>
      <div class="arch-list"${archOpen ? '' : ' hidden'}>
        ${archived.map(g => `<div class="arch-row">
          <div class="ar-main">
            <span class="ar-title">${esc(g.title)}</span>
            <span class="ar-meta">${esc([g.category || '其他',
              g.doneAt ? `完成于 ${fmtDate(toKey(new Date(g.doneAt)))}` : '',
              g.archivedAt ? `归档于 ${fmtDate(toKey(new Date(g.archivedAt)))}` : ''
            ].filter(Boolean).join(' · '))}</span>
          </div>
          <button class="link-btn" data-action="arch-restore" data-id="${g.id}">恢复</button>
          <button class="ar-del" data-action="arch-del" data-id="${g.id}" title="彻底删除" aria-label="彻底删除">✕</button>
        </div>`).join('')}
      </div>
    </section>` : '';

  const mainSections = all.length ? `
    <section class="goal-section">
      <div class="section-head"><h3>进行中</h3><span class="cnt">${activeShown.length}</span></div>
      ${groupHTML(activeShown, goalFilter === 'all' ? '还没有进行中的目标，点右上角新建一个。' : `「${esc(goalFilter)}」分类下没有进行中的目标。`)}
    </section>
    <section class="goal-section">
      <div class="section-head"><h3>已完成</h3><span class="cnt">${doneShown.length}</span>
        ${doneShown.length ? `<div class="head-tools">
          <button class="link-btn" data-action="open-goal-batch">批量整理</button>
          <button class="collapse-btn pm${anyDoneClosed ? '' : ' minus'}" data-action="toggle-done-goals" title="${anyDoneClosed ? '展开全部已完成目标' : '收起全部已完成目标'}" aria-label="${anyDoneClosed ? '展开全部' : '收起全部'}">${pmIcon()}</button>
        </div>` : ''}
      </div>
      ${doneSection}
    </section>` : '';

  $('#view-goals').innerHTML = `${head}
    ${mainSections || `<div class="card"><div class="empty"><div class="big">🎯</div>还没有目标。把想做成的事写下来，再拆成几个小步骤。<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-action="add-goal">+ 新建第一个目标</button></div></div></div>`}
    ${archSection}`;
}

/* ==================== 习惯页 ==================== */
function renderHabits() {
  const days = habitWeekDays(habitWeekOffset);
  const tKey = todayKey();
  const items = state.habits.map(h => {
    const total = habitLogs(h.id).length;
    const st = habitStreak(h.id);
    const wk = habitWeekDays(habitWeekOffset).filter(d => habitDone(h.id, toKey(d))).length;
    const dayBtns = days.map(d => {
      const key = toKey(d);
      const on = habitDone(h.id, key);
      const future = key > tKey;
      return `<button class="day${on ? ' on' : ''}${key === tKey ? ' today' : ''}${future ? ' future' : ''}"${future ? ' disabled' : ''} data-action="toggle-habit" data-id="${h.id}" data-date="${key}" title="${fmtDate(key)}${future ? ' · 还没到' : ''}">
        <span>${WEEK[d.getDay()]}</span><b>${on ? '✓' : ''}</b>
      </button>`;
    }).join('');
    return `<div class="habit-item">
      <div class="habit-info">
        <span class="ico-badge">${habitIconSVG(h)}</span>
        <div><strong>${esc(h.name)}</strong><div class="meta"><i class="ico-inline">${ICON_FLAME}</i>连续 ${st} 天 · ${habitWeekOffset === 0 ? '本周' : '该周'} ${wk}/7 · 累计 ${total} 次</div></div>
      </div>
      <div class="week">${dayBtns}</div>
      <button class="icon-btn danger" data-action="del-habit" data-id="${h.id}" title="删除习惯">${ICON_TRASH}</button>
    </div>`;
  }).join('');
  const weekTotal = state.habits.reduce((a, h) => a + habitWeekDays(habitWeekOffset).filter(d => habitDone(h.id, toKey(d))).length, 0);

  $('#view-habits').innerHTML = `
    <div class="page-actions">
      <div class="week-nav">
        <button class="nav-btn" data-action="habit-week" data-dir="-1" title="上一周">‹</button>
        <strong>${weekTitle(habitWeekOffset)}</strong>
        <button class="nav-btn" data-action="habit-week" data-dir="1" title="下一周"${habitWeekOffset >= 0 ? ' disabled' : ''}>›</button>
        ${habitWeekOffset !== 0 ? `<button class="link-btn" data-action="habit-week" data-dir="0">回到本周</button>` : ''}
      </div>
      <button class="btn primary" data-action="add-habit">+ 新建习惯</button>
    </div>
    ${state.habits.length ? `<div class="card" style="padding-top:9px;padding-bottom:9px">
      <div class="card-head"><h3>${habitWeekOffset === 0 ? '本周打卡' : weekTitle(habitWeekOffset) + ' 打卡'}</h3><span class="small muted">${weekTotal} / ${state.habits.length * 7} 次</span></div>
      ${items}</div>` : `<div class="card"><div class="empty"><div class="big">🔥</div>习惯是复利的起点。先选一个每天 5 分钟就能完成的小习惯。<div style="margin-top:12px"><button class="btn primary" data-action="add-habit">+ 新建第一个习惯</button></div></div></div>`}
    <div class="card">
      <div class="card-head"><h3>小提示</h3><span class="small muted">让习惯更容易坚持</span></div>
      <div class="small muted" style="line-height:2">
        · 每周一自动开启新的一周，七个格子会重新变空，上一周的记录仍保留在每条习惯的「累计」里。<br>
        · 把新习惯绑在已有习惯后面：比如「刷完牙后，做 1 分钟冥想」。<br>
        · 从最小版本开始，先做到「每天出现」，再谈强度。<br>
        · 偶尔断一天没关系，重要的是第二天继续。
      </div>
    </div>`;
}

}

function journalEntryHTML(j) {

  return `<article class="journal-entry card">

        <div class="chips">

/** 折叠状态：未记录过时用 def */
function foldOpen(key, def) {
  const f = state.settings.journalFold;
  if (f && Object.prototype.hasOwnProperty.call(f, key)) return !!f[key];
  return !!def;
}

/** 大卡片折叠：状态存在 settings.cardFold，默认展开 */
function cardOpen(key, def) {
  const f = state.settings.cardFold;
  if (f && Object.prototype.hasOwnProperty.call(f, key)) return !!f[key];
  return def !== false;
}

/** 统一的大卡片：标题 + 右侧附加操作 + 折叠箭头，收起时只留标题一行 */
function foldCard(key, titleHTML, bodyHTML, opts) {
  const o = opts || {};
  const open = cardOpen(key, o.defaultOpen !== false);
  const extra = o.extra || '';
  /* 用 div 而不是 section：避免打乱目标页里 .goal-section:nth-of-type 的计数 */
  return `<div class="card fold-card${open ? '' : ' is-closed'}"${o.id ? ` id="${o.id}"` : ''}>
    <div class="card-head"${open ? '' : ' style="margin-bottom:0"'}>
      <h3>${titleHTML}</h3>
      <div class="chips">${extra}
        <button type="button" class="collapse-btn pm${open ? ' minus' : ''}" data-action="fold-card" data-key="${esc(key)}" aria-expanded="${open}" aria-label="${open ? '收起' : '展开'}" title="${open ? '收起' : '展开'}">${pmIcon()}</button>
      </div>
    </div>
    ${open ? `<div class="card-body">${bodyHTML}</div>` : ''}
  </div>`;
}

/* ==================== 倒数日 ==================== */
/** 自然日差：目标日 − 今天。按本地零点算，绕开时分和夏令时的误差 */
function cdDiff(dateStr) {
  const d = parseKey(dateStr);
  if (isNaN(d.getTime())) return null;
  const t = new Date();
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())
    - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}

function cdDateText(dateStr) {
  const d = parseKey(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WEEK[d.getDay()]}`;
}

function countdownItemHTML(c, idx, total) {
  const diff = cdDiff(c.date);
  const past = diff != null && diff < 0;
  const today = diff === 0;
  const n = diff == null ? 0 : Math.abs(diff);
  /* 位数多的天数缩小字号，三位数不至于撑破 56px 的天数区 */
  const numCls = String(n).length >= 4 ? ' sm' : (String(n).length === 3 ? ' md' : '');
  const days = today
    ? `<div class="cd-days"><span class="cd-cap">就是</span><span class="cd-num md">今天</span></div>`
    : `<div class="cd-days"><span class="cd-cap">${past ? '已过' : '还有'}</span><span class="cd-num${numCls}">${n}</span><span class="cd-unit">天</span></div>`;
  /* 整张卡片点开编辑；右侧四个按钮各自优先响应 */
  return `<article class="cd-item${today ? ' is-today' : ''}${past ? ' is-past' : ''}" data-action="edit-countdown" data-id="${c.id}">
    ${days}
    <div class="cd-main">
      <div class="cd-title" title="${esc(c.title)}">${esc(c.title)}</div>
      <div class="cd-meta">${cdDateText(c.date)}</div>
      ${c.note ? `<div class="cd-note" title="${esc(c.note)}">${esc(c.note)}</div>` : ''}
    </div>
    <div class="cd-ops">
      <button type="button" data-action="move-countdown" data-id="${c.id}" data-dir="-1" title="上移" aria-label="上移"${idx === 0 ? ' disabled' : ''}>${ICON_UP}</button>
      <button type="button" data-action="move-countdown" data-id="${c.id}" data-dir="1" title="下移" aria-label="下移"${idx === total - 1 ? ' disabled' : ''}>${ICON_DOWN}</button>
      <button type="button" data-action="edit-countdown" data-id="${c.id}" title="编辑" aria-label="编辑">${ICON_PENCIL}</button>
      <button type="button" class="danger" data-action="del-countdown" data-id="${c.id}" title="删除" aria-label="删除">${ICON_TRASH}</button>
    </div>
  </article>`;
}

function countdownCardHTML() {
  const list = state.countdowns || [];
  const body = list.length
    ? `<div class="cd-list">${list.map((c, i) => countdownItemHTML(c, i, list.length)).join('')}</div>`
    : `<div class="empty"><div class="big">📅</div>还没有倒数日。写下一个值得期待的日子，抬眼就知道还剩几天。</div>
       <div class="cd-empty-add"><button type="button" class="btn ghost" data-action="add-countdown">+ 添加倒数日</button></div>`;
  return foldCard('journal:countdown',
    `倒数日${list.length ? ` <span class="small muted">${list.length}</span>` : ''}`,
    body,
    { extra: `<button type="button" class="link-btn" data-action="add-countdown">+ 添加</button>` });
}

function openCountdownForm(id) {
  const c = id ? (state.countdowns || []).find(x => x.id === id) : null;
  openModal(`<div class="modal-head"><h3>${c ? '编辑倒数日' : '添加倒数日'}</h3><button type="button" class="close" data-action="close-modal" aria-label="关闭">✕</button></div>
    <form data-form="countdown" data-id="${c ? c.id : ''}">
      <label>记什么<input name="title" maxlength="40" required autocomplete="off" placeholder="如：妈妈生日、项目上线" value="${c ? esc(c.title) : ''}"></label>
      <label>哪一天<input type="date" name="date" required value="${c ? esc(c.date) : todayKey()}"></label>
      <label>备注<input name="note" maxlength="80" autocomplete="off" placeholder="选填，一句话提醒" value="${c ? esc(c.note) : ''}"></label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-action="close-modal">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>

function renderJournal() {
  const editing = editingJournal ? state.journal.find(j => j.id === editingJournal) : null;
  const entries = [...state.journal].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0));
  const editMonth = editing ? String(editing.date).slice(0, 7) : '';

  // 按年 → 月 分组
  const yearMap = new Map();
  entries.forEach(j => {
    const y = String(j.date || '').slice(0, 4) || '未知';
    const m = String(j.date || '').slice(0, 7) || y;
    if (!yearMap.has(y)) yearMap.set(y, new Map());
    const mm = yearMap.get(y);
    if (!mm.has(m)) mm.set(m, []);
    mm.get(m).push(j);
  });

  let yIdx = 0;
  const groupsHTML = [...yearMap.entries()].map(([year, months]) => {
    const yearCount = [...months.values()].reduce((a, l) => a + l.length, 0);
    const yearKey = 'y:' + year;
    const forcedByEdit = editMonth.slice(0, 4) === year;
    const yearOpen = foldOpen(yearKey, yIdx === 0) || forcedByEdit;

    let mIdx = 0;
    const monthsHTML = [...months.entries()].map(([mKey, list]) => {
      const monthKey = 'm:' + mKey;
      const monthOpen = foldOpen(monthKey, yIdx === 0 && mIdx === 0) || editMonth === mKey;
      mIdx++;
      const label = mKey.includes('-') ? `${Number(mKey.slice(5, 7))} 月` : '未标注月份';
      return `<div class="fold-block">
        <button class="fold-head${monthOpen ? ' open' : ''}" data-action="fold-journal" data-key="${monthKey}" data-open="${monthOpen ? 1 : 0}" aria-expanded="${monthOpen}">
          <span class="collapse-btn pm fold-pm${monthOpen ? ' minus' : ''}" aria-hidden="true">${pmIcon()}</span><span class="fname">${label}</span>
          <span class="fcount">${list.length} 篇</span>
        </button>
        ${monthOpen ? `<div class="fold-body">${list.map(journalEntryHTML).join('')}</div>` : ''}
      </div>`;
    }).join('');

    yIdx++;
    return `<div class="fold-block">
      <button class="fold-head${yearOpen ? ' open' : ''}" data-action="fold-journal" data-key="${yearKey}" data-open="${yearOpen ? 1 : 0}" aria-expanded="${yearOpen}">
        <span class="collapse-btn pm fold-pm${yearOpen ? ' minus' : ''}" aria-hidden="true">${pmIcon()}</span><span class="fname">${esc(year)} 年</span>
        <span class="ftag">${months.size} 个月</span>
        <span class="fcount">${yearCount} 篇</span>
      </button>
      ${yearOpen ? `<div class="fold-sub">${monthsHTML}</div>` : ''}
    </div>`;
  }).join('');

  /* 全部展开之后要能一键收回：按当前是否已全展开，按钮在「全部展开 / 全部收起」之间切换 */
  const foldMap = (state.settings.journalFold && typeof state.settings.journalFold === 'object') ? state.settings.journalFold : {};
  const allExpanded = entries.length > 0 && [...yearMap.entries()].every(([year, months]) =>
    foldMap['y:' + year] === true && [...months.keys()].every(m => foldMap['m:' + m] === true));

  $('#view-journal').innerHTML = `
    ${countdownCardHTML()}
    ${journalFormHTML(editing, !!editing)}
    ${entries.length ? `<div class="card">
      <div class="card-head"><h3>日记归档 <span class="small muted">共 ${entries.length} 篇</span></h3>
        <button class="link-btn" data-action="fold-journal-all" data-open="${allExpanded ? 0 : 1}">${allExpanded ? '全部收起' : '全部展开'}</button>
      </div>
      ${groupsHTML}
    </div>` : `<div class="card"><div class="empty"><div class="big">✍️</div>还没有日记。每天 2 分钟，写下三件小事就够了。</div></div>`}`;
}

function financeHeader(navHTML) {
  return `<div class="page-actions fin-head">
    <div class="seg">
      <button type="button" data-action="fin-mode" data-mode="month" class="${financeMode === 'month' ? 'active' : ''}">月度</button>
      <button type="button" data-action="fin-mode" data-mode="year" class="${financeMode === 'year' ? 'active' : ''}">年度</button>

/* 日期用原生 <input type="date">：点一下就是系统日历，选年月日一步到位。
   系统自带的小图标被 CSS 藏了（各版本长得不一样），这里自己贴一个日历图标当提示 */
function dateFieldHTML(value) {
  const v = /^\d{4}-\d{2}-\d{2}$/.test(String(value || '')) ? String(value) : todayKey();
  return `<span class="date-field"><input type="date" name="date" value="${v}" required><span class="df-ico">${ICON_CALENDAR}</span></span>`;
}
/** 记过的备注攒起来，下次点一下就能选，不用重复敲 */
function rememberFinNote(note) {
  const v = String(note || '').trim().slice(0, 40);
  if (!v) return;
  const st = state.settings = state.settings || {};
  const list = Array.isArray(st.finNotes) ? st.finNotes : [];
  st.finNotes = [v, ...list.filter(x => x !== v)].slice(0, 12);
}
function noteChipsHTML(current) {
  const st = state.settings || {};
  const list = Array.isArray(st.finNotes) ? st.finNotes : [];
  if (!list.length) return '';
  return `<div class="note-chips">
    <span class="nc-label">常用</span>
    ${list.map(n => `<button type="button" class="nc-chip${n === current ? ' on' : ''}" data-action="pick-note" data-note="${esc(n)}">${esc(n)}</button>`).join('')}
  </div>`;
}

/* ==================== 记账页 ==================== */
function renderFinance() {
  if (financeMode === 'year') { renderFinanceYear(); return; }
  const month = financeMonth;
  const sum = financeSummary(month);
  const budget = Number(state.finance.budget) || 0;
  const remaining = budget - sum.expense;
  const usedPct = budget ? Math.round(sum.expense / budget * 1000) / 10 : 0;
  const over = budget > 0 && sum.expense > budget;
  const incomeCount = sum.list.filter(t => t.type === 'income').length;
  const expenseCount = sum.list.length - incomeCount;

  const summary = [
    { label: '本月收入', value: fmtMoney(sum.income), icon: ICON_TREND_UP, hint: `${incomeCount} 笔` },
    { label: '本月支出', value: fmtMoney(sum.expense), icon: ICON_TREND_DOWN, hint: `${expenseCount} 笔` },
    { label: '本月结余', value: fmtMoney(sum.balance), icon: ICON_WALLET, hint: sum.balance >= 0 ? '保持正结余' : '支出超过收入' },
    { label: '预算剩余', value: budget ? fmtMoney(remaining) : '未设置', icon: ICON_TARGET, hint: budget ? (over ? `已超支 ${fmtMoney(-remaining)}` : `预算 ${fmtMoneyShort(budget)} · 已用 ${usedPct}%`) : '点击设置月度预算', action: 'edit-budget' }
  ];

  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const nowDate = new Date();
  const daysInMonth = month === todayKey().slice(0, 7)
    ? nowDate.getDate()
    : new Date(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0).getDate();
  const dailyAvg = daysInMonth ? sum.expense / daysInMonth : 0;
  const catHTML = cats.length ? cats.map(([name, amount]) => {
    const c = finCat('expense', name);
    const w = maxCat ? Math.max(3, amount / maxCat * 100) : 0;
    const share = sum.expense ? Math.round(amount / sum.expense * 1000) / 10 : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span class="cat-name">${c.svg}${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('expense', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这个月还没有支出记录。</div>`;
  const catItems = cats.map(([name, amount]) => ({
    label: name,
    value: amount,
    color: finCatColor('expense', name),
    valueText: fmtMoney(amount)
  }));
  /* 手机上默认收起记录表单，先把当月账单露出来；宽屏默认展开 */
  const quickPref = state.settings.finQuickCollapsed;
  const quickOpen = typeof quickPref === 'boolean' ? !quickPref : window.innerWidth > 620;

  const filtered = sum.list
    .filter(t => financeFilter === 'all' || t.type === financeFilter)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0));
  const rows = filtered.map(t => {
    const c = finCat(t.type, t.category);
    return `<div class="tx-row">
      <div class="tx-icon">${c.svg}</div>
      <div class="tx-main">
        <div class="tx-title">${esc(t.category)}<span class="chip ${t.type}">${t.type === 'income' ? '收入' : '支出'}</span></div>
        <div class="tx-sub">${fmtDateShort(t.date)}${t.note ? ' · ' + esc(t.note) : ''}</div>
      </div>
      <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '−'}${fmtMoney(t.amount)}</div>
      <div class="chips">
        <button class="icon-btn" data-action="edit-tx" data-id="${t.id}" title="编辑" aria-label="编辑">${ICON_PENCIL}</button>
        <button class="icon-btn danger" data-action="del-tx" data-id="${t.id}" title="删除" aria-label="删除">${ICON_TRASH}</button>
      </div>
    </div>`;
  }).join('');

  const defaultDate = month === todayKey().slice(0, 7) ? todayKey() : `${month}-01`;
  const emptyText = financeFilter === 'all' ? '这个月还没有记录。' : financeFilter === 'income' ? '这个月还没有收入记录。' : '这个月还没有支出记录。';
  const navHTML = `<div class="month-nav">
      <button class="nav-btn" data-action="fin-prev" title="上个月">‹</button>
      <button class="nav-month" data-action="fin-pick-month" title="选择月份" aria-haspopup="dialog">
        <span>${monthLabel(month)}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 9.4 12 15.2l5.8-5.8"/></svg>
      </button>
      <button class="nav-btn" data-action="fin-next" title="下个月">›</button>
      ${month !== todayKey().slice(0, 7) ? `<button class="link-btn" data-action="fin-now">回到本月</button>` : ''}
    </div>`;

  /* 快捷记一笔：表单可收起，收起时只留标题一行 */
  const quickCard = `<form class="card" data-form="tx" id="txForm">
      <div class="card-head"${quickOpen ? '' : ' style="margin-bottom:0"'}>
        <h3>快速记一笔</h3>
        <div class="chips">
          <span class="small muted">${monthLabel(month)}</span>
          <button type="button" class="collapse-btn pm${quickOpen ? ' minus' : ''}" data-action="toggle-quick" title="${quickOpen ? '收起记录表单' : '展开记录表单'}" aria-label="${quickOpen ? '收起记录表单' : '展开记录表单'}">${pmIcon()}</button>
        </div>
      </div>
      <div class="quick-body"${quickOpen ? '' : ' hidden'}>
        <div class="form-row">
          <label>类型<select name="type" data-fin-type>
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select></label>
          <label>金额（元）<input class="amount-input" type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required></label>
        </div>
        <label>日期${dateFieldHTML(defaultDate)}</label>
        <div class="form-row">
          <label>分类<select name="category">${categoryOptions('expense')}</select></label>
          <label>备注<input name="note" maxlength="40" placeholder="选填，比如：加油"></label>
        </div>
        ${noteChipsHTML('')}
        <div class="form-actions"><button class="btn primary" type="submit">保存这笔</button></div>
      </div>
    </form>`;

  const filterSelect = `<select class="mini-select" data-fin-filter>
          <option value="all"${financeFilter === 'all' ? ' selected' : ''}>全部</option>
          <option value="expense"${financeFilter === 'expense' ? ' selected' : ''}>支出</option>
          <option value="income"${financeFilter === 'income' ? ' selected' : ''}>收入</option>
        </select>`;

  /* 流水 + 支出分类合在一张卡里，用内部分段切换：默认看流水，要看构成再切分类 */
  const finTabNow = finTab === 'cat' ? 'cat' : 'tx';
  const tabsHTML = `<div class="seg fin-tabs">
        <button type="button" data-action="fin-tab" data-tab="tx" class="${finTabNow === 'tx' ? 'active' : ''}">流水</button>
        <button type="button" data-action="fin-tab" data-tab="cat" class="${finTabNow === 'cat' ? 'active' : ''}">支出分类</button>
      </div>`;

  const catBody = `
      ${cats.length ? `<div style="margin-bottom:14px">${donutChart(catItems, { center: fmtMoneyCompact(sum.expense), centerLabel: '本月支出' })}</div>` : ''}
      ${budget ? `<div class="cat-row">
        <div class="cat-top"><span>本月预算 ${fmtMoney(budget)}</span><span class="${over ? 'text-danger' : 'muted'}">${over ? '已超支 ' + fmtMoney(-remaining) : '已用 ' + usedPct + '%'}</span></div>
        <div class="progress"><i style="width:${clamp(usedPct, 0, 100)}%${over ? ';background:var(--danger)' : ''}"></i></div>
      </div>` : `<div class="small muted" style="margin-bottom:10px">还没有设置预算，设置后可以查看本月使用进度。</div>`}
      ${catHTML}`;

  const txPanel = `<div class="fin-panel" data-panel="tx"${finTabNow === 'tx' ? '' : ' hidden'}>
      <div class="fin-panel-bar">
        <span class="small muted">${monthLabel(month)} · 共 ${filtered.length} 笔</span>
        ${filterSelect}
      </div>
      ${rows || `<div class="empty">${emptyText}</div>`}
    </div>`;

  const catPanel = `<div class="fin-panel" data-panel="cat"${finTabNow === 'cat' ? '' : ' hidden'}>
      <div class="fin-panel-bar">
        <span class="small muted">${cats.length ? `${cats.length} 个分类 · 日均 ${fmtMoney(dailyAvg)}` : '本月还没有支出'}</span>
        <button class="link-btn" data-action="edit-budget">${budget ? '调整预算' : '设置预算'} →</button>
      </div>
      ${catBody}
    </div>`;

  $('#view-finance').innerHTML = `
    ${financeHeader(navHTML)}
    <div class="fin-stats">
      ${summary.map(s => `<div class="stat${s.action ? ' clickable' : ''}"${s.action ? ` data-action="${s.action}"` : ''}>
        <div class="stat-top"><span>${s.label}</span><span>${s.icon}</span></div>
        <strong class="money" style="font-size:19px">${s.value}</strong>

function renderFinanceYear() {
  const year = financeYear;
  const sum = financeYearSummary(year);
  const incomeCount = sum.list.filter(t => t.type === 'income').length;
  const expenseCount = sum.list.length - incomeCount;
  const activeMonths = sum.months.filter(m => m.income || m.expense).length;
  const avgMonthly = activeMonths ? sum.expense / activeMonths : 0;
  const savings = sum.income ? Math.round(sum.balance / sum.income * 100) : null;
  const isNowYear = year === Number(todayKey().slice(0, 4));

  const summary = [
    { label: '全年收入', value: fmtMoney(sum.income), icon: ICON_TREND_UP, hint: `${incomeCount} 笔` },
    { label: '全年支出', value: fmtMoney(sum.expense), icon: ICON_TREND_DOWN, hint: `${expenseCount} 笔` },
    { label: '全年结余', value: fmtMoney(sum.balance), icon: ICON_WALLET, hint: savings === null ? '还没有收入记录' : `储蓄率 ${savings}%` },
    { label: '月均支出', value: activeMonths ? fmtMoney(avgMonthly) : '—', icon: ICON_CALENDAR, hint: activeMonths ? `按 ${activeMonths} 个有记录月份` : '还没有记录' }
  ];

  /* 这一年钱花在哪：按分类占比画环形图，跟月度那张「本月支出构成」同一个组件 */
  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const catItems = cats.map(([name, amount]) => ({
    label: name,
    value: amount,
    color: finCatColor('expense', name),
    valueText: fmtMoney(amount)
  }));
  const chartHTML = cats.length
    ? `<div class="year-donut">${donutChart(catItems, {
        center: fmtMoneyCompact(sum.expense),
        centerLabel: '全年支出'
      })}</div>`
    : `<div class="empty">这一年还没有支出记录，先记几笔吧。</div>`;

  const incMap = {};
  sum.list.filter(t => t.type === 'income').forEach(t => {
    incMap[t.category] = (incMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const incCats = Object.entries(incMap).sort((a, b) => b[1] - a[1]);
  const maxInc = incCats.length ? incCats[0][1] : 0;
  const incHTML = incCats.length ? incCats.map(([name, amount]) => {
    const c = finCat('income', name);
    const w = maxInc ? Math.max(3, amount / maxInc * 100) : 0;
    const share = sum.income ? Math.round(amount / sum.income * 100) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span class="cat-name">${c.svg}${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('income', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这一年还没有收入记录。</div>`;

  const topMonth = sum.months.reduce((a, m) => (m.expense > (a ? a.expense : 0) ? m : a), null);
  const topCat = cats[0];
  const maxMonthExpense = Math.max(1, ...sum.months.map(m => m.expense));
  const monthRows = sum.months.map(m => {
    const key = `${year}-${pad2(m.month)}`;
    const balance = m.income - m.expense;
    const zero = !m.income && !m.expense;
    const w = Math.round(m.expense / maxMonthExpense * 100);
    return `<tr class="${zero ? 'zero' : ''}" data-action="fin-open-month" data-month="${key}" title="查看 ${m.month} 月明细">
      <td class="m-name">${m.month}月</td>
      <td>${m.income ? fmtMoney(m.income) : '—'}</td>
      <td>${m.expense ? fmtMoney(m.expense) : '—'}</td>
      <td class="${balance < 0 ? 'text-danger' : ''}">${zero ? '—' : fmtMoney(balance)}</td>
      <td class="m-bar"><i style="width:${w}%"></i></td>
    </tr>`;
  }).join('');

  const navHTML = `<div class="month-nav">
      <button class="nav-btn" data-action="fin-year-prev" title="上一年">‹</button>
      <strong>${year}年</strong>
      <button class="nav-btn" data-action="fin-year-next" title="下一年">›</button>
      ${isNowYear ? '' : `<button class="link-btn" data-action="fin-year-now">回到今年</button>`}
    </div>`;

  $('#view-finance').innerHTML = `
    ${financeHeader(navHTML)}
    <div class="fin-stats">
      ${summary.map(s => `<div class="stat">
        <div class="stat-top"><span>${s.label}</span><span>${s.icon}</span></div>
        <strong class="money" style="font-size:19px">${s.value}</strong>
        <div class="hint">${s.hint}</div>
      </div>`).join('')}
    </div>
    <div class="year-top">
      ${foldCard('fin:ychart', '支出构成', chartHTML, { extra: `<span class="small muted">${year} 年 · 按分类占比</span>` })}
      ${foldCard('fin:yinc', '收入分类', `${incHTML}
        <div class="fin-facts">
          <div class="fin-fact"><span>记账笔数</span><strong>${sum.list.length} 笔</strong></div>
          <div class="fin-fact"><span>月均支出</span><strong>${activeMonths ? fmtMoney(avgMonthly) : '—'}</strong></div>
          <div class="fin-fact"><span>支出最多</span><strong>${topMonth ? `${topMonth.month}月 · ${fmtMoney(topMonth.expense)}` : '暂无'}</strong></div>
          <div class="fin-fact"><span>最大分类</span><strong>${topCat ? `${finCat('expense', topCat[0]).svg}${esc(topCat[0])} ${fmtMoney(topCat[1])}` : '暂无'}</strong></div>
        </div>`, { extra: '<span class="small muted">全年占比</span>' })}
    </div>
    <div class="year-bottom single">
      <div class="card">
        <div class="card-head"><h3>月度明细</h3><span class="small muted">点击任意月份查看明细</span></div>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>月份</th><th>收入</th><th>支出</th><th>结余</th><th class="m-bar">支出趋势</th></tr></thead>
            <tbody>
              ${monthRows}
              <tr class="total">
                <td>全年合计</td>
                <td>${fmtMoney(sum.income)}</td>
                <td>${fmtMoney(sum.expense)}</td>
                <td class="${sum.balance < 0 ? 'text-danger' : ''}">${fmtMoney(sum.balance)}</td>
                <td class="m-bar"></td>
              </tr>
            </tbody>
          </table>
        </div>

}

/* ==================== 自绘下拉（替代原生 select） ==================== */
const ICON_CHEV_DOWN = '<svg class="cs-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 9.4 12 15.2l5.8-5.8"/></svg>';
const ICON_TICK = '<svg class="cs-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.6 9.6 17 19 6.8"/></svg>';

/** 把页面里所有原生 select 包一层：select 本体隐藏但仍参与表单提交，界面上用主题化按钮 */
function enhanceSelects(root) {
  (root || document).querySelectorAll('select:not([data-cs])').forEach(sel => {
    sel.setAttribute('data-cs', '1');
    const wrap = document.createElement('div');
    wrap.className = 'cselect' + (sel.classList.contains('mini-select') ? ' inline' : '');
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    sel.classList.add('cselect-native');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cselect-btn';
    btn.dataset.action = 'open-cselect';
    btn.setAttribute('aria-haspopup', 'listbox');
    wrap.appendChild(btn);
    syncCselect(sel);
    sel.addEventListener('change', () => syncCselect(sel));
    /* 点 label 文字时默认会激活 select 弹系统列表，这里拦住，改成开我们的面板 */
    const lab = sel.closest('label');
    if (lab) {
      lab.addEventListener('click', ev => {
        if (ev.target.closest('.cselect')) return;
        ev.preventDefault();
        openCselect(btn);
      });
    }
  });
}

function syncCselect(sel) {
  const wrap = sel.closest('.cselect');
  if (!wrap) return;
  const btn = wrap.querySelector('.cselect-btn');
  const opt = sel.options[sel.selectedIndex];
  btn.innerHTML = `<span class="cs-label">${esc(opt ? opt.textContent.trim() : '')}</span>${ICON_CHEV_DOWN}`;
  btn.disabled = !!sel.disabled;
}

let csTarget = null;

function cselectTitle(sel) {
  const label = sel.closest('label');
  if (!label) return '';
  const t = [...label.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
  return t ? t.textContent.trim().replace(/[（(].*?[)）]$/, '') : '';
}

function openCselect(btn) {
  const sel = btn.closest('.cselect') && btn.closest('.cselect').querySelector('select');
  if (!sel) return;
  closeCselect();
  csTarget = sel;
  const pop = document.createElement('div');
  pop.className = 'cs-pop';
  pop.id = 'cselectPop';
  pop.innerHTML = `<div class="cs-mask" data-action="close-cselect"></div>
    <div class="cs-sheet" role="listbox" aria-label="选择">
      ${cselectTitle(sel) ? `<div class="cs-title">${esc(cselectTitle(sel))}</div>` : ''}
      ${[...sel.options].map((o, i) => `<button type="button" class="cs-opt${i === sel.selectedIndex ? ' on' : ''}" role="option" aria-selected="${i === sel.selectedIndex}" data-action="pick-cselect" data-idx="${i}">
        <span class="cs-opt-label">${esc(o.textContent.trim())}</span>${i === sel.selectedIndex ? ICON_TICK : ''}
      </button>`).join('')}
    </div>`;
  document.body.appendChild(pop);
  requestAnimationFrame(() => pop.classList.add('show'));
  const on = pop.querySelector('.cs-opt.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function closeCselect() {
  const pop = document.getElementById('cselectPop');
  if (!pop) return;
  pop.classList.remove('show');
  setTimeout(() => pop.remove(), 180);
  csTarget = null;
}

/* 应用内确认框：不依赖 window.confirm，手机 WebView 与预览容器里都能正常弹出 */
const confirmEl = $('#confirm');
let confirmCallback = null;

function askConfirm(opts, onOk) {
  const o = typeof opts === 'string' ? { message: opts } : (opts || {});
  const ok = $('#confirmOk');
  $('#confirmIcon').textContent = o.icon || '⚠️';
  $('#confirmTitle').textContent = o.title || '请确认';
  $('#confirmMsg').textContent = o.message || '';
  $('#confirmCancel').textContent = o.cancelText || '取消';
  ok.textContent = o.okText || '确定';
  ok.className = 'btn ' + (o.accent ? 'primary' : 'solid-danger');
  confirmCallback = typeof onOk === 'function' ? onOk : null;
  confirmEl.classList.remove('hidden');
}

function closeConfirm(ok) {
  const cb = confirmCallback;
  confirmCallback = null;
  confirmEl.classList.add('hidden');
  if (ok && cb) cb();
}

confirmEl.addEventListener('click', e => { if (e.target === confirmEl) closeConfirm(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !confirmEl.classList.contains('hidden')) closeConfirm(false);
});

/** 截止的显示文案 */
function deadlineText(dateStr, timeStr) {
  if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return '不设截止';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '不设截止';
  const base = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 周${WEEK[d.getDay()]}`;
  return timeStr ? `${base} · ${timeStr}` : base;
}

/** 小目标就地改名：点文字变成输入框，回车或失焦保存，Esc 放弃 */
function startSubEdit(btn) {
  const li = btn.closest('.sub-item');
  if (!li || li.querySelector('.sub-edit')) return;
  const g = state.goals.find(x => x.id === btn.dataset.id);
  const t = g && (g.subtasks || []).find(x => x.id === btn.dataset.sub);
  if (!t) return;
  btn.hidden = true;
  const inp = document.createElement('input');
  inp.className = 'sub-edit';
  inp.maxLength = 80;
  inp.value = t.title;
  inp.setAttribute('aria-label', '修改小目标');
  btn.parentNode.insertBefore(inp, btn.nextSibling);
  inp.focus();
  inp.select();
  let finished = false;
  const finish = save => {
    if (finished) return;
    finished = true;
    const v = inp.value.trim();
    if (save && v && v !== t.title) {
      t.title = v.slice(0, 80);
      saveState();
      render();
    } else {
      inp.remove();
      btn.hidden = false;
    }
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}

function gbSyncUI() {
  const box = $('#modalBox');
  if (!box) return;
  box.querySelectorAll('[data-gb-id]').forEach(el => {
    const on = gbSel.has(el.dataset.gbId);
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
    const ck = el.querySelector('.gb-check');
    if (ck) {
      ck.classList.toggle('on', on);
      ck.innerHTML = on ? ICON_TICK : '';
    }
  });
  const n = gbSel.size;
  const arc = box.querySelector('[data-gb="archive"]');
  const del = box.querySelector('[data-gb="delete"]');
  if (arc) { arc.disabled = !n; arc.textContent = n ? `归档 ${n} 个` : '归档选中'; }
  if (del) { del.disabled = !n; del.textContent = n ? `删除 ${n} 个` : '删除选中'; }
  const note = box.querySelector('.gb-note');
  if (note) note.textContent = `已选 ${n} / ${gbTotal} 个`;
  const all = box.querySelector('[data-action="gb-all"]');
  if (all) all.textContent = (gbTotal && n === gbTotal) ? '取消全选' : '全选';
}

function archList() {
  if (!Array.isArray(state.archivedGoals)) state.archivedGoals = [];
  return state.archivedGoals;
}

/** 把已完成目标挪进归档：数据保留，只是不在当前列表里 */
function archiveGoals(ids) {
  const set = new Set(ids);
  const moved = state.goals.filter(g => set.has(g.id));
  if (!moved.length) return;
  const map = ensureDoneOpenMap();
  const now = Date.now();
  moved.forEach(g => {
    g.archivedAt = now;
    delete map[g.id];
  });
  state.goals = state.goals.filter(g => !set.has(g.id));
  archList().push(...moved);
  closeModal();
  saveState();
  render();
  toast(`已归档 ${moved.length} 个，可在「已归档」里恢复`);
}

/** 从归档里恢复成已完成状态 */
function restoreArchivedGoal(id) {
  const list = archList();
  const g = list.find(x => x.id === id);
  if (!g) return;
  state.archivedGoals = list.filter(x => x.id !== id);
  g.archivedAt = 0;
  state.goals.push(g);
  ensureDoneOpenMap()[g.id] = false;
  saveState();
  render();
  toast('已恢复到「已完成」');
}
