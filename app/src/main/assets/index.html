function openDeadlinePicker(curDate, curTime, onDone) {
  const host = ensurePickerHost();
  const pad = n => String(n).padStart(2, '0');
  const QUICK_TIMES = ['09:00', '14:00', '18:00'];
  let selDate = /^\d{4}-\d{2}-\d{2}$/.test(curDate || '') ? curDate : '';
  let selTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(curTime || '') ? curTime : '';
  let customMode = !!selTime && !QUICK_TIMES.includes(selTime);
  const start0 = selDate ? new Date(selDate + 'T00:00:00') : new Date();
  let cursor = new Date(start0.getFullYear(), start0.getMonth(), 1);

  const draw = () => {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const firstDow = new Date(y, m, 1).getDay();
    const start = new Date(y, m, 1 - firstDow);
    const tk = todayKey();
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const cls = [d.getMonth() === m ? '' : 'mute', k === tk ? 'today' : '', k === selDate ? 'on' : ''].filter(Boolean).join(' ');
      cells.push(`<button type="button" class="cal-day ${cls}" data-d="${k}">${d.getDate()}</button>`);
    }
    const ch = selTime ? clamp(Number(selTime.slice(0, 2)), 0, 23) : 9;
    const cm = selTime ? clamp(Number(selTime.slice(3)), 0, 59) : 0;
    const quick = QUICK_TIMES.map(t => `<button type="button" class="chip-btn${selTime === t && !customMode ? ' on' : ''}" data-t="${t}">${t}</button>`).join('');
    host.innerHTML = `
      <div class="picker" style="max-height:88vh;overflow:auto">
        <div class="picker-head">
          <h4>设定截止</h4>
          <div class="picker-nav">
            <button type="button" data-nav="-1" aria-label="上个月">‹</button>
            <span class="mon">${y} 年 ${m + 1} 月</span>
            <button type="button" data-nav="1" aria-label="下个月">›</button>
          </div>
        </div>
        <div class="cal-grid">
          ${['日', '一', '二', '三', '四', '五', '六'].map(w => `<span class="wd">${w}</span>`).join('')}
          ${cells.join('')}
        </div>
        <div class="picker-sep"></div>
        <div class="picker-row">
          <span class="lbl">时间</span>
          <button type="button" class="chip-btn${selTime ? '' : ' on'}" data-timeclear="1">不设时间</button>
          <button type="button" class="chip-btn" data-now="1">此刻</button>
        </div>
        <div class="time-quick">${quick}<button type="button" class="chip-btn${customMode ? ' on' : ''}" data-custom="1">自定义</button></div>
        ${customMode ? `<div class="time-custom">
          <input type="number" class="time-num" id="pickerHour" min="0" max="23" inputmode="numeric" value="${pad(ch)}" aria-label="小时">
          <span class="time-colon">:</span>
          <input type="number" class="time-num" id="pickerMin" min="0" max="59" inputmode="numeric" value="${pad(cm)}" aria-label="分钟">
          <span class="time-hint">24 小时制 · 手填任意时间</span>
        </div>` : ''}
        <div class="picker-foot">
          <button type="button" class="link-btn" data-clear="1">清除截止</button>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn ghost" data-cancel="1">取消</button>
            <button type="button" class="btn primary" data-ok="1">确定</button>
          </div>
        </div>
      </div>`;
  };

  host.onclick = e => {
    const b = e.target.closest('button');
    if (!b) { if (e.target === host) closePicker(); return; }
    if (b.dataset.nav) {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + Number(b.dataset.nav), 1);
      draw(); return;
    }
    if (b.dataset.d) { selDate = b.dataset.d; draw(); return; }
    if (b.dataset.t) { selTime = b.dataset.t; customMode = false; draw(); return; }
    if (b.dataset.custom) {
      customMode = true;
      if (!selTime) selTime = '09:00';
      draw();
      setTimeout(() => {
        const i = document.getElementById('pickerHour');
        if (i) { i.focus(); i.select(); }
      }, 30);
      return;
    }
    if (b.dataset.timeclear) { selTime = ''; customMode = false; draw(); return; }
    if (b.dataset.now) {
      const n = new Date();
      selDate = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
      cursor = new Date(n.getFullYear(), n.getMonth(), 1);
      selTime = pad(n.getHours()) + ':' + pad(n.getMinutes());
      customMode = !QUICK_TIMES.includes(selTime);
      draw(); return;
    }
    if (b.dataset.clear) { closePicker(); onDone('', ''); return; }
    if (b.dataset.cancel === '1') { closePicker(); return; }
    if (b.dataset.ok) {
      if (!selDate && selTime) { toast('先选个日期，时间才有意义'); return; }
      closePicker();
      onDone(selDate, selTime);
    }
  };

  // 自定义时间：边输边写进状态，不重绘以免丢焦点
  host.oninput = e => {
    const t = e.target;
    if (!t || !t.classList || !t.classList.contains('time-num')) return;
    const hEl = document.getElementById('pickerHour');
    const mEl = document.getElementById('pickerMin');
    const h = clamp(Number(hEl && hEl.value) || 0, 0, 23);
    const mi = clamp(Number(mEl && mEl.value) || 0, 0, 59);
    selTime = pad(h) + ':' + pad(mi);
  };
  // 失焦时把输入归一到合法范围（不重绘，避免点击「确定」被吞）
  host.addEventListener('focusout', e => {
    const t = e.target;
    if (!t || !t.classList || !t.classList.contains('time-num')) return;
    const hEl = document.getElementById('pickerHour');
    const mEl = document.getElementById('pickerMin');
    const h = clamp(Number(hEl && hEl.value) || 0, 0, 23);
    const mi = clamp(Number(mEl && mEl.value) || 0, 0, 59);
    if (hEl) hEl.value = pad(h);
    if (mEl) mEl.value = pad(mi);
    selTime = pad(h) + ':' + pad(mi);
  }, true);

  draw();
  host.classList.remove('hidden');
}

/** 选月份：12 个格子，顺手把当月结余写在下面，跳月之前心里先有个数 */
function openMonthPicker(curMonth, onDone) {
  const host = ensurePickerHost();
  const cur = /^\d{4}-\d{2}$/.test(String(curMonth || '')) ? String(curMonth) : todayKey().slice(0, 7);
  let year = Number(cur.slice(0, 4));
  const nowKey = todayKey().slice(0, 7);

  const stat = {};
  (state.finance.transactions || []).forEach(t => {
    const k = String(t.date).slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(k)) return;
    const s = stat[k] || (stat[k] = { n: 0, balance: 0 });
    s.n++;
    s.balance += (t.type === 'income' ? 1 : -1) * (Number(t.amount) || 0);
  });

  const draw = () => {
    const cells = Array.from({ length: 12 }, (_, i) => {
      const m = i + 1;
      const key = `${year}-${pad2(m)}`;
      const s = stat[key];
      const on = key === cur;
      const cls = ['mon-cell', s ? 'has' : '', key === nowKey ? 'now' : '', on ? 'on' : ''].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-m="${key}" aria-label="${year} 年 ${m} 月">
        <b>${m} 月</b><span>${s ? fmtMoneyCompact(s.balance) : '—'}</span>
      </button>`;
    }).join('');
    host.innerHTML = `
      <div class="picker">
        <div class="picker-head">
          <h4>选择月份</h4>
          <div class="picker-nav">
            <button type="button" data-y="-1" aria-label="上一年">‹</button>
            <span class="mon">${year} 年</span>
            <button type="button" data-y="1" aria-label="下一年">›</button>
          </div>
        </div>
        <div class="mon-grid">${cells}</div>
        <div class="picker-foot">
          <button type="button" class="link-btn" data-now="1">回到本月</button>
          <button type="button" class="btn ghost" data-cancel="1">取消</button>
        </div>
      </div>`;
  };

  host.onclick = e => {
    const b = e.target.closest('button');
    if (!b) { if (e.target === host) closePicker(); return; }
    if (b.dataset.y) { year += Number(b.dataset.y); draw(); return; }
    if (b.dataset.m) { closePicker(); onDone(b.dataset.m); return; }
    if (b.dataset.now) { closePicker(); onDone(nowKey); return; }
    if (b.dataset.cancel === '1') { closePicker(); }
  };

  draw();
  host.classList.remove('hidden');
}

/* ==================== 表单提交 ==================== */
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const kind = form.dataset.form;

  if (kind === 'goal') {
    const title = String(fd.get('title') || '').trim();
    if (!title) { toast('请填写目标名称'); return; }
    const id = form.dataset.id;
    const old = id ? state.goals.find(x => x.id === id) : null;
    // 小目标：按行填写，保留同名项原有的完成状态
    const lines = String(fd.get('subtasks') || '').split('\n')
      .map(s => s.replace(/^[\s·•\-\d.、]+/, '').trim()).filter(Boolean).slice(0, 30);
    const prevSubs = old && Array.isArray(old.subtasks) ? old.subtasks : [];
    const subtasks = lines.map(line => {
      const hit = prevSubs.find(t => t.title === line);
      return hit ? { id: hit.id, title: hit.title, done: !!hit.done, doneAt: hit.doneAt || null }
        : { id: uid(), title: line, done: false, doneAt: null };
    });
    const dueTimeRaw = String(fd.get('dueTime') || '');
    /* 2.2：一个目标只有两种推进方式，进度字段跟着方式走，切换时按新方式重来 */
    const track = 'sub';
    const data = {
      title,
      category: String(fd.get('category') || '其他'),
      deadline: String(fd.get('deadline') || ''),
      dueTime: /^([01]\d|2[0-3]):[0-5]\d$/.test(dueTimeRaw) ? dueTimeRaw : '',
      subtasks,
      track,
      current: 0,
      target: 1,
      unit: '',
      note: old ? (old.note || '') : '',
      updatedAt: 0
    };
    if (old) {
      Object.assign(old, data);
      toast('目标已更新');
    } else {
      state.goals.push(Object.assign({ id: uid(), createdAt: Date.now(), done: false, doneAt: null }, data));
      toast('目标已创建');
    }
    closeModal();
    saveState();
    render();
    return;
  }

  if (kind === 'sub') {
    const gid = form.dataset.id;
    const g = state.goals.find(x => x.id === gid);
    const title = String(fd.get('title') || '').trim();
    if (!g || !title) return;
    g.subtasks = Array.isArray(g.subtasks) ? g.subtasks : [];
    if (!g.subtasks.some(t => t.title === title)) {
      g.subtasks.push({ id: uid(), title, done: false, doneAt: null });
      saveState();
      render();
      toast('已添加小目标');
    }
    const input = $(`.sub-add[data-id="${gid}"] input`);
    if (input) { input.value = ''; input.focus(); }
    return;
  }

  if (kind === 'habit') {
    const name = String(fd.get('name') || '').trim();
    if (!name) { toast('请填写习惯名称'); return; }
    const id = uid();
    const icon = String(fd.get('icon') || 'leaf');
    state.habits.push({ id, name, icon: HABIT_ICONS.some(i => i.key === icon) ? icon : 'leaf', emoji: '', createdAt: Date.now() });
    state.habitLogs[id] = [];
    closeModal();
    saveState();
    render();
    toast('习惯已创建，今天就开始吧');
    return;
  }

  if (kind === 'journal') {
    const data = {
      date: String(fd.get('date') || '').trim() || todayKey(),
      mood: clamp(fd.get('mood'), 1, 5),
      energy: clamp(fd.get('energy'), 1, 5),
      good: String(fd.get('good') || '').trim(),
      improve: String(fd.get('improve') || '').trim(),
      tomorrow: String(fd.get('tomorrow') || '').trim(),
      tags: String(fd.get('tags') || '').trim()
    };
    if (!data.good && !data.improve && !data.tomorrow) { toast('写点内容再保存吧'); return; }
    if (editingJournal) {
      const j = state.journal.find(x => x.id === editingJournal);
      if (j) Object.assign(j, data, { updatedAt: Date.now() });
      editingJournal = null;
      toast('日记已更新');
    } else {
      const same = state.journal.find(j => j.date === data.date);
      if (same) {
        Object.assign(same, data, { updatedAt: Date.now() });
        toast('已更新当天日记');
      } else {
        state.journal.push(Object.assign({ id: uid(), createdAt: Date.now(), updatedAt: Date.now() }, data));
        toast('日记已保存');
      }
    }
    /* 存完就把写作区收起来，把刚写的那篇露出来；下次要写再点箭头自己展开 */
    state.settings.journalCollapsed = true;
    saveState();
    render();
    return;
  }

  if (kind === 'countdown') {
    const title = String(fd.get('title') || '').trim();
    const date = String(fd.get('date') || '').trim();
    const note = String(fd.get('note') || '').trim();
    if (!title) { toast('给这个日子起个名字'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(parseKey(date).getTime())) { toast('选一个有效日期'); return; }
    state.countdowns = state.countdowns || [];
    const id = form.dataset.id;
    const old = id ? state.countdowns.find(x => x.id === id) : null;
    if (old) {
      Object.assign(old, { title, date, note, updatedAt: Date.now() });
      toast('倒数日已更新');
    } else {
      state.countdowns.push({ id: uid(), title, date, note, createdAt: Date.now(), updatedAt: Date.now() });
      toast('已添加倒数日');
    }
    closeModal();
    saveState();
    render();
    return;
  }

  if (kind === 'tx') {
    const amount = Math.round((Number(fd.get('amount')) || 0) * 100) / 100;
    if (!(amount > 0)) { toast('请输入正确的金额'); return; }
    const dateStr = String(fd.get('date') || '').trim() || todayKey();
    const data = {
      type: String(fd.get('type') || 'expense') === 'income' ? 'income' : 'expense',
      amount,
      date: dateStr,
      category: String(fd.get('category') || '').trim() || '其他',
      note: String(fd.get('note') || '').trim()
    };
    const id = form.dataset.id;
    /* 从「快速记一笔」保存完就收起表单，把流水露出来；顺手记住这条备注 */
    const fromQuick = !form.closest('.modal');
    rememberFinNote(data.note);
    if (fromQuick) {
      state.settings = state.settings || {};
      state.settings.finQuickCollapsed = true;
    }
    if (id) {
      const t = state.finance.transactions.find(x => x.id === id);
      if (t) Object.assign(t, data, { updatedAt: Date.now() });
      toast('记录已更新');
    } else {
      state.finance.transactions.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
      toast(data.type === 'income' ? '收入已记录' : '支出已记录');
    }
    financeMonth = data.date.slice(0, 7);
    financeYear = Number(data.date.slice(0, 4));
    if (form.closest('.modal')) closeModal();
    saveState();
    render();
    return;
  }

  if (kind === 'budget') {
    state.finance.budget = Math.max(0, Math.round(Number(fd.get('budget')) || 0));
    closeModal();
    saveState();
    render();
    toast(state.finance.budget ? '月度预算已保存' : '已取消预算');
    return;
  }
});

/* ==================== 日期框 ====================
   原生 <input type="date"> 右侧的日历图标被 CSS 藏掉了，WebView 里光点文字区域
   不会弹选择器（真机上就是「日期点不开」）。这里主动调 showPicker() 拉起系统日历；
   没有这个 API 的老 WebView 退回到 focus。capture 阶段处理，先于其他点击逻辑。 */
document.addEventListener('click', e => {
  const inp = e.target && e.target.closest && e.target.closest('input[type="date"], input[type="time"]');
  if (!inp || inp.disabled || inp.readOnly) return;
  const now = Date.now();
  if (inp.__pickerAt && now - inp.__pickerAt < 700) return; /* 连点不重复弹 */
  inp.__pickerAt = now;
  try {
    if (typeof inp.showPicker === 'function') { inp.showPicker(); return; }
  } catch (_) { /* 非用户手势时 Chromium 会抛错，走下面的兜底 */ }
  try { inp.focus(); } catch (_) {}
}, true);

/* ==================== 点击交互 ==================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'confirm-ok') { closeConfirm(true); return; }
  if (action === 'edit-sub') { startSubEdit(el); return; }
  if (action === 'pick-note') {
    const form = el.closest('form');
    const inp = form && form.querySelector('input[name="note"]');
    if (inp) {
      inp.value = el.dataset.note || '';
      form.querySelectorAll('.nc-chip').forEach(b => b.classList.toggle('on', b.dataset.note === inp.value));
    }
    return;
  }
  if (action === 'confirm-cancel') { closeConfirm(false); return; }
  if (action === 'nav') { switchView(el.dataset.view, { openJournal: el.dataset.openJournal === '1' }); return; }
  if (action === 'open-stat') { detailKey = el.dataset.stat || 'streak'; switchView('detail'); return; }
  if (action === 'detail-back') { switchView('dashboard'); return; }
  if (action === 'toggle-quick') {
    state.settings.finQuickCollapsed = !state.settings.finQuickCollapsed;
    saveState(); render();
    return;
  }
  if (action === 'toggle-journal') {
    state.settings.journalCollapsed = !state.settings.journalCollapsed;
    saveState(); render();
    return;
  }
  if (action === 'open-cselect') { openCselect(el); return; }
  if (action === 'close-cselect') { closeCselect(); return; }
  if (action === 'pick-cselect') {
    const sel = csTarget;
    if (!sel) return;
    const idx = Number(el.dataset.idx);
    if (idx >= 0 && idx < sel.options.length) {
      sel.selectedIndex = idx;
      syncCselect(sel);
      sel.dispatchEvent(new Event('change', { bubbles: true }));
    }
    closeCselect();
    return;
  }
  if (action === 'fold-card') {
    const key = el.dataset.key;
    if (!key) return;
    const fold = state.settings.cardFold = state.settings.cardFold || {};
    fold[key] = !cardOpen(key, true);
    saveState(); render();
    return;
  }
  if (action === 'fold-journal') {
    const key = el.dataset.key;
    if (!key) return;
    const fold = state.settings.journalFold = state.settings.journalFold || {};
    fold[key] = !(Number(el.dataset.open) === 1);
    saveState(); render();
    return;
  }
  if (action === 'fold-journal-all') {
    const open = Number(el.dataset.open) === 1;
    const fold = state.settings.journalFold = state.settings.journalFold || {};
    state.journal.forEach(j => {
      const d = String(j.date || '');
      if (d.length >= 4) fold['y:' + d.slice(0, 4)] = open;
      if (d.length >= 7) fold['m:' + d.slice(0, 7)] = open;
    });
    saveState(); render();
    toast(open ? '已全部展开' : '已全部收起');
    return;
  }
  if (action === 'habit-week') {
    const dir = Number(el.dataset.dir) || 0;
    habitWeekOffset = dir === 0 ? 0 : clamp(habitWeekOffset + dir, -104, 0);
    render();
    return;
  }
  if (action === 'close-modal') { closeModal(); return; }
  if (action === 'dismiss-demo') { state.seeded = false; saveState(); render(); return; }

  /* ---- 倒数日 ---- */
  if (action === 'add-countdown') { openCountdownForm(); return; }
  if (action === 'edit-countdown') { openCountdownForm(id); return; }
  if (action === 'del-countdown') {
    const c = (state.countdowns || []).find(x => x.id === id);
    if (!c) return;
    askConfirm({ title: '删掉这个倒数日？', message: `「${c.title}」会被移除，日记内容不受影响。`, okText: '删除' }, () => {
      state.countdowns = state.countdowns.filter(x => x.id !== id);
      saveState(); render(); toast('已删除');
    });
    return;
  }
  if (action === 'move-countdown') {
    const dir = Number(el.dataset.dir) || 0;
    const list = state.countdowns || [];
    const i = list.findIndex(x => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    saveState(); render();
    return;
  }

  if (action === 'toggle-habit') {
    const key = el.dataset.date || todayKey();
    const logs = habitLogs(id);
    const i = logs.indexOf(key);
    if (i >= 0) { logs.splice(i, 1); toast('已取消打卡'); }
    else { logs.push(key); toast('打卡成功 🎉'); }
    saveState();
    render();
    return;
  }

  if (action === 'pick-cat') {
    const wrap = el.closest('.cat-picker');
    if (!wrap) return;
    wrap.querySelectorAll('.cat-opt').forEach(b => b.classList.toggle('on', b === el));
    const hid = wrap.parentElement.querySelector('input[name="category"]');
    if (hid) hid.value = el.dataset.cat || '其他';
    return;
  }
  if (action === 'pick-icon') {
    const wrap = el.closest('.icon-pick');
    if (!wrap) return;
    wrap.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
    const hid = wrap.parentElement.querySelector('input[name="icon"]');
    if (hid) hid.value = el.dataset.icon || 'leaf';
    return;
  }
  if (action === 'pick-deadline') {
    const form = el.closest('form');
    if (!form) return;
    const dInput = form.querySelector('input[name="deadline"]');
    const tInput = form.querySelector('input[name="dueTime"]');
    const label = el.querySelector('.fb-val');
    openDeadlinePicker(dInput.value, tInput.value, (d, t) => {
      dInput.value = d;
      tInput.value = t;
      if (label) {
        label.textContent = deadlineText(d, t);
        label.classList.toggle('is-empty', !d);
      }
    });
    return;
  }
  if (action === 'add-goal') { openGoalModal(); return; }
  if (action === 'edit-goal') { openGoalModal(id); return; }
  if (action === 'toggle-subfold') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const s = state.settings.subOpen = (state.settings.subOpen && typeof state.settings.subOpen === 'object') ? state.settings.subOpen : {};
    s[g.id] = !subOpenOf(g);
    saveState(); render();
    return;
  }
  if (action === 'goal-filter') {
    goalFilter = el.dataset.cat || 'all';
    render();
    return;
  }
  if (action === 'toggle-done-one') {
    const map = ensureDoneOpenMap();
    map[id] = !map[id];
    saveState(); render();
    return;
  }
  if (action === 'toggle-done-goals') {
    const map = ensureDoneOpenMap();
    const doneGoals = state.goals.filter(g => g.done);
    const expand = doneGoals.some(g => !map[g.id]);
    doneGoals.forEach(g => { map[g.id] = expand; });
    saveState(); render();
    toast(expand ? '已展开全部已完成目标' : '已收起全部已完成目标');
    return;
  }
  /* ---- 批量归档 / 清理 ---- */
  if (action === 'open-goal-batch') { openGoalBatchModal(); return; }
  if (action === 'gb-toggle') {
    const gid = el.dataset.gbId;
    if (gbSel.has(gid)) gbSel.delete(gid); else gbSel.add(gid);
    gbSyncUI();
    return;
  }
  if (action === 'gb-all') {
    const done = doneGoalsSorted();
    if (gbSel.size === done.length) gbSel.clear();
    else done.forEach(g => gbSel.add(g.id));
    gbSyncUI();
    return;
  }
  if (action === 'gb-archive') {
    if (!gbSel.size) return;
    archiveGoals([...gbSel]);
    return;
  }
  if (action === 'gb-delete') {
    const ids = [...gbSel];
    if (!ids.length) return;
    const names = state.goals.filter(g => ids.includes(g.id)).slice(0, 2).map(g => `「${g.title}」`).join('');
    const label = ids.length === 1 ? names : `${names}等 ${ids.length} 个目标`;
    askConfirm({
      title: '删除已完成目标',
      message: `${label}会连同小目标记录一起彻底删除，无法恢复。只想收起来的话，用「归档」更稳。`,
      okText: `删除 ${ids.length} 个`
    }, () => {
      const set = new Set(ids);
      const map = ensureDoneOpenMap();
      ids.forEach(i => delete map[i]);
      state.goals = state.goals.filter(g => !set.has(g.id));
      closeModal();
      saveState(); render();
      toast(`已删除 ${ids.length} 个目标`);
    });
    return;
  }
  if (action === 'toggle-arch') {
    state.settings.archOpen = !state.settings.archOpen;
    saveState(); render();
    return;
  }
  if (action === 'arch-restore') { restoreArchivedGoal(id); return; }
  if (action === 'arch-del') {
    const g = archList().find(x => x.id === id);
    if (!g) return;
    askConfirm({
      title: '删除归档目标',
      message: `「${g.title}」会从归档里彻底删除，无法恢复。`,
      okText: '删除'
    }, () => {
      state.archivedGoals = archList().filter(x => x.id !== id);
      saveState(); render(); toast('已删除');
    });
    return;
  }
  if (action === 'arch-clear') {
    const n = archList().length;
    if (!n) return;
    askConfirm({
      title: '清空归档',
      message: `归档里的 ${n} 个目标会全部彻底删除，无法恢复。只想留个回顾的话，建议先导出一份备份。`,
      okText: `清空 ${n} 个`
    }, () => {
      state.archivedGoals = [];
      saveState(); render(); toast('归档已清空');
    });
    return;
  }
  if (action === 'toggle-goal') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    if (g.done) {
      g.done = false;
      g.doneAt = null;
      const map = ensureDoneOpenMap();
      delete map[g.id];
      saveState(); render();
      toast('已恢复为进行中');
      return;
    }
    const st = goalSubStats(g);
    if (st.left > 0) {
      toast(`还有 ${st.left} 个小目标没完成，先把它们划掉吧`);
      const card = el.closest('.goal-card');
      if (card) {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        const listEl = card.querySelector('.sub-list');
        if (listEl) {
          listEl.classList.add('need-finish');
          setTimeout(() => listEl.classList.remove('need-finish'), 1800);
        }
        setTimeout(() => card.classList.remove('shake'), 500);
      }
      return;
    }
    g.done = true;
    g.doneAt = Date.now();
    ensureDoneOpenMap()[g.id] = false;
    saveState();
    render();
    toast('已标记完成，移到下方「已完成」🎉');
    return;
  }
  if (action === 'toggle-sub') {
    const g = state.goals.find(x => x.id === id);
    const t = g && (g.subtasks || []).find(s => s.id === el.dataset.sub);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    saveState();
    render();
    return;
  }
  if (action === 'del-sub') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const t = (g.subtasks || []).find(s => s.id === el.dataset.sub);
    if (!t) return;
    g.subtasks = g.subtasks.filter(s => s.id !== el.dataset.sub);
    saveState();
    render();
    toast('小目标已删除');
    return;
  }
  if (action === 'del-goal') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    askConfirm({
      title: '删除目标',
      message: `「${g.title}」的进度和小目标记录会一起删除，无法恢复。`,
      okText: '删除'
    }, () => {
      state.goals = state.goals.filter(x => x.id !== id);
      saveState(); render(); toast('目标已删除');
    });
    return;
  }
  if (action === 'goal-plus' || action === 'goal-minus') {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const step = Math.max(1, Math.round((Number(g.target) || 10) / 20));
    const dir = action === 'goal-plus' ? 1 : -1;
    g.current = clamp((Number(g.current) || 0) + dir * step, 0, 99999999);
    saveState(); render();
    return;
  }

  if (action === 'add-habit') { openHabitModal(); return; }
  if (action === 'del-habit') {
    const h = state.habits.find(x => x.id === id);
    if (!h) return;
    askConfirm({
      title: '删除习惯',
      message: `「${h.name}」的打卡记录会一起删除，无法恢复。`,
      okText: '删除'
    }, () => {
      state.habits = state.habits.filter(x => x.id !== id);
      delete state.habitLogs[id];
      saveState(); render(); toast('习惯已删除');
    });
    return;
  }

  if (action === 'edit-journal') {
    editingJournal = id;
    state.settings.journalCollapsed = false;
    saveState();
    render();
    const form = $('#journalForm');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (action === 'cancel-journal') { editingJournal = null; render(); return; }
  if (action === 'del-journal') {
    const j = state.journal.find(x => x.id === id);
    if (!j) return;
    askConfirm({
      title: '删除日记',
      message: `确定删除 ${fmtDate(j.date)} 的这篇日记吗？删除后无法恢复。`,
      okText: '删除'
    }, () => {
      state.journal = state.journal.filter(x => x.id !== id);
      if (editingJournal === id) editingJournal = null;
      saveState(); render(); toast('日记已删除');
    });
    return;
  }


  if (action === 'add-tx') { openTxModal(); return; }
  if (action === 'edit-tx') { openTxModal(id); return; }
  if (action === 'del-tx') {
    const t = state.finance.transactions.find(x => x.id === id);
    if (!t) return;
    askConfirm({
      title: '删除账单记录',
      message: `确定删除这笔${t.type === 'income' ? '收入' : '支出'}「${t.category} ${fmtMoney(t.amount)}」吗？`,
      okText: '删除'
    }, () => {
      state.finance.transactions = state.finance.transactions.filter(x => x.id !== id);
      saveState(); render(); toast('记录已删除');
    });
    return;
  }
  if (action === 'edit-budget') { openBudgetModal(); return; }
  if (action === 'set-theme') {
    const t = applyTheme(el.dataset.theme);
    saveState();
    openThemeModal();
    toast(`已切换为「${t.name}」`);
    return;
  }
  if (action === 'fin-tab') {
    finTab = el.dataset.tab === 'cat' ? 'cat' : 'tx';
    $$('#view-finance .fin-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === finTab));
    $$('#view-finance .fin-panel').forEach(p => { p.hidden = p.dataset.panel !== finTab; });
    return;
  }
  if (action === 'fin-prev') { financeMonth = shiftMonth(financeMonth, -1); render(); return; }
  if (action === 'fin-next') { financeMonth = shiftMonth(financeMonth, 1); render(); return; }
  if (action === 'fin-now') { financeMonth = todayKey().slice(0, 7); render(); return; }
  if (action === 'fin-pick-month') {
    openMonthPicker(financeMonth, m => { financeMonth = m; render(); });
    return;
  }
  if (action === 'fin-mode') {
    financeMode = el.dataset.mode === 'year' ? 'year' : 'month';
    if (financeMode === 'year') {
      financeYear = Number(financeMonth.slice(0, 4));
    } else if (Number(financeMonth.slice(0, 4)) !== financeYear) {
      const now = new Date();
      financeMonth = `${financeYear}-${pad2(financeYear === now.getFullYear() ? now.getMonth() + 1 : 1)}`;
    }
    render();
    return;
  }
  if (action === 'fin-year-prev') { financeYear -= 1; render(); return; }
  if (action === 'fin-year-next') { financeYear += 1; render(); return; }
  if (action === 'fin-year-now') { financeYear = Number(todayKey().slice(0, 4)); render(); return; }
  if (action === 'fin-open-month') {
    financeMonth = el.dataset.month;
    financeMode = 'month';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
});

/* ==================== 备份 / 分享 / 自动存档 ==================== */
const backupName = () => `人生切片备份-${todayKey()}.json`;

function backupJSON() { return JSON.stringify(state, null, 2); }

function downloadBackup(json, filename) {
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('备份文件已导出');
}

let lastSnapshotAt = 0;
/** 每次改动后静默存一份到应用私有目录，防止 localStorage 被清 */
function autoSnapshot() {
  if (!(window.AndroidBridge && typeof window.AndroidBridge.autoBackup === 'function')) return;
  const now = Date.now();
  if (now - lastSnapshotAt < 90000) return;
  lastSnapshotAt = now;
  try { window.AndroidBridge.autoBackup(JSON.stringify(state)); } catch (e) {}
}

$('#shareBtn').addEventListener('click', () => {
  try {
    const json = backupJSON();
    const filename = backupName();
    if (window.AndroidBridge && typeof window.AndroidBridge.shareBackup === 'function') {
      window.AndroidBridge.shareBackup(json, filename);
      toast('已生成备份文件，在弹出面板里选微信发送');
      return;
    }
    downloadBackup(json, filename);
  } catch (err) {
    toast('分享失败：' + err.message);
  }
});

$('#exportBtn').addEventListener('click', () => {
  try {
    const json = backupJSON();
    const filename = backupName();
    if (window.AndroidBridge && typeof window.AndroidBridge.exportBackup === 'function') {
      window.AndroidBridge.exportBackup(json, filename);
      toast('请选择备份保存位置');
      return;
    }
    downloadBackup(json, filename);
  } catch (err) {
    toast('导出失败：' + err.message);
  }
});

$('#restoreBtn').addEventListener('click', () => {
  if (!(window.AndroidBridge && typeof window.AndroidBridge.readAutoBackup === 'function')) {
    toast('当前环境没有自动存档');
    return;
  }
  let raw = '';
  try { raw = window.AndroidBridge.readAutoBackup(); } catch (e) { raw = ''; }
  if (!raw) { toast('还没有自动存档，先用一会儿再来'); return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { toast('自动存档已损坏'); return; }
  askConfirm({
    title: '恢复自动存档',
    message: '将用最近一次的自动存档覆盖当前数据。如果现在有刚写的内容，建议先「分享备份到微信」留一份。',
    icon: '♻️', okText: '恢复', accent: true
  }, () => {
    state = normalizeState(parsed);
    editingJournal = null;
    saveState();
    render();
    toast('已恢复到最近的自动存档');
  });
});

$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = typeof file.text === 'function' ? await file.text() : await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('无法读取文件'));
      reader.readAsText(file, 'UTF-8');
    });
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('文件内容不是有效的备份');
    e.target.value = '';
    askConfirm({
      title: '导入备份',
      message: '导入会覆盖当前所有数据，建议先导出一次现有备份。',
      icon: '📥', okText: '覆盖导入', accent: true
    }, () => {
      state = normalizeState(data);
      saveState();
      editingJournal = null;
      render();
      toast('数据已导入');
    });
  } catch (err) {
    toast('导入失败：' + err.message);
  }
});

/* 原生层在收到「用其他应用打开 .json」时调用，例如直接从微信打开备份文件 */
window.receiveImportFile = function (text, name) {
  let data = null;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    toast('这份文件不是有效的备份');
    return;
  }
  const cnt = k => (Array.isArray(data[k]) ? data[k].length : 0);
  const shortName = name && name.length > 40 ? name.slice(0, 20) + '…' + name.slice(-12) : name;
  const src = shortName ? `「${shortName}」` : '这份备份';
  askConfirm({
    title: '导入备份',
    message: `${src}\n目标 ${cnt('goals')} 个、日记 ${cnt('journal')} 篇、账单 ${cnt('finance')} 笔、习惯 ${cnt('habits')} 个。\n导入会覆盖当前所有数据。`,
    icon: '📥', okText: '覆盖导入', accent: true
  }, () => {
    state = normalizeState(data);
    saveState();
    editingJournal = null;
    render();
    toast('数据已导入');
  });
};

window.receiveImportError = function (msg) {
  toast(msg || '无法读取该文件');
};

$('#themeBtn').addEventListener('click', () => {
  openThemeModal();
});

$('#resetBtn').addEventListener('click', () => {
  /* 点之前先把设置抽屉收起来：删除类操作不该和抽屉动画抢视线 */
  closeMobileTools();
  const doWipe = () => {
    const theme = state.settings.theme;
    state = { goals: [], archivedGoals: [], habits: [], habitLogs: {}, journal: [], countdowns: [], finance: { transactions: [], budget: 0 }, settings: { theme } };
    editingJournal = null;
    financeMonth = todayKey().slice(0, 7);
    financeFilter = 'all';
    financeMode = 'month';
    financeYear = Number(todayKey().slice(0, 4));
    saveState();
    render();
    toast('已清空，重新开始 🌱');
  };
  /* 两道确认：第一道讲清后果，第二道才是真正的删除键，手滑连点也删不掉 */
  askConfirm({
    title: '清空所有数据',
    message: '目标（含已归档）、习惯、日记和账单都会被删除，无法恢复。\n建议先导出备份。',
    icon: '🗑️', okText: '继续'
  }, () => {
    /* 稍等一下再弹第二道：让第一次弹窗的关闭动作看得出来，
       否则内容原地换掉，容易让人以为没反应又点一次 */
    setTimeout(() => {
      askConfirm({
        title: '真的要清空？',
        message: '这一步不可撤销。\n确认后立刻删除全部记录，只能靠之前导出的备份找回。',
        icon: '⚠️', okText: '确认清空', cancelText: '我再想想'
      }, doWipe);
    }, 160);
  });
});

function androidHandleBack() {
  if (document.getElementById('cselectPop')) { closeCselect(); return true; }
  if (!confirmEl.classList.contains('hidden')) { closeConfirm(false); return true; }
  if (!modalEl.classList.contains('hidden')) { closeModal(); return true; }
  if (mobileTools.classList.contains('mobile-open')) { closeMobileTools(); return true; }
  if (currentView !== 'dashboard') { switchView('dashboard'); return true; }
  return false;
}

/* ==================== 启动 ==================== */
state = loadState();
/* 侧栏按钮统一用线性图标（主题按钮由 applyTheme 负责） */
(function paintSidebarIcons() {
  const map = { share: ICON_SHARE, export: ICON_DOWNLOAD, import: ICON_UPLOAD, restore: ICON_RESTORE, reset: ICON_TRASH };
  document.querySelectorAll('.sidebar-foot button[data-ico]').forEach(b => {
    const svg = map[b.dataset.ico];
    if (!svg || b.querySelector('.bi')) return;
    b.insertAdjacentHTML('afterbegin', `<span class="bi">${svg}</span>`);
  });
})();
applyTheme(state.settings.theme);
/* 左右滑动切页（按底部标签顺序） */
initSwipe(document.querySelector('.main'));
const initialRaw = (location.hash || '').replace('#', '');
/* 老链接里的 #learning 已经并进目标页 */
const initialView = initialRaw === 'learning' ? 'goals' : initialRaw;
/* 启动封面：1.5 秒后开始淡出（CSS 合成层动画），动画走完再渲染首屏，
   避免首屏 render 的重活和淡出动画抢主线程导致卡顿 */
(function boot() {
  const el = document.getElementById('splash');
  if (!el || document.documentElement.classList.contains('no-splash')) {
    if (el) el.remove();
    switchView(VIEW_META[initialView] ? initialView : 'dashboard');
    return;
  }
  document.documentElement.classList.add('booting');
  setTimeout(() => {
    if (el.parentNode) el.remove();
    document.documentElement.classList.remove('booting');
    /* 封面退场后再渲染首屏，主线程此刻是干净的 */
    switchView(VIEW_META[initialView] ? initialView : 'dashboard');
  }, 2020);
})();
window.addEventListener('hashchange', () => {
  const v = (location.hash || '').replace('#', '');
  const view = v === 'learning' ? 'goals' : v;
  if (VIEW_META[view] && view !== currentView) switchView(view);
});

/* 跨零点 / 从后台切回时，把「今日一句」换成当天的 */
function refreshQuote() {
  const sub = document.getElementById('pageSub');
  if (sub && sub.classList.contains('quote-line')) sub.textContent = quoteOfDay();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshQuote();
});
setInterval(refreshQuote, 60000);

window.androidHandleBack = androidHandleBack;
</script>
</body>
