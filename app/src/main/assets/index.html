/* ==================== 左右滑动切页 ==================== */
/* 底部标签顺序即滑动顺序：手指向左拨 → 下一个标签；向右拨 → 上一个 */
const SWIPE_BLOCK_SEL = 'input, textarea, select, .hm-wrap, .chart, .donut-wrap, .goal-filters, .sess-pick, .seg, .month-nav, .week-nav, .cselect-btn';
let swipe = null;
let suppressTap = false;

function swipeAllowed(target) {
  if (currentView === 'detail') return false;
  if (VIEW_ORDER.indexOf(currentView) < 0) return false;
  if (!modalEl.classList.contains('hidden')) return false;
  if (!confirmEl.classList.contains('hidden')) return false;
  const remind = document.getElementById('remind');
  if (remind && remind.classList.contains('show')) return false;
  if (!target || !target.closest) return false;
  if (target.closest(SWIPE_BLOCK_SEL)) return false;
  /* 容器本身可横向滚动（比如筛选条、柱状图）时不劫持手势 */
  let el = target;
  while (el && el !== document.body) {
    const st = getComputedStyle(el);
    if ((st.overflowX === 'auto' || st.overflowX === 'scroll') && el.scrollWidth > el.clientWidth + 6) return false;
    el = el.parentElement;
  }
  return true;
}

function initSwipe(el) {
  el.addEventListener('touchstart', e => {
    swipe = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (!swipeAllowed(e.target)) return;
    swipe = {
      x: t.clientX, y: t.clientY, dx: 0, dy: 0, lock: 0,
      at: Date.now(),
      viewEl: document.getElementById('view-' + currentView)
    };
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!swipe || e.touches.length !== 1) return;
    const t = e.touches[0];
    swipe.dx = t.clientX - swipe.x;
    swipe.dy = t.clientY - swipe.y;
    if (!swipe.lock) {
      if (Math.abs(swipe.dx) < 10 && Math.abs(swipe.dy) < 10) return;
      /* 横着拨才接管，竖着拨留给页面滚动 */
      swipe.lock = Math.abs(swipe.dx) > Math.abs(swipe.dy) * 1.3 ? 1 : -1;
      if (swipe.lock === 1 && swipe.viewEl) swipe.viewEl.classList.add('swiping');
    }
    if (swipe.lock === 1 && swipe.viewEl) {
      if (e.cancelable) e.preventDefault();
      swipe.viewEl.style.transform = `translate3d(${(swipe.dx * 0.42).toFixed(1)}px, 0, 0)`;
    }
  }, { passive: false });

  const finish = () => {
    const s = swipe;
    swipe = null;
    if (!s || s.lock !== 1 || !s.viewEl) return;
    const idx = VIEW_ORDER.indexOf(currentView);
    const far = Math.abs(s.dx) > Math.min(88, window.innerWidth * 0.22)
      || (Math.abs(s.dx) > 42 && Date.now() - s.at < 260);
    const to = s.dx < 0 ? idx + 1 : idx - 1;
    s.viewEl.classList.remove('swiping');
    if (far && to >= 0 && to < VIEW_ORDER.length) {
      s.viewEl.style.transform = '';
      /* 滑动结束后别把这次手势当成点击（避免误触卡片按钮） */
      suppressTap = true;
      setTimeout(() => { suppressTap = false; }, 360);
      switchView(VIEW_ORDER[to], { dir: s.dx < 0 ? 1 : -1 });
    } else {
      s.viewEl.classList.add('swipe-return');
      requestAnimationFrame(() => { s.viewEl.style.transform = ''; });
      setTimeout(() => s.viewEl.classList.remove('swipe-return'), 260);
    }
  };
  el.addEventListener('touchend', finish, { passive: true });
  el.addEventListener('touchcancel', finish, { passive: true });
}

/* 手势后的那一次 click 直接掐掉 */
document.addEventListener('click', e => {
  if (!suppressTap) return;
  suppressTap = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* ==================== 概览页 ==================== */
function heatmapHTML() {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const start = addDays(now, -dow - 11 * 7);
  let cells = '';
  for (let w = 0; w < 12; w++) {
    for (let d = 0; d < 7; d++) {
      const date = addDays(start, w * 7 + d);
      const key = toKey(date);
      const future = date > now;
      const score = future ? 0 : activityScore(key);
      const lvl = score === 0 ? 0 : score <= 1 ? 1 : score <= 3 ? 2 : 3;
      cells += `<div class="hm-cell lv${lvl}${future ? ' future' : ''}" title="${fmtDate(key)} · ${score ? score + ' 项活动' : '无记录'}"></div>`;
    }
  }
  return `<div class="hm-wrap"><div class="hm-grid">${cells}</div></div>
    <div class="hm-legend"><span>少</span><i class="hm-cell lv0"></i><i class="hm-cell lv1"></i><i class="hm-cell lv2"></i><i class="hm-cell lv3"></i><span>多</span><span style="margin-left:auto">最近 12 周</span></div>`;
}

function studyChartHTML() {
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(new Date(), -i));
  const mins = days.map(d => sessionsOn(toKey(d)).reduce((a, s) => a + (Number(s.minutes) || 0), 0));
  const max = Math.max(30, ...mins);
  const bars = days.map((d, i) => {
    const m = mins[i];
    const h = m ? Math.max(6, Math.round(m / max * 100)) : 0;
    const label = i % 2 === 0 || i === days.length - 1 ? `${d.getMonth() + 1}/${d.getDate()}` : '';
    return `<div class="bar-col" title="${fmtDate(toKey(d))} · ${m ? fmtDuration(m) : '没有记录'}">
      <div class="bar-track"><div class="bar-fill${m ? '' : ' zero'}" style="height:${m ? h : 3}%"></div></div>
      <span class="bar-label">${label}</span>
    </div>`;
  }).join('');
  return `<div class="chart">${bars}</div>`;
}

/* 环形占比图：items = [{ label, value, color, valueText }] */
function donutChart(items, opts) {
  const o = opts || {};
  const list = (items || []).filter(i => (Number(i.value) || 0) > 0);
  const total = list.reduce((a, i) => a + (Number(i.value) || 0), 0);
  const R = 52, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = list.map(it => {
    const len = total ? (Number(it.value) || 0) / total * C : 0;
    const seg = len > 0.5 ? `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${it.color}"
      stroke-width="17" stroke-dasharray="${Math.max(len - 2.4, 0.5)} ${C}"
      stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"></circle>` : '';
    acc += len;
    return seg;
  }).join('');
  const center = total
    ? `<text x="60" y="57" text-anchor="middle" class="dn-v">${esc(o.center != null ? o.center : total)}</text>
       <text x="60" y="72" text-anchor="middle" class="dn-l">${esc(o.centerLabel || '合计')}</text>`
    : `<text x="60" y="60" text-anchor="middle" class="dn-l">暂无数据</text>`;
  const rows = list.map(it => {
    const pct = total ? Math.round((Number(it.value) || 0) / total * 1000) / 10 : 0;
    return `<li><i style="background:${it.color}"></i><span class="dn-name">${esc(it.label)}</span>
      <span class="dn-pct">${pct}%</span>
      ${it.valueText ? `<span class="dn-val">${esc(it.valueText)}</span>` : ''}</li>`;
  }).join('');
  return `<div class="donut-wrap">
    <div class="donut-figure"><svg viewBox="0 0 120 120" class="donut" role="img">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="17" opacity=".55"></circle>
      ${segs}${center}</svg></div>
    ${rows ? `<ul class="donut-legend">${rows}</ul>` : `<div class="small muted">这个时间段还没有记录。</div>`}
  </div>`;
}

function goalSubStats(g) {

}

/** 小目标折叠状态：默认展开；用户手动收起后记住该目标的选择 */
function subOpenOf(g) {
  const m = (state.settings.subOpen && typeof state.settings.subOpen === 'object' && !Array.isArray(state.settings.subOpen))
    ? state.settings.subOpen : {};
  if (Object.prototype.hasOwnProperty.call(m, g.id)) return !!m[g.id];
  /* 学习型卡片默认把「小目标」收起来，先让进度和记录一眼可见 */
  if (isLearnGoal(g)) return false;
  return !g.done;
}

  const blocked = !g.done && st.left > 0;
  const dueText = g.done
    ? (g.doneAt ? `完成于 ${fmtDate(toKey(new Date(g.doneAt)))}` : '已完成')

  const dueCls = g.done ? 'is-done-due' : (dl.cls || '');

  /* 学习型目标：进度由「学习标记」驱动，分类固定是学习，chip 换成类型 */

        ${g.done ? '' : `<button class="link-btn" data-action="log-session" data-id="${g.id}">记录 →</button>`}

      </div>` : (g.done ? '' : `<div class="sub-wrap"${open ? '' : ' hidden'}>

  const legacyTarget = Number(g.target) > 1 ? `${fmtNum(g.current)}/${fmtNum(g.target)}${g.unit ? ' ' + esc(g.unit) : ''}` : '';
  const countText = st.total ? `${st.done}/${st.total}` : legacyTarget;

      <div class="goal-top">
        <button class="goal-check${g.done ? ' on' : ''}${blocked ? ' locked' : ''}" data-action="toggle-goal" data-id="${g.id}" title="${g.done ? '恢复为进行中' : blocked ? `还有 ${st.left} 个小目标没完成` : '标记为已完成'}">${blocked ? '!' : '✓'}</button>

        ${g.done ? '' : `<form class="sub-add" data-form="sub" data-id="${g.id}"><input name="title" maxlength="80" placeholder="+ 添加小目标，回车保存" autocomplete="off"></form>`}
      </div>

/** 已完成目标的展开状态：{ goalId: true } */
function ensureDoneOpenMap() {
  const s = state.settings = state.settings || {};
  if (!s.doneOpen || typeof s.doneOpen !== 'object' || Array.isArray(s.doneOpen)) s.doneOpen = {};
  return s.doneOpen;
}

/** 学习连续天数：连续有记录的天数（今天没记就从昨天算起） */
function learnStreak() {
  const set = new Set(state.learning.sessions.map(s => s.date));
  let d = new Date();
  if (!set.has(toKey(d))) d = addDays(d, -1);
  let n = 0;
  while (set.has(toKey(d)) && n < 3660) { n++; d = addDays(d, -1); }
  return n;
}

/** 一条学习记录的渲染（目标页 / 概览共用） */
function sessionRowHTML(s) {
  const it = findLearn(s.itemId);
  const kind = it ? LEARN_KINDS[it.kind] : null;
  const unit = (it && it.unit) || (kind ? kind.unit : '页');
  const tag = s.progress != null
    ? `<span class="stag">${it && it.kind === 'course' ? '讲到' : '读到'} ${fmtNum(s.progress)} ${esc(unit)}</span>`
    : (s.level ? `<span class="stag">熟练度 ${clamp(s.level, 1, 5)} 级</span>` : '');
  return `<div class="session-row">
      <span class="sdate">${String(s.date).slice(5).replace('-', '/')}</span>
      <span class="stitle">${esc(it ? it.title : '已删除的学习目标')}${tag}${s.note ? ` <span class="muted small">· ${esc(truncate(s.note, 20))}</span>` : ''}</span>
      <span class="smin">${fmtDuration(s.minutes)}</span>
      <button class="icon-btn danger" data-action="del-session" data-id="${s.id}" title="删除记录" aria-label="删除记录">${ICON_TRASH}</button>
    </div>`;
}

function sessionRowsHTML(limit) {
  return [...state.learning.sessions]
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0))
    .slice(0, limit || 12)
    .map(sessionRowHTML).join('');
}

function renderGoals() {
  const all = state.goals;
  const active = all.filter(g => !g.done).sort((a, b) => {
    const da = a.deadline || '9999-12-31';
    const db = b.deadline || '9999-12-31';
    return String(da).localeCompare(String(db)) || (a.createdAt || 0) - (b.createdAt || 0);
  });
  const finished = all.filter(g => g.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  const counts = {};
  all.forEach(g => { const k = g.category || '其他'; counts[k] = (counts[k] || 0) + 1; });
  const kindCounts = { book: 0, course: 0, skill: 0 };
  all.forEach(g => { if (isLearnGoal(g)) kindCounts[g.kind]++; });
  const cats = CATS.map(c => c[0]).filter(name => counts[name] > 0 && name !== '学习');
  const plainStudy = all.filter(g => !isLearnGoal(g) && (g.category || '其他') === '学习').length;
  const filterOk = f => f === 'all'
    || (f.startsWith('kind:') && kindCounts[f.slice(5)] > 0)
    || cats.includes(f)
    || (f === '学习' && plainStudy > 0);
  if (!filterOk(goalFilter)) goalFilter = 'all';

  const match = g => {
    if (goalFilter === 'all') return true;
    if (goalFilter.startsWith('kind:')) return g.kind === goalFilter.slice(5);
    if (goalFilter === '学习') return !isLearnGoal(g) && (g.category || '其他') === '学习';
    return !isLearnGoal(g) && (g.category || '其他') === goalFilter;
  };
  const activeShown = active.filter(match);
  const doneShown = finished.filter(match);

  const groupHTML = (list, emptyText) => {
    if (!list.length) return `<div class="card" style="background:transparent;border-style:dashed"><div class="empty">${emptyText}</div></div>`;
    const order = [...new Set(list.map(g => g.category || '其他'))]
      .sort((a, b) => catOrder(a) - catOrder(b) || String(a).localeCompare(String(b)));
    return order.map(cat => {
      const items = list.filter(g => (g.category || '其他') === cat);
      return `<div class="goal-group">
        <div class="group-head">${esc(cat)}<span class="cnt">${items.length}</span></div>
        <div class="goal-grid">${items.map(goalCardHTML).join('')}</div>
      </div>`;
    }).join('');
  };

  const head = `
    <div class="page-actions">
      <h2>进行中 ${active.length} 个${finished.length ? ` · 已完成 ${finished.length} 个` : ''}</h2>
      <div class="chips">
        <button class="btn ghost" data-action="add-item">+ 学习</button>
        <button class="btn primary" data-action="add-goal">+ 目标</button>
      </div>
    </div>
    ${all.length ? `<div class="goal-filters">
      <button class="filter-chip${goalFilter === 'all' ? ' on' : ''}" data-action="goal-filter" data-cat="all">全部 ${all.length}</button>
      ${['book', 'course', 'skill'].filter(k => kindCounts[k]).map(k => `<button class="filter-chip learn${goalFilter === 'kind:' + k ? ' on' : ''}" data-action="goal-filter" data-cat="kind:${k}">${learnIcon(k)}${LEARN_KINDS[k].name} ${kindCounts[k]}</button>`).join('')}
      ${cats.map(n => `<button class="filter-chip${goalFilter === n ? ' on' : ''}" data-action="goal-filter" data-cat="${esc(n)}">${esc(n)} ${counts[n]}</button>`).join('')}
      ${plainStudy ? `<button class="filter-chip${goalFilter === '学习' ? ' on' : ''}" data-action="goal-filter" data-cat="学习">学习 ${plainStudy}</button>` : ''}
    </div>` : ''}`;

  const doneMap = (state.settings.doneOpen && typeof state.settings.doneOpen === 'object') ? state.settings.doneOpen : {};
  const anyDoneClosed = doneShown.some(g => !doneMap[g.id]);
  const doneSection = doneShown.length
    ? `<div class="done-list">${doneShown.map(g => doneMap[g.id]
      ? goalCardHTML(g, true)
      : `<button class="done-strip" data-action="toggle-done-one" data-id="${g.id}" aria-expanded="false" title="展开这条已完成目标">
           <span class="ds-tick">✓</span>
           <span class="ds-titles">${esc(g.title)}</span>
           <span class="collapse-btn pm" aria-hidden="true">${pmIcon()}</span>
         </button>`).join('')}</div>`
    : groupHTML(doneShown, '完成的目标会保留在这里，一条一个，随时可以展开回顾。');

  /* 已归档：收起来的旧目标，不占当前列表，随时能恢复 */
  const archived = (Array.isArray(state.archivedGoals) ? state.archivedGoals : [])
    .slice().sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
  const archOpen = !!state.settings.archOpen;
  const archSection = archived.length ? `
    <section class="goal-section">
      <div class="section-head"><h3>已归档</h3><span class="cnt">${archived.length}</span>
        <div class="head-tools">
          <button class="link-btn" data-action="arch-clear">清空</button>
          <button class="collapse-btn pm${archOpen ? ' minus' : ''}" data-action="toggle-arch" title="${archOpen ? '收起已归档' : '展开已归档'}" aria-label="${archOpen ? '收起已归档' : '展开已归档'}">${pmIcon()}</button>
        </div>
      </div>
      <div class="arch-list"${archOpen ? '' : ' hidden'}>
        ${archived.map(g => `<div class="arch-row">
          <div class="ar-main">
            <span class="ar-title">${esc(g.title)}</span>
            <span class="ar-meta">${esc([g.category || '其他',
              g.doneAt ? `完成于 ${fmtDate(toKey(new Date(g.doneAt)))}` : '',
              g.archivedAt ? `归档于 ${fmtDate(toKey(new Date(g.archivedAt)))}` : ''
            ].filter(Boolean).join(' · '))}</span>
          </div>
          <button class="link-btn" data-action="arch-restore" data-id="${g.id}">恢复</button>
          <button class="ar-del" data-action="arch-del" data-id="${g.id}" title="彻底删除" aria-label="彻底删除">✕</button>
        </div>`).join('')}
      </div>
    </section>` : '';

  const mainSections = all.length ? `
    <section class="goal-section">
      <div class="section-head"><h3>进行中</h3><span class="cnt">${activeShown.length}</span></div>
      ${groupHTML(activeShown, goalFilter === 'all' ? '还没有进行中的目标，点右上角新建一个。' : `「${esc(goalFilter)}」分类下没有进行中的目标。`)}
    </section>
    <section class="goal-section">
      <div class="section-head"><h3>已完成</h3><span class="cnt">${doneShown.length}</span>
        ${doneShown.length ? `<div class="head-tools">
          <button class="link-btn" data-action="open-goal-batch">批量整理</button>
          <button class="collapse-btn pm${anyDoneClosed ? '' : ' minus'}" data-action="toggle-done-goals" title="${anyDoneClosed ? '展开全部已完成目标' : '收起全部已完成目标'}" aria-label="${anyDoneClosed ? '展开全部' : '收起全部'}">${pmIcon()}</button>
        </div>` : ''}
      </div>
      ${doneSection}
    </section>` : '';

  /* 学习投入：原来「学习」页的统计搬到这里，跟目标放在同一屏 */
  const learnCount = learnGoals().length;
  const sessions = state.learning.sessions;
  const monthMin = sessions.filter(s => String(s.date).slice(0, 7) === todayKey().slice(0, 7))
    .reduce((a, s) => a + (Number(s.minutes) || 0), 0);
  const todayMin = sessionsOn(todayKey()).reduce((a, s) => a + (Number(s.minutes) || 0), 0);
  const learnOverview = (learnCount || sessions.length) ? foldCard('goals:learn', '学习投入', `
      <div class="learn-strip">
        <div class="ls-item"><b>${monthMin >= 60 ? (monthMin / 60).toFixed(1) + ' 小时' : monthMin + ' 分钟'}</b>本月</div>
        <div class="ls-sep"></div>
        <div class="ls-item"><b>${fmtDuration(todayMin)}</b>今日</div>
        <div class="ls-sep"></div>
        <div class="ls-item"><b>${learnStreak()}</b>天连续</div>
        <div class="ls-sep"></div>
        <div class="ls-item"><b>${learnCount}</b>个学习目标</div>
      </div>
      <div style="margin-top:12px">${studyChartHTML()}</div>`,
    { extra: '<span class="small muted">近 14 天</span>' }) : '';

  const learnRecent = sessions.length
    ? foldCard('goals:sessions', '最近学习记录', sessionRowsHTML(12), { extra: '<span class="small muted">最近 12 条</span>', defaultOpen: false })
    : '';

  $('#view-goals').innerHTML = `${head}
    ${learnOverview}
    ${mainSections || `<div class="card"><div class="empty"><div class="big">🎯</div>还没有目标。把想做成的事写下来，再拆成几个小目标。<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-action="add-goal">+ 新建第一个目标</button><button class="btn" data-action="add-item">+ 加个学习目标</button></div></div></div>`}
    ${learnRecent}
    ${archSection}`;
}

function renderHabits() {
  const days = habitWeekDays(habitWeekOffset);
  const tKey = todayKey();
  const items = state.habits.map(h => {
    const total = habitLogs(h.id).length;
    const st = habitStreak(h.id);
    const wk = habitWeekDays(habitWeekOffset).filter(d => habitDone(h.id, toKey(d))).length;
    const dayBtns = days.map(d => {
      const key = toKey(d);
      const on = habitDone(h.id, key);
      const future = key > tKey;
      return `<button class="day${on ? ' on' : ''}${key === tKey ? ' today' : ''}${future ? ' future' : ''}"${future ? ' disabled' : ''} data-action="toggle-habit" data-id="${h.id}" data-date="${key}" title="${fmtDate(key)}${future ? ' · 还没到' : ''}">
        <span>${WEEK[d.getDay()]}</span><b>${on ? '✓' : ''}</b>
      </button>`;
    }).join('');
    return `<div class="habit-item">
      <div class="habit-info">
        <span class="ico-badge">${habitIconSVG(h)}</span>
        <div><strong>${esc(h.name)}</strong><div class="meta"><i class="ico-inline">${ICON_FLAME}</i>连续 ${st} 天 · ${habitWeekOffset === 0 ? '本周' : '该周'} ${wk}/7 · 累计 ${total} 次</div></div>
      </div>
      <div class="week">${dayBtns}</div>
      <button class="icon-btn danger" data-action="del-habit" data-id="${h.id}" title="删除习惯">${ICON_TRASH}</button>
    </div>`;
  }).join('');
  const weekTotal = state.habits.reduce((a, h) => a + habitWeekDays(habitWeekOffset).filter(d => habitDone(h.id, toKey(d))).length, 0);

  $('#view-habits').innerHTML = `
    <div class="page-actions">
      <div class="week-nav">
        <button class="nav-btn" data-action="habit-week" data-dir="-1" title="上一周">‹</button>
        <strong>${weekTitle(habitWeekOffset)}</strong>
        <button class="nav-btn" data-action="habit-week" data-dir="1" title="下一周"${habitWeekOffset >= 0 ? ' disabled' : ''}>›</button>
        ${habitWeekOffset !== 0 ? `<button class="link-btn" data-action="habit-week" data-dir="0">回到本周</button>` : ''}
      </div>
      <button class="btn primary" data-action="add-habit">+ 新建习惯</button>
    </div>
    ${state.habits.length ? `<div class="card" style="padding-top:9px;padding-bottom:9px">
      <div class="card-head"><h3>${habitWeekOffset === 0 ? '本周打卡' : weekTitle(habitWeekOffset) + ' 打卡'}</h3><span class="small muted">${weekTotal} / ${state.habits.length * 7} 次</span></div>
      ${items}</div>` : `<div class="card"><div class="empty"><div class="big">🔥</div>习惯是复利的起点。先选一个每天 5 分钟就能完成的小习惯。<div style="margin-top:12px"><button class="btn primary" data-action="add-habit">+ 新建第一个习惯</button></div></div></div>`}
    <div class="card">
      <div class="card-head"><h3>小提示</h3><span class="small muted">让习惯更容易坚持</span></div>
      <div class="small muted" style="line-height:2">
        · 每周一自动开启新的一周，七个格子会重新变空，上一周的记录仍保留在「累计」和热力图里。<br>
        · 把新习惯绑在已有习惯后面：比如「刷完牙后，做 1 分钟冥想」。<br>
        · 从最小版本开始，先做到「每天出现」，再谈强度。<br>
        · 偶尔断一天没关系，重要的是第二天继续。
      </div>
    </div>`;
}

function energyOptions(sel) {

}

      <div class="card-head" style="margin-bottom:0">

    <label>可以更好的<textarea name="improve" rows="2" placeholder="不带评判地观察自己">${esc(d.improve)}</textarea></label>
    <label>明天要做<textarea name="tomorrow" rows="2" placeholder="只写最重要的 1-3 件">${esc(d.tomorrow)}</textarea></label>
    <label>标签<input name="tags" value="${esc(d.tags)}" placeholder="用逗号分隔，如：运动,阅读"></label>
    <div class="form-actions"><button class="btn primary" type="submit">${isEdit ? '保存修改' : '保存日记'}</button></div>

function journalEntryHTML(j) {

/** 折叠状态：未记录过时用 def */
function foldOpen(key, def) {
  const f = state.settings.journalFold;
  if (f && Object.prototype.hasOwnProperty.call(f, key)) return !!f[key];
  return !!def;
}

/** 大卡片折叠：状态存在 settings.cardFold，默认展开 */
function cardOpen(key, def) {
  const f = state.settings.cardFold;
  if (f && Object.prototype.hasOwnProperty.call(f, key)) return !!f[key];
  return def !== false;
}

/** 统一的大卡片：标题 + 右侧附加操作 + 折叠箭头，收起时只留标题一行 */
function foldCard(key, titleHTML, bodyHTML, opts) {
  const o = opts || {};
  const open = cardOpen(key, o.defaultOpen !== false);
  const extra = o.extra || '';
  /* 用 div 而不是 section：避免打乱目标页里 .goal-section:nth-of-type 的计数 */
  return `<div class="card fold-card${open ? '' : ' is-closed'}"${o.id ? ` id="${o.id}"` : ''}>
    <div class="card-head"${open ? '' : ' style="margin-bottom:0"'}>
      <h3>${titleHTML}</h3>
      <div class="chips">${extra}
        <button type="button" class="collapse-btn pm${open ? ' minus' : ''}" data-action="fold-card" data-key="${esc(key)}" aria-expanded="${open}" aria-label="${open ? '收起' : '展开'}" title="${open ? '收起' : '展开'}">${pmIcon()}</button>
      </div>
    </div>
    ${open ? `<div class="card-body">${bodyHTML}</div>` : ''}
  </div>`;
}

function renderJournal() {
  const editing = editingJournal ? state.journal.find(j => j.id === editingJournal) : null;
  const entries = [...state.journal].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0));
  const editMonth = editing ? String(editing.date).slice(0, 7) : '';

  // 按年 → 月 分组
  const yearMap = new Map();
  entries.forEach(j => {
    const y = String(j.date || '').slice(0, 4) || '未知';
    const m = String(j.date || '').slice(0, 7) || y;
    if (!yearMap.has(y)) yearMap.set(y, new Map());
    const mm = yearMap.get(y);
    if (!mm.has(m)) mm.set(m, []);
    mm.get(m).push(j);
  });

  let yIdx = 0;
  const groupsHTML = [...yearMap.entries()].map(([year, months]) => {
    const yearCount = [...months.values()].reduce((a, l) => a + l.length, 0);
    const yearKey = 'y:' + year;
    const forcedByEdit = editMonth.slice(0, 4) === year;
    const yearOpen = foldOpen(yearKey, yIdx === 0) || forcedByEdit;

    let mIdx = 0;
    const monthsHTML = [...months.entries()].map(([mKey, list]) => {
      const monthKey = 'm:' + mKey;
      const monthOpen = foldOpen(monthKey, yIdx === 0 && mIdx === 0) || editMonth === mKey;
      mIdx++;
      const label = mKey.includes('-') ? `${Number(mKey.slice(5, 7))} 月` : '未标注月份';
      return `<div class="fold-block">
        <button class="fold-head${monthOpen ? ' open' : ''}" data-action="fold-journal" data-key="${monthKey}" data-open="${monthOpen ? 1 : 0}" aria-expanded="${monthOpen}">
          <span class="collapse-btn pm fold-pm${monthOpen ? ' minus' : ''}" aria-hidden="true">${pmIcon()}</span><span class="fname">${label}</span>
          <span class="fcount">${list.length} 篇</span>
        </button>
        ${monthOpen ? `<div class="fold-body">${list.map(journalEntryHTML).join('')}</div>` : ''}
      </div>`;
    }).join('');

    yIdx++;
    return `<div class="fold-block">
      <button class="fold-head${yearOpen ? ' open' : ''}" data-action="fold-journal" data-key="${yearKey}" data-open="${yearOpen ? 1 : 0}" aria-expanded="${yearOpen}">
        <span class="collapse-btn pm fold-pm${yearOpen ? ' minus' : ''}" aria-hidden="true">${pmIcon()}</span><span class="fname">${esc(year)} 年</span>
        <span class="ftag">${months.size} 个月</span>
        <span class="fcount">${yearCount} 篇</span>
      </button>
      ${yearOpen ? `<div class="fold-sub">${monthsHTML}</div>` : ''}
    </div>`;
  }).join('');

  $('#view-journal').innerHTML = `
    ${journalFormHTML(editing, !!editing)}
    ${entries.length ? `<div class="card">
      <div class="card-head"><h3>日记归档 <span class="small muted">共 ${entries.length} 篇</span></h3>
        <button class="link-btn" data-action="fold-journal-all" data-open="1">全部展开</button>
      </div>
      ${groupsHTML}
    </div>` : `<div class="card"><div class="empty"><div class="big">✍️</div>还没有日记。每天 2 分钟，写下三件小事就够了。</div></div>`}`;
}

        <button type="button" data-action="fin-mode" data-mode="month" class="${financeMode === 'month' ? 'active' : ''}">月度</button>
        <button type="button" data-action="fin-mode" data-mode="year" class="${financeMode === 'year' ? 'active' : ''}">年度</button>

/* ==================== 记账页 ==================== */
function renderFinance() {
  if (financeMode === 'year') { renderFinanceYear(); return; }
  const month = financeMonth;
  const sum = financeSummary(month);
  const budget = Number(state.finance.budget) || 0;
  const remaining = budget - sum.expense;
  const usedPct = budget ? Math.round(sum.expense / budget * 1000) / 10 : 0;
  const over = budget > 0 && sum.expense > budget;
  const incomeCount = sum.list.filter(t => t.type === 'income').length;
  const expenseCount = sum.list.length - incomeCount;

  const summary = [
    { label: '本月收入', value: fmtMoney(sum.income), icon: ICON_TREND_UP, hint: `${incomeCount} 笔` },
    { label: '本月支出', value: fmtMoney(sum.expense), icon: ICON_TREND_DOWN, hint: `${expenseCount} 笔` },
    { label: '本月结余', value: fmtMoney(sum.balance), icon: ICON_WALLET, hint: sum.balance >= 0 ? '保持正结余' : '支出超过收入' },
    { label: '预算剩余', value: budget ? fmtMoney(remaining) : '未设置', icon: ICON_TARGET, hint: budget ? (over ? `已超支 ${fmtMoney(-remaining)}` : `预算 ${fmtMoneyShort(budget)} · 已用 ${usedPct}%`) : '点击设置月度预算', action: 'edit-budget' }
  ];

  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const nowDate = new Date();
  const daysInMonth = month === todayKey().slice(0, 7)

function renderFinanceYear() {
  const year = financeYear;
  const sum = financeYearSummary(year);
  const incomeCount = sum.list.filter(t => t.type === 'income').length;
  const expenseCount = sum.list.length - incomeCount;
  const activeMonths = sum.months.filter(m => m.income || m.expense).length;
  const avgMonthly = activeMonths ? sum.expense / activeMonths : 0;
  const savings = sum.income ? Math.round(sum.balance / sum.income * 100) : null;
  const isNowYear = year === Number(todayKey().slice(0, 4));

  const summary = [
    { label: '全年收入', value: fmtMoney(sum.income), icon: ICON_TREND_UP, hint: `${incomeCount} 笔` },
    { label: '全年支出', value: fmtMoney(sum.expense), icon: ICON_TREND_DOWN, hint: `${expenseCount} 笔` },
    { label: '全年结余', value: fmtMoney(sum.balance), icon: ICON_WALLET, hint: savings === null ? '还没有收入记录' : `储蓄率 ${savings}%` },
    { label: '月均支出', value: activeMonths ? fmtMoney(avgMonthly) : '—', icon: ICON_CALENDAR, hint: activeMonths ? `按 ${activeMonths} 个有记录月份` : '还没有记录' }
  ];

  const chartMax = Math.max(1, ...sum.months.map(m => Math.max(m.income, m.expense)));
  const chartHTML = sum.list.length ? `
    <div class="y-chart">
      ${sum.months.map(m => {
        const key = `${year}-${pad2(m.month)}`;
        const ih = m.income ? Math.max(2, Math.round(m.income / chartMax * 100)) : 0;
        const eh = m.expense ? Math.max(2, Math.round(m.expense / chartMax * 100)) : 0;
        return `<button type="button" class="y-col" data-action="fin-open-month" data-month="${key}" title="${m.month}月 · 收入 ${fmtMoney(m.income)} · 支出 ${fmtMoney(m.expense)}">
          <span class="y-bars"><i class="y-bar income" style="height:${ih}%"></i><i class="y-bar expense" style="height:${eh}%"></i></span>
          <span class="y-label">${m.month}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>收入</span>
      <span><i style="background:var(--danger);opacity:.8"></i>支出</span>
      <span class="small muted" style="margin-left:auto">点击柱形查看当月明细</span>
    </div>` : `<div class="empty">这一年还没有记录，先记几笔吧。</div>`;

  const catMap = {};
  sum.list.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const catHTML = cats.length ? cats.map(([name, amount]) => {
    const c = finCat('expense', name);
    const w = maxCat ? Math.max(3, amount / maxCat * 100) : 0;
    const share = sum.expense ? Math.round(amount / sum.expense * 100) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span class="cat-name">${c.svg}${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('expense', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这一年还没有支出记录。</div>`;

  const incMap = {};
  sum.list.filter(t => t.type === 'income').forEach(t => {
    incMap[t.category] = (incMap[t.category] || 0) + (Number(t.amount) || 0);
  });
  const incCats = Object.entries(incMap).sort((a, b) => b[1] - a[1]);
  const maxInc = incCats.length ? incCats[0][1] : 0;
  const incHTML = incCats.length ? incCats.map(([name, amount]) => {
    const c = finCat('income', name);
    const w = maxInc ? Math.max(3, amount / maxInc * 100) : 0;
    const share = sum.income ? Math.round(amount / sum.income * 100) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span class="cat-name">${c.svg}${esc(name)} <span class="muted small">· ${share}%</span></span><strong>${fmtMoney(amount)}</strong></div>
      <div class="progress slim"><i style="width:${w}%;background:${finCatColor('income', name)}"></i></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 6px">这一年还没有收入记录。</div>`;

  const topMonth = sum.months.reduce((a, m) => (m.expense > (a ? a.expense : 0) ? m : a), null);
  const topCat = cats[0];
  const maxMonthExpense = Math.max(1, ...sum.months.map(m => m.expense));
  const monthRows = sum.months.map(m => {
    const key = `${year}-${pad2(m.month)}`;
    const balance = m.income - m.expense;
    const zero = !m.income && !m.expense;
    const w = Math.round(m.expense / maxMonthExpense * 100);
    return `<tr class="${zero ? 'zero' : ''}" data-action="fin-open-month" data-month="${key}" title="查看 ${m.month} 月明细">
      <td class="m-name">${m.month}月</td>
      <td>${m.income ? fmtMoney(m.income) : '—'}</td>
      <td>${m.expense ? fmtMoney(m.expense) : '—'}</td>
      <td class="${balance < 0 ? 'text-danger' : ''}">${zero ? '—' : fmtMoney(balance)}</td>
      <td class="m-bar"><i style="width:${w}%"></i></td>
    </tr>`;
  }).join('');

  const navHTML = `<div class="month-nav">
      <button class="nav-btn" data-action="fin-year-prev" title="上一年">‹</button>
      <strong>${year}年</strong>
      <button class="nav-btn" data-action="fin-year-next" title="下一年">›</button>
      ${isNowYear ? '' : `<button class="link-btn" data-action="fin-year-now">回到今年</button>`}
    </div>`;

  $('#view-finance').innerHTML = `
    ${financeHeader(navHTML)}
    <div class="fin-stats">
      ${summary.map(s => `<div class="stat">
        <div class="stat-top"><span>${s.label}</span><span>${s.icon}</span></div>
        <strong class="money" style="font-size:19px">${s.value}</strong>
        <div class="hint">${s.hint}</div>
      </div>`).join('')}
    </div>
    <div class="year-top">
      ${foldCard('fin:ychart', '月度收支', chartHTML, { extra: `<span class="small muted">${year} 年</span>` })}
      ${foldCard('fin:yinc', '收入分类', `${incHTML}
        <div class="fin-facts">
          <div class="fin-fact"><span>记账笔数</span><strong>${sum.list.length} 笔</strong></div>
          <div class="fin-fact"><span>月均支出</span><strong>${activeMonths ? fmtMoney(avgMonthly) : '—'}</strong></div>
          <div class="fin-fact"><span>支出最多</span><strong>${topMonth ? `${topMonth.month}月 · ${fmtMoney(topMonth.expense)}` : '暂无'}</strong></div>
          <div class="fin-fact"><span>最大分类</span><strong>${topCat ? `${finCat('expense', topCat[0]).svg}${esc(topCat[0])} ${fmtMoney(topCat[1])}` : '暂无'}</strong></div>
        </div>`, { extra: '<span class="small muted">全年占比</span>' })}
    </div>
    <div class="year-bottom">
      ${foldCard('fin:ycats', '支出分类', catHTML, { extra: '<span class="small muted">全年占比</span>' })}
      <div class="card">
        <div class="card-head"><h3>月度明细</h3><span class="small muted">点击任意月份查看明细</span></div>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>月份</th><th>收入</th><th>支出</th><th>结余</th><th class="m-bar">支出趋势</th></tr></thead>
            <tbody>
              ${monthRows}
              <tr class="total">
                <td>全年合计</td>
                <td>${fmtMoney(sum.income)}</td>
                <td>${fmtMoney(sum.expense)}</td>
                <td class="${sum.balance < 0 ? 'text-danger' : ''}">${fmtMoney(sum.balance)}</td>
                <td class="m-bar"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ==================== 弹窗与提示 ==================== */
const modalEl = $('#modal');
const modalBox = $('#modalBox');

function openModal(html) {
  closeCselect();
  modalBox.innerHTML = html;
  modalEl.classList.remove('hidden');
  enhanceSelects(modalBox);
  const first = modalBox.querySelector('input:not([type="hidden"]), textarea');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal() {
  modalEl.classList.add('hidden');
  modalBox.innerHTML = '';
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ==================== 自绘下拉（替代原生 select） ==================== */
const ICON_CHEV_DOWN = '<svg class="cs-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 9.4 12 15.2l5.8-5.8"/></svg>';
const ICON_TICK = '<svg class="cs-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.6 9.6 17 19 6.8"/></svg>';

/** 把页面里所有原生 select 包一层：select 本体隐藏但仍参与表单提交，界面上用主题化按钮 */
function enhanceSelects(root) {
  (root || document).querySelectorAll('select:not([data-cs])').forEach(sel => {
    sel.setAttribute('data-cs', '1');
    const wrap = document.createElement('div');
    wrap.className = 'cselect' + (sel.classList.contains('mini-select') ? ' inline' : '');
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    sel.classList.add('cselect-native');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cselect-btn';
    btn.dataset.action = 'open-cselect';
    btn.setAttribute('aria-haspopup', 'listbox');
    wrap.appendChild(btn);
    syncCselect(sel);
    sel.addEventListener('change', () => syncCselect(sel));
    /* 点 label 文字时默认会激活 select 弹系统列表，这里拦住，改成开我们的面板 */
    const lab = sel.closest('label');
    if (lab) {
      lab.addEventListener('click', ev => {
        if (ev.target.closest('.cselect')) return;
        ev.preventDefault();
        openCselect(btn);
      });
    }
  });
}

function syncCselect(sel) {
  const wrap = sel.closest('.cselect');
  if (!wrap) return;
  const btn = wrap.querySelector('.cselect-btn');
  const opt = sel.options[sel.selectedIndex];
  btn.innerHTML = `<span class="cs-label">${esc(opt ? opt.textContent.trim() : '')}</span>${ICON_CHEV_DOWN}`;
  btn.disabled = !!sel.disabled;
}

let csTarget = null;

function cselectTitle(sel) {
  const label = sel.closest('label');
  if (!label) return '';
  const t = [...label.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
  return t ? t.textContent.trim().replace(/[（(].*?[)）]$/, '') : '';
}

function openCselect(btn) {
  const sel = btn.closest('.cselect') && btn.closest('.cselect').querySelector('select');
  if (!sel) return;
  closeCselect();
  csTarget = sel;
  const pop = document.createElement('div');
  pop.className = 'cs-pop';
  pop.id = 'cselectPop';
  pop.innerHTML = `<div class="cs-mask" data-action="close-cselect"></div>
    <div class="cs-sheet" role="listbox" aria-label="选择">
      ${cselectTitle(sel) ? `<div class="cs-title">${esc(cselectTitle(sel))}</div>` : ''}
      ${[...sel.options].map((o, i) => `<button type="button" class="cs-opt${i === sel.selectedIndex ? ' on' : ''}" role="option" aria-selected="${i === sel.selectedIndex}" data-action="pick-cselect" data-idx="${i}">
        <span class="cs-opt-label">${esc(o.textContent.trim())}</span>${i === sel.selectedIndex ? ICON_TICK : ''}
      </button>`).join('')}
    </div>`;
  document.body.appendChild(pop);
  requestAnimationFrame(() => pop.classList.add('show'));
  const on = pop.querySelector('.cs-opt.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function closeCselect() {
  const pop = document.getElementById('cselectPop');
  if (!pop) return;
  pop.classList.remove('show');
  setTimeout(() => pop.remove(), 180);
  csTarget = null;
}

/* 应用内确认框：不依赖 window.confirm，手机 WebView 与预览容器里都能正常弹出 */
const confirmEl = $('#confirm');
let confirmCallback = null;

function askConfirm(opts, onOk) {
  const o = typeof opts === 'string' ? { message: opts } : (opts || {});
  const ok = $('#confirmOk');
  $('#confirmIcon').textContent = o.icon || '⚠️';
  $('#confirmTitle').textContent = o.title || '请确认';
  $('#confirmMsg').textContent = o.message || '';
  $('#confirmCancel').textContent = o.cancelText || '取消';
  ok.textContent = o.okText || '确定';
  ok.className = 'btn ' + (o.accent ? 'primary' : 'solid-danger');
  confirmCallback = typeof onOk === 'function' ? onOk : null;
  confirmEl.classList.remove('hidden');
}

function closeConfirm(ok) {
  const cb = confirmCallback;
  confirmCallback = null;
  confirmEl.classList.add('hidden');
  if (ok && cb) cb();
}

confirmEl.addEventListener('click', e => { if (e.target === confirmEl) closeConfirm(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !confirmEl.classList.contains('hidden')) closeConfirm(false);
});

/** 截止的显示文案 */
function deadlineText(dateStr, timeStr) {
  if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return '不设截止';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '不设截止';
  const base = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 周${WEEK[d.getDay()]}`;
  return timeStr ? `${base} · ${timeStr}` : base;
}

/* ==================== 已完成目标：批量归档 / 清理 ==================== */
function doneGoalsSorted() {
  return state.goals.filter(g => g.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
}

function goalRowMeta(g, mode) {
  const st = goalSubStats(g);
  return [
    g.category || '其他',
    mode === 'archive'
      ? (g.archivedAt ? `归档于 ${fmtDate(toKey(new Date(g.archivedAt)))}` : '已归档')
      : (g.doneAt ? `完成于 ${fmtDate(toKey(new Date(g.doneAt)))}` : '已完成'),
    st.total ? `小目标 ${st.done}/${st.total}` : ''
  ].filter(Boolean).join(' · ');
}

function openGoalBatchModal() {
  const done = doneGoalsSorted();
  if (!done.length) { toast('还没有已完成的目标'); return; }
  gbTotal = done.length;
  gbSel = new Set();
  openModal(`
    <div class="modal-head"><h3>批量整理</h3><button class="close" data-action="close-modal">✕</button></div>
    <div class="goal-batch-bar">
      <span class="gb-note">已选 0 / ${gbTotal} 个</span>
      <button type="button" class="link-btn" data-action="gb-all" style="margin-left:auto">全选</button>
    </div>
    <div class="small muted" style="margin:2px 0 10px">归档只是收起来，之后还能恢复；删除才是彻底清掉。</div>
    <div class="gb-list">
      ${done.map(g => `<button type="button" class="gb-item" data-action="gb-toggle" data-gb-id="${g.id}" aria-pressed="false">
          <span class="gb-check"></span>
          <span class="gb-main">

    <div class="form-actions" style="margin-top:14px">
      <button type="button" class="btn ghost" data-action="close-modal">取消</button>
      <button type="button" class="btn solid-danger" data-action="gb-delete" data-gb="delete" disabled>删除选中</button>
      <button type="button" class="btn primary" data-action="gb-archive" data-gb="archive" disabled>归档选中</button>
    </div>`);
  gbSyncUI();
}

function gbSyncUI() {
  const box = $('#modalBox');
  if (!box) return;
  box.querySelectorAll('[data-gb-id]').forEach(el => {
    const on = gbSel.has(el.dataset.gbId);
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
    const ck = el.querySelector('.gb-check');
    if (ck) {
      ck.classList.toggle('on', on);
      ck.innerHTML = on ? ICON_TICK : '';
    }
  });
  const n = gbSel.size;
  const arc = box.querySelector('[data-gb="archive"]');
  const del = box.querySelector('[data-gb="delete"]');
  if (arc) { arc.disabled = !n; arc.textContent = n ? `归档 ${n} 个` : '归档选中'; }
  if (del) { del.disabled = !n; del.textContent = n ? `删除 ${n} 个` : '删除选中'; }
  const note = box.querySelector('.gb-note');
  if (note) note.textContent = `已选 ${n} / ${gbTotal} 个`;
  const all = box.querySelector('[data-action="gb-all"]');
  if (all) all.textContent = (gbTotal && n === gbTotal) ? '取消全选' : '全选';
}

function archList() {
  if (!Array.isArray(state.archivedGoals)) state.archivedGoals = [];
  return state.archivedGoals;
}

/** 把已完成目标挪进归档：数据保留，只是不在当前列表里 */
function archiveGoals(ids) {
  const set = new Set(ids);
  const moved = state.goals.filter(g => set.has(g.id));
  if (!moved.length) return;
  const map = ensureDoneOpenMap();
  const now = Date.now();
  moved.forEach(g => {
    g.archivedAt = now;
    delete map[g.id];
  });
  state.goals = state.goals.filter(g => !set.has(g.id));
  archList().push(...moved);
  closeModal();
  saveState();
  render();
  toast(`已归档 ${moved.length} 个，可在「已归档」里恢复`);
}

/** 从归档里恢复成已完成状态 */
function restoreArchivedGoal(id) {
  const list = archList();
  const g = list.find(x => x.id === id);
  if (!g) return;
  state.archivedGoals = list.filter(x => x.id !== id);
  g.archivedAt = 0;
  state.goals.push(g);
  ensureDoneOpenMap()[g.id] = false;
  saveState();
  render();
  toast('已恢复到「已完成」');
}

/* ---- 自绘日期 + 时间选择器（替代原生 date/time，避免系统的蓝色下拉） ---- */
function ensurePickerHost() {
  let el = document.getElementById('pickerHost');
  if (!el) {
    el = document.createElement('div');
    el.id = 'pickerHost';
    el.className = 'picker-mask hidden';
    document.body.appendChild(el);
  }
  return el;
}

function closePicker() {
  const el = document.getElementById('pickerHost');
  if (el) { el.classList.add('hidden'); el.innerHTML = ''; }
}

function openDeadlinePicker(curDate, curTime, onDone) {
  const host = ensurePickerHost();
  const pad = n => String(n).padStart(2, '0');
  const QUICK_TIMES = ['09:00', '14:00', '18:00'];
  let selDate = /^\d{4}-\d{2}-\d{2}$/.test(curDate || '') ? curDate : '';
  let selTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(curTime || '') ? curTime : '';
  let customMode = !!selTime && !QUICK_TIMES.includes(selTime);
  const start0 = selDate ? new Date(selDate + 'T00:00:00') : new Date();
  let cursor = new Date(start0.getFullYear(), start0.getMonth(), 1);

  const draw = () => {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const firstDow = new Date(y, m, 1).getDay();
    const start = new Date(y, m, 1 - firstDow);
    const tk = todayKey();
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const cls = [d.getMonth() === m ? '' : 'mute', k === tk ? 'today' : '', k === selDate ? 'on' : ''].filter(Boolean).join(' ');
      cells.push(`<button type="button" class="cal-day ${cls}" data-d="${k}">${d.getDate()}</button>`);
    }
    const ch = selTime ? clamp(Number(selTime.slice(0, 2)), 0, 23) : 9;
    const cm = selTime ? clamp(Number(selTime.slice(3)), 0, 59) : 0;
    const quick = QUICK_TIMES.map(t => `<button type="button" class="chip-btn${selTime === t && !customMode ? ' on' : ''}" data-t="${t}">${t}</button>`).join('');
    host.innerHTML = `
      <div class="picker" style="max-height:88vh;overflow:auto">
        <div class="picker-head">
          <h4>设定截止</h4>
          <div class="picker-nav">
            <button type="button" data-nav="-1" aria-label="上个月">‹</button>
            <span class="mon">${y} 年 ${m + 1} 月</span>
            <button type="button" data-nav="1" aria-label="下个月">›</button>
          </div>
        </div>
        <div class="cal-grid">
          ${['日', '一', '二', '三', '四', '五', '六'].map(w => `<span class="wd">${w}</span>`).join('')}
          ${cells.join('')}
        </div>
        <div class="picker-sep"></div>
        <div class="picker-row">
          <span class="lbl">时间</span>
          <button type="button" class="chip-btn${selTime ? '' : ' on'}" data-timeclear="1">不提醒</button>
          <button type="button" class="chip-btn" data-now="1">此刻</button>
        </div>
        <div class="time-quick">${quick}<button type="button" class="chip-btn${customMode ? ' on' : ''}" data-custom="1">自定义</button></div>
        ${customMode ? `<div class="time-custom">
          <input type="number" class="time-num" id="pickerHour" min="0" max="23" inputmode="numeric" value="${pad(ch)}" aria-label="小时">
          <span class="time-colon">:</span>
          <input type="number" class="time-num" id="pickerMin" min="0" max="59" inputmode="numeric" value="${pad(cm)}" aria-label="分钟">
          <span class="time-hint">24 小时制 · 手填任意时间</span>
        </div>` : ''}
        <div class="picker-foot">
          <button type="button" class="link-btn" data-clear="1">清除截止</button>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn ghost" data-cancel="1">取消</button>
            <button type="button" class="btn primary" data-ok="1">确定</button>
          </div>
        </div>
      </div>`;
  };

  host.onclick = e => {
    const b = e.target.closest('button');
    if (!b) { if (e.target === host) closePicker(); return; }
    if (b.dataset.nav) {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + Number(b.dataset.nav), 1);
      draw(); return;
    }
    if (b.dataset.d) { selDate = b.dataset.d; draw(); return; }
    if (b.dataset.t) { selTime = b.dataset.t; customMode = false; draw(); return; }
    if (b.dataset.custom) {
      customMode = true;
      if (!selTime) selTime = '09:00';
      draw();
      setTimeout(() => {
        const i = document.getElementById('pickerHour');
        if (i) { i.focus(); i.select(); }
      }, 30);
      return;
    }
    if (b.dataset.timeclear) { selTime = ''; customMode = false; draw(); return; }
    if (b.dataset.now) {
      const n = new Date();
      selDate = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
      cursor = new Date(n.getFullYear(), n.getMonth(), 1);
      selTime = pad(n.getHours()) + ':' + pad(n.getMinutes());
      customMode = !QUICK_TIMES.includes(selTime);
      draw(); return;
    }
    if (b.dataset.clear) { closePicker(); onDone('', ''); return; }
    if (b.dataset.cancel === '1') { closePicker(); return; }
    if (b.dataset.ok) {
      if (!selDate && selTime) { toast('先选个日期，时间才有意义'); return; }
      closePicker();
      onDone(selDate, selTime);
    }
  };

  // 自定义时间：边输边写进状态，不重绘以免丢焦点
  host.oninput = e => {
    const t = e.target;
    if (!t || !t.classList || !t.classList.contains('time-num')) return;
    const hEl = document.getElementById('pickerHour');
    const mEl = document.getElementById('pickerMin');
    const h = clamp(Number(hEl && hEl.value) || 0, 0, 23);
    const mi = clamp(Number(mEl && mEl.value) || 0, 0, 59);
    selTime = pad(h) + ':' + pad(mi);
  };
  // 失焦时把输入归一到合法范围（不重绘，避免点击「确定」被吞）
  host.addEventListener('focusout', e => {
    const t = e.target;
    if (!t || !t.classList || !t.classList.contains('time-num')) return;
    const hEl = document.getElementById('pickerHour');
    const mEl = document.getElementById('pickerMin');
    const h = clamp(Number(hEl && hEl.value) || 0, 0, 23);
    const mi = clamp(Number(mEl && mEl.value) || 0, 0, 59);
    if (hEl) hEl.value = pad(h);
    if (mEl) mEl.value = pad(mi);
    selTime = pad(h) + ':' + pad(mi);
  }, true);

  draw();
  host.classList.remove('hidden');
}

/* 三种学习标记：字段不一样才算「记得对」
   阅读 → 读到第几页；课程 → 完成到第几讲；技能 → 时长 + 熟练度 */
let sessState = null;

function openSessionModal(itemId) {
  const items = learnGoals().filter(g => !g.done);
  if (!items.length) { toast('先加一个学习目标'); return; }
  const sel = (itemId && items.some(i => i.id === itemId)) ? itemId : items[0].id;
  const it = items.find(i => i.id === sel) || items[0];
  sessState = {
    itemId: it.id,
    date: todayKey(),
    minutes: it.kind === 'course' ? 45 : 30,
    note: '',
    level: Number(it.level) || 0
  };
  drawSessionModal();
}

function sessReadFields() {
  const d = modalBox.querySelector('[name="date"]');
  const m = modalBox.querySelector('[name="minutes"]');
  const n = modalBox.querySelector('[name="note"]');
  if (d && d.value) sessState.date = d.value;
  if (m && m.value) sessState.minutes = m.value;
  if (n) sessState.note = n.value;
}

function sessProgressHTML(it, type) {
  const meta = LEARN_KINDS[type] || LEARN_KINDS.book;
  const total = Number(it.target) || 0;
  const cur = Number(it.current) || 0;
  const unit = String(it.unit || meta.unit || '').trim();
  const verb = `${meta.verb}${unit}`;
  if (!total) {
    return `<div class="sess-block">
      <div class="sp-head"><span>${verb}</span><em>还没设总量</em></div>
      <div class="small muted">点卡片右上角的编辑，填上总量（比如 400 页 / 24 讲），这里就能边记边推进度。</div>
    </div>`;
  }
  const pct = Math.round(clamp(cur / total * 100, 0, 100));
  return `<div class="sess-block">
    <div class="sp-head"><span>${verb}</span><em>共 ${fmtNum(total)} ${esc(unit)}</em></div>
    <div class="sp-row">
      <input id="sessProg" type="number" name="progress" min="0" max="${total}" step="1" value="${cur}" data-base="${cur}" data-unit="${esc(unit)}">
      <span class="sp-unit">${esc(unit)}</span>
    </div>
    <div class="progress slim"><i id="sessBar" style="width:${pct}%"></i></div>
    <div class="small muted" id="sessHint">这次没推进也正常，记下时长同样算数。</div>
  </div>`;
}

function sessSkillHTML(it) {
  const lv = clamp(sessState.level || Number(it.level) || 0, 0, 5);
  return `<div class="sess-block">
    <div class="sp-head"><span>练完之后的熟练度</span><em>${lv ? `第 ${lv} 级` : '点星星评一下'}</em></div>
    <div class="stars big" data-sess-level>
      ${[1, 2, 3, 4, 5].map(i => `<button type="button" class="${i <= lv ? 'on' : ''}" data-action="sess-level" data-level="${i}" title="设为 ${i} 级" aria-label="设为 ${i} 级">${i <= lv ? ICON_STAR_ON : ICON_STAR_OFF}</button>`).join('')}
    </div>
    <input type="hidden" name="level" value="${lv}">
  </div>`;
}

function drawSessionModal() {
  const items = learnGoals().filter(g => !g.done);
  if (!items.length) { closeModal(); return; }
  const it = items.find(i => i.id === sessState.itemId) || items[0];
  const type = LEARN_KINDS[it.kind] ? it.kind : 'book';
  const meta = LEARN_KINDS[type];
  const pills = items.map(x => {
    return `<button type="button" class="sess-opt${x.id === it.id ? ' on' : ''}" data-action="pick-sess-item" data-id="${x.id}">${learnIcon(x.kind)}<span>${esc(x.title)}</span></button>`;
  }).join('');

  openModal(`
    <div class="modal-head"><h3>记录学习</h3><button class="close" data-action="close-modal" aria-label="关闭">✕</button></div>
    <form data-form="session">
      <div class="sess-pick">${pills}</div>
      <div class="form-row">
        <label>日期<input type="date" name="date" value="${sessState.date}" required></label>
        <label>时长（分钟）<input type="number" name="minutes" min="1" max="1440" step="any" value="${sessState.minutes}" required></label>
      </div>
      ${type === 'skill' ? sessSkillHTML(it) : sessProgressHTML(it, type)}
      <label>备注<input name="note" maxlength="60" value="${esc(sessState.note)}" placeholder="${meta.noteHint}"></label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-action="close-modal">取消</button>
        <button class="btn primary" type="submit">记录这次</button>
      </div>
    </form>`);

  // 页码/讲数输入时，进度条和提示实时跟着走（不重绘，保住焦点）
  const prog = modalBox.querySelector('#sessProg');
  if (prog) {
    prog.addEventListener('input', () => {
      const total = Number(prog.max) || 0;
      const base = Number(prog.dataset.base) || 0;
      const unit = prog.dataset.unit || '';
      const v = clamp(Number(prog.value) || 0, 0, total);
      const pct = total ? Math.round(v / total * 100) : 0;
      const bar = modalBox.querySelector('#sessBar');
      const hint = modalBox.querySelector('#sessHint');
      if (bar) bar.style.width = clamp(pct, 0, 100) + '%';
      if (hint) {
        hint.textContent = v > base ? `这次 +${v - base} ${unit} · 完成后 ${pct}%`
          : v < base ? `比现在少 ${base - v} ${unit} · 完成后 ${pct}%`
            : `这次没推进也正常，记下时长同样算数。`;
      }
    });
  }
  // 打开时不抢焦点，避免手机上直接弹日历/键盘
  setTimeout(() => { const a = document.activeElement; if (a && a.blur) a.blur(); }, 80);
}
