plugins {
    id 'com.android.application'
}

android {
    namespace 'com.growthos.journal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.growthos.journal'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '1.9.B'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
